generated: '2026-07-21'
method: searched
status: published
source: https://docs.tenable.com/vulnerability-management/Content/getting-started/hexa-AI-MCP.htm
server:
  name: Tenable Hexa AI MCP Server
  transport: http
  url: https://cloud.tenable.com/mcp/
  auth:
    type: apiKey
    header: X-ApiKeys
    format: accessKey=<ACCESS_KEY>;secretKey=<SECRET_KEY>
  hosted: true          # Tenable-hosted; no local install/server required
  tool_count: ~90
description: >-
  Tenable-hosted remote MCP server exposing ~90 structured tools from Tenable's
  Exposure Data Fabric to any MCP-compatible client (Claude Desktop, Claude Code,
  Cursor). Lets an AI assistant search assets, investigate vulnerabilities, create
  dashboards, tag assets, launch scans, and build workflows against live exposure
  data. Access is enabled by default and can be gated via a custom role. Backed by
  the Vulnerability Management API (cloud.tenable.com).
capabilities:
  - search assets
  - investigate vulnerabilities
  - create dashboards
  - tag assets
  - launch scans
  - build custom workflows
references:
  - https://www.tenable.com/blog/faq-about-model-context-protocol-mcp-and-integrating-ai-for-agentic-applications
  - https://connect.tenable.com/kb/tenable-one-knowledge-base/tenable-hexa-ai-prompt-cookbook/111970
