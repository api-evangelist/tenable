aid: tenable
name: Tenable
description: >-
  Tenable is a cybersecurity and exposure-management company, maker of Nessus and
  the Tenable One platform, providing vulnerability management, web application
  scanning, cloud security, identity exposure, attack surface management and OT
  security. Its developer platform (developer.tenable.com) exposes eight OpenAPI 3
  REST APIs on cloud.tenable.com covering Vulnerability Management, Web App
  Scanning, Exposure Management, Platform & Settings, PCI ASV, MSSP, Identity
  Exposure and Downloads, all authenticated with X-ApiKeys access/secret keys, plus
  the official pyTenable SDK and a Tenable-hosted Hexa AI MCP server.
