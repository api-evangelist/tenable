- aid: tenable:tenable-attack-path-api
  name: Tenable Attack Path API
  description: >-
    The Tenable Attack Path API enables users to retrieve details about attack path findings and attack
    path vectors. A Finding is an attack technique that exists in one or more attack paths that lead to
    one or more critical assets. The Findings tab in Attack Path Analysis takes your data and pairs it
    with advanced graph analytics and the MITRE ATT&CK® Framework to create Findings, which enables you
    to understand and act on the unknowns that enable and amplify threat impact on your assets and information.
    For more information about findings, see [Attack Path](https://docs.tenable.com/exposure-management/Content/exposure-management/attack-path/attack-path.htm)
    in the _Tenable Exposure Management User Guide._
  humanURL: https://developer.tenable.com/reference/navigate
