- aid: tenable:tenable-downloads-api
  name: Tenable Downloads API
  description: >-
    The Downloads API enables customers to access and download installation and update files for available
    Tenable products. You can use the API endpoints to list product pages, list downloads available for
    a specific product, and to download a file. The endpoints can also be used to determine and download
    the latest version of a file to facilitate the automation of an installation.


    **Note:** The Tenable Downloads API uses a different server URL than the Tenable Vulnerability Management
    API:


    `https://www.tenable.com/downloads/api/v2/pages`.


    ### Authentication


    Like the Downloads website, certain files require authentication to download. When files have a `"requires_auth":
    true` attribute on the product list page, the Downloads API uses bearer token authentication and requires
    a valid token in the Authorization header to download the file:

    ```

    Authorization: Bearer AbCdEf123456

    ```


    To access or reset your authentication token, navigate to the [Authentication Token](https://www.tenable.com/downloads/api-docs)
    page.


    Examples of product downloads that **do not** require authentication include Nessus and Nessus Agents.
  humanURL: https://developer.tenable.com/reference/navigate
  baseURL: https://cloud.tenable.com
  tags:
  - Downloads
  properties:
  - type: OpenAPI
    url: openapi/tenable-downloads-api-openapi.yml
