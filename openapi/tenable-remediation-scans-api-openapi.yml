    Remediation_Scans_Request-ScanSettings-Discovery:
      title: Discovery Settings
      description: Settings that control how the scanner discovers hosts, including host discovery, ping methods, port scanning, service discovery, and identity collection.
      type: object
      properties:
        ping_the_remote_host:
          type: string
          description: "**[Discovery]** Specifies whether the scanner pings remote hosts on multiple ports to determine their availability before beginning the scan. When enabled, the system provides additional configuration options for General Settings and Ping Methods. \n\n**Note:** To scan VMware guest systems, you must set this parameter to `no`."
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'yes'
        fast_network_discovery:
          type: string
          description: '**[Discovery]** Specifies whether the scanner uses an accelerated discovery process. When enabled, the system bypasses additional verification tests normally used to distinguish between actual hosts and intermediate devices, such as proxies or load balancers, to improve discovery speed.'
          enum:
          - 'yes'
          - 'no'
          default: 'no'
          example: 'no'
        arp_ping:
          type: string
          description: '**[Discovery]** Specifies whether the scanner pings a host using its hardware address via the Address Resolution Protocol (ARP). This method only works on local networks.'
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'yes'
        tcp_ping:
          type: string
          description: '**[Discovery]** Specifies whether the scanner pings a host using TCP.'
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'yes'
        tcp_ping_dest_ports:
          type: string
          description: '**[Discovery]** Specifies the destination ports checked via TCP ping. You can specify `built-in`, a single port, or a comma-separated list of ports. For information bout which ports `built-in` includes, see the [knowledge base article](https://community.tenable.com/s/article/What-ports-does-built-in-represent).'
          default: built-in
        icmp_ping:
          type: string
          description: '**[Discovery]** Specifies whether the scanner pings a host using the Internet Control Message Protocol (ICMP).'
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'yes'
        icmp_unreach_means_host_down:
          type: string
          description: '**[Discovery]** Specifies whether the system considers a targeted host dead when the scanner receives an ICMP unreachable message from a gateway. **Note:** Some firewalls and packet filters use this same behavior for active hosts connected to a filtered port or protocol, which can cause the scanner to misidentify them as down.'
          enum:
          - 'yes'
          - 'no'
          default: 'no'
          example: 'no'
        icmp_ping_retries:
          type: string
          description: '**[Discovery]** Specifies the maximum number of attempts the system makes to retry pinging a remote host.'
          default: '2'
          example: '2'
        udp_ping:
          type: string
          description: '**[Discovery]** Specifies whether the scanner pings a host using the User Datagram Protocol (UDP). Because UDP is a stateless protocol, communication is not always reliable and screening devices may prevent remote detection.'
          enum:
          - 'yes'
          - 'no'
          default: 'no'
          example: 'no'
        scan_network_printers:
          type: string
          description: '**[Discovery]** Specifies whether the scanner scans network printers. When enabled, you can choose to surface the printer OS only or perform a full network scan.'
          enum:
          - 'yes'
          - 'no'
          default: 'no'
        scan_netware_hosts:
          type: string
          description: '**[Discovery]** Specifies whether to scan Novell Netware hosts.'
          enum:
          - 'yes'
          - 'no'
          default: 'no'
          example: 'no'
        scan_ot_devices_with_discovery:
          type: string
          description: '**[Discovery]** Specifies whether the scanner uses protocol-specific queries (via OT Discovery) to identify live Operational Technology (OT) devices and retrieve granular attributes such as make, model, and firmware. **Note:** OT discovery assets contribute to your total license count.'
          enum:
          - 'yes'
          - 'no'
          default: 'no'
          example: 'no'
        scan_ot_devices:
          type: string
          description: '**[Discovery]** Specifies whether the scanner performs a full scan of Operational Technology (OT) devices. **Caution:** Do not enable this setting in high-traffic production environments, as it can cause device interruptions.'
          enum:
          - 'yes'
          - 'no'
          default: 'no'
          example: 'no'
        wol_wait_time:
          type: string
          description: '**[Discovery]** Specifies the amount of time, in minutes, the system waits for hosts to start after sending Wake-on-LAN (WOL) magic packets before performing the scan.'
          default: '5'
          example: '5'
        unscanned_closed:
          type: string
          description: '**[Discovery]** Specifies whether the scanner considers unscanned ports as closed. When enabled, the system treats any port that falls outside the specified scan range or is not scanned by a selected port scanner as closed.'
          enum:
          - 'yes'
          - 'no'
          default: 'no'
          example: 'no'
        portscan_range:
          type: string
          description: '**[Discovery]** Specifies the range of ports to be scanned. The `default` keyword instructs the scanner to scan approximately 4,790 commonly used ports. You can also specify `all` for all 65,536 ports or provide a custom comma-separated list or range.'
          default: default
          example: default
        ssh_netstat_scanner:
          type: string
          description: '**[Discovery]** Specifies whether the scanner uses `netstat` to identify open ports via an SSH connection. This method is intended for Linux-based systems and requires configured SSH credentials.'
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'yes'
        wmi_netstat_scanner:
          type: string
          description: '**[Discovery]** Specifies whether the scanner uses `netstat` to determine open ports while performing a WMI-based scan. This method requires configured Windows credentials.


            **Note:** If this setting is enabled, the scanner ignores any custom range specified in the port range setting and treats unscanned ports as closed if the "Consider unscanned ports as closed" setting is enabled.'
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'yes'
        snmp_scanner:
          type: string
          description: '**[Discovery]** Specifies whether the scanner uses SNMP to enumerate open ports and retrieve detailed host information. This method requires configured SNMP credentials. This setting can produce more detailed audit results for devices like Cisco routers where checks determine vulnerabilities present based on the returned SNMP string.'
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'yes'
        only_portscan_if_enum_failed:
          type: string
          description: '**[Discovery]** Specifies whether the scanner performs a traditional port scan only if local port enumerators (such as SSH, WMI, or SNMP) fail to retrieve the port list.'
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'yes'
        verify_open_ports:
          type: string
          description: '**[Discovery]** Specifies whether the scanner performs additional verification to confirm that a port identified as open by a port enumerator is actually accessible.'
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'no'
        tcp_scanner:
          type: string
          description: '**[Discovery]** Specifies whether the scanner performs a full TCP connect scan to identify open ports.'
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'no'
        tcp_firewall_detection:
          type: string
          description: '**[Discovery]** Specifies the method used to detect firewalls during a TCP scan. `Automatic (normal)` allows the system to determine the most effective detection strategy automatically.'
          enum:
          - Do not detect RST rate limitation (soft)
          - Ignore closed ports (aggressive)
          - Disabled (softer)
        syn_scanner:
          type: string
          description: '**[Discovery]** Specifies whether the scanner performs a TCP SYN (half-open) scan to identify open ports.'
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'yes'
        syn_firewall_detection:
          type: string
          description: '**[Discovery]** Specifies the method used to detect firewalls during a SYN scan. `Automatic (normal)` allows the system to determine the most effective detection strategy automatically.'
          enum:
          - Do not detect RST rate limitation (soft)
          - Ignore closed ports (aggressive)
          - Disabled (softer)
        udp_scanner:
          type: string
          description: "**[Discovery]** Specifies whether the scanner performs a UDP scan to identify open ports. \n\n**Note:** Because the UDP protocol is stateless, the scanner often cannot distinguish between open and filtered ports, which can significantly increase scan duration and produce unreliable results. To improve performance and accuracy, Tenable recommends using local port enumerators, such as SSH (netstat), WMI (netstat), or SNMP."
          enum:
          - 'yes'
          - 'no'
          default: 'no'
          example: 'no'
        svc_detection_on_all_ports:
          type: string
          description: '**[Discovery]** Specifies whether the scanner attempts to identify the service running on every open port identified during the scan.'
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'yes'
        detect_ssl:
          type: string
          description: '**[Discovery]** Specifies whether the scanner attempts to detect SSL/TLS encryption on open ports.'
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'yes'
        ssl_prob_ports:
          type: string
          description: '**[Discovery]** Specifies which ports the scanner probes for SSL/TLS encryption. You can set this to `All ports`, `Known ports`, or `None`.'
          enum:
          - All ports
          - Known SSL ports
          - None
          default: Known SSL ports
          example: All Ports
        dtls_prob_ports:
          type: string
          description: '**[Discovery]** Specifies which ports the scanner probes for DTLS encryption. You can set this to `All ports`, `Known ports`, or `None`.'
          enum:
          - None
          - Known DTLS ports
          - All ports
          default: None
          example: None
        cert_expiry_warning_days:
          type: string
          description: '**[Discovery]** Specifies the number of days before an SSL/TLS certificate expires that the system generates a warning finding.'
          default: '60'
          example: '60'
        enumerate_all_ciphers:
          type: string
          description: '**[Discovery]** Specifies whether the scanner attempts to enumerate all supported SSL/TLS ciphers for each detected service.'
          enum:
          - 'yes'
          - 'no'
          default: 'yes'
          example: 'yes'
        check_crl:
          type: string
          description: '**[Discovery]** Specifies whether the scanner checks the Certificate Revocation List (CRL) to determine if a detected SSL/TLS certificate has been revoked.'
          enum:
          - 'yes'
          - 'no'
          default: 'no'
          example: 'no'
        collect_identity_data_from_ad:
          type: string
          description: '**[Discovery]** Specifies whether to collect identity data from Active Directory.'
          enum:
          - 'yes'
          - 'no'
          default: 'no'
    Remediation_Scans_ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: The HTTP status code of the error.
        error:
          type: string
          description: The standard HTTP error name.
        message:
          type: string
          description: A brief message about the cause of the error.
    Remediation_Scans_remediation-scan-object-list:
      type: object
      properties:
        control:
          type: boolean
          description: If `true`, the scan has a schedule and can be launched.
        creation_date:
          type: integer
          description: For newly-created scans, the date on which the scan configuration was originally created. For scans that have been launched at least once, this attribute does not represent the date on which the scan configuration was originally created. Instead, it represents the date on which the scan was first launched, in Unix time format.
          format: int64
        enabled:
          type: boolean
          description: Indicates whether the scan schedule is active (`true`) or inactive (`false`).
        id:
          type: integer
          description: The unique ID of the scan.
          format: int32
        last_modification_date:
          type: integer
          description: For newly-created scans, the date on which the scan configuration was created. For scans that have been launched at least once, this attribute does not represent the date on which the scan configuration was last modified. Instead, it represents the date on which the scan was last launched, in Unix time format. Tenable Vulnerability Management updates this attribute each time the scan launches.
          format: int64
        name:
          type: string
          description: The name of the scan.
        owner:
          type: string
          description: The owner of the scan.
        policy_id:
          type: integer
          description: The unique ID of the user-defined template (policy) on which the scan configuration is based.
        read:
          type: boolean
          description: A value indicating whether the user account associated with the request message has viewed the scan in the Tenable Vulnerability Management user interface. If `1`, the user account has viewed the scan results.
        schedule_uuid:
          type: string
          description: The UUID for a specific instance in the scan schedule.
        shared:
          type: boolean
          description: If `true`, the scan is shared with users other than the scan owner. The level of sharing is specified in the `acls` attribute of the scan details.
        status:
          type: string
          description: The status of the scan. For a list of possible values, see [Scan Status](doc:scan-status-tio).
        template_uuid:
          type: string
          description: The UUID of the template.
        type:
          type: string
          description: The type of scan.
        permissions:
          type: integer
          description: The requesting user's permissions for the scan.
          format: int32
        user_permissions:
          type: integer
          description: The sharing permissions for the scan.
          format: int32
        uuid:
          type: string
          description: The UUID of the remediation scan.
        wizard_uuid:
          type: string
          description: The UUID of the Tenable-provided template used to create either the scan or the user-defined template (policy) on which the scan configuration is based.
        progress:
          type: integer
          description: The progress of the scan ranging from 0 to 100.
        scan_creation_date:
          type: integer
          description: The Unix timestamp when the remediation scan run was created.
          format: int64
        remediation:
          type: integer
          description: If `1`, your vulnerability remediation actions on scan targets have been successful.
        total_targets:
          type: integer
          description: The total number of targets in the scan.
    Remediation_Scans_request-create-and-update-plugins-object:
      description: 'A list of plugins to add to the non-remediation scans. Use the [List plugin families](ref:io-plugins-families-list) endpoint to get a list of plugin families to choose from. Then, use the [List plugins in family](ref:io-plugins-family-details-id) endpoint to find plugins within the family to add to the scan.


        **Note:** This form displays limited parameters. The example below illustrates how to add two plugins within the `Web Servers` plugin family to a scan.'
      type: object
      properties:
        Web Servers:
          type: object
          description: A list of plugin families containing individual plugins to add to the scan. Use the [List plugin families](ref:io-plugins-families-list) endpoint to get a list of plugin families.
          properties:
            individual:
              type: object
              description: A list of individual plugins within the specified plugin family.
              properties:
                '11213':
                  type: string
                  description: The status (`enabled` or `disabled`) of the individual plugin within the plugin family to add to the scan.
                  enum:
                  - enabled
                  - disabled
                '18261':
                  type: string
                  description: The status (`enabled` or `disabled`) of the individual plugin within the plugin family to add to the scan.
                  enum:
                  - enabled
                  - disabled
