          description: '**[Advanced]** Specifies the SNMP port.'
          default: '161'
        additional_snmp_port1:
          type: string
          description: '**[Advanced]** Specifies an additional SNMP port.'
          default: '161'
        additional_snmp_port2:
          type: string
