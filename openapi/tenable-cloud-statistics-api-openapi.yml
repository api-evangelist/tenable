openapi: 3.2.0
info:
  title: Identity Exposure Cloud statistics API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Cloud statistics
  description: Attributes sent to tenable cloud statistics
paths:
  /api/cloud-statistics:
    get:
      summary: Get user info needed to send cloud statistics
      description: 'Required license type: ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the get /cloud-statistics response
                type: object
                additionalProperties: false
                required:
                - containerUuid
                - customerName
                - environmentType
                - isEnabled
                - userUuid
                - siteId
                - role
                properties:
                  containerUuid:
                    type: string
                  customerName:
                    type: string
                  environmentType:
                    type: string
                  isEnabled:
                    type: boolean
                  userUuid:
                    type: string
                  siteId:
                    type: string
                  role:
                    type: string
                    enum:
                    - BASIC
                    - ADMIN
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Cloud statistics
      x-tenablead-required-product-license-type:
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiCloudStatistics
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKey:
      name: x-api-key
      description: The user's API key
      in: header
      type: apiKey
x-readme:
  explorer-enabled: true
  proxy-enabled: true
