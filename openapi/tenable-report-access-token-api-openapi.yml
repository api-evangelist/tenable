openapi: 3.2.0
info:
  title: Identity Exposure Report access token API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Report access token
  description: Token to access the reports download
paths:
  /api/report-access-token:
    get:
      summary: Returns the authentication token required to pull data from Tenable Cloud
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Report Access Token
                type: object
                additionalProperties: false
                required:
                - reportAccessToken
                properties:
                  reportAccessToken:
                    type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Report access token
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiReportAccessToken
      x-operation-id-source: derived
  /api/report-access-token/refresh:
    post:
      summary: Updates the authentication token required to pull data from Tenable Cloud
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '204':
          description: ''
          content:
            application/json:
              schema:
                description: POST /report-access-token/refresh response payload
                type: object
                additionalProperties: false
                required:
                - reportAccessToken
                properties:
                  reportAccessToken:
                    type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Report access token
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: postApiReportAccessTokenRefresh
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKey:
      name: x-api-key
      description: The user's API key
      in: header
      type: apiKey
x-readme:
  explorer-enabled: true
  proxy-enabled: true
