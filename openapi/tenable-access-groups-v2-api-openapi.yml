    access-groups_v2_v2-AccessGroupPrincipal:
      type: object
      properties:
        principal_name:
          type: string
          description: The name of the user or user group. This parameter is required if the request omits the `principal_id` parameter. If a request includes both `principal_id` and `principal_name`, Tenable Vulnerability Management assigns the user or user group to the access group based on the `principal_id` parameter, and ignores the `principal_name` parameter in the request.
        principal_id:
          type: string
          description: The UUID of a user or user group. This parameter is required if the request omits the `principal_name` parameter.
        type:
          type: string
          description: "(Required) The type of principal. Valid values include:\n - all_users—Grants access to all users in your organization. That access includes `Can View` access to the assets defined in the rules parameter.\n - user—Grants access to the user you specify.\n - group—Grants access to all users assigned to the user group you specify."
          enum:
          - all_users
          - user
          - group
        permissions:
          type: array
          description: (Required) The permissions associated with the principal of the access group as described in <a href="/docs/permissions">Permissions</a>.
