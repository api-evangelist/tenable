components:
  schemas:
    access-groups_v2_v2-AssetRuleFilters:
      type: object
      properties:
        rules:
          description: An array specifying values to use when constructing an asset rule for the [POST /access-groups](ref:io-v2-access-groups-create) and [PUT /access-groups/{id}](ref:io-v2-access-groups-edit) methods.
          type: array
          items:
            $ref: '#/components/schemas/access-groups_v2_v2-AssetRuleFilter'
    access-groups_v2_v2-AssetRuleFilter:
      type: object
      properties:
        operators:
          description: "The operator that specifies how Tenable Vulnerability Management matches the terms value to asset data. Corresponds to the operator component of the rules parameter. Possible operators include:  \n* eq—Tenable Vulnerability Management matches the rule to assets based on an exact match of the specified term. Note: Tenable Vulnerability Management interprets the operator as `equals` for ipv4 rules that specify a single IP address, but interprets the operator as `contains` for ipv4 rules that specify an IP range or CIDR range.  \n* match—Tenable Vulnerability Management matches the rule to assets based a partial match of the specified term.  \n* starts—Tenable Vulnerability Management matches the rule to assets that start with the specified term.  \n* ends—Tenable Vulnerability Management matches the rule to assets that end with the specified term. \n * set-has—Tenable Vulnerability Management matches the rule to assets based on the specified `tag_uuid`.\n\nFor a complete list of operators by rule type, use the [GET /v2/access-groups/filters](ref:io-v2-access-groups-list-filters) endpoint."
          type: array
          items:
            type: string
        name:
          description: The name of the filter parameter. Corresponds to the asset rule type.
          type: string
        readable_name:
          description: The name of the field as it appears in the Tenable Vulnerability Management user interface.
          type: string
        placeholder:
          description: An example value.
          type: string
        control:
          description: Indicates how the field appears in the Tenable Vulnerability Management user interface.
          type: array
          items:
            $ref: '#/components/schemas/access-groups_v2_v2-AssetRuleFilterControl'
    access-groups_v2_v2-AccessGroupFilter:
      type: object
      properties:
        operators:
          description: Corresponds to the operator component of the `f` parameter.
          type: array
          items:
            type: string
        control:
          description: Indicates how the parameter appears in the Tenable Vulnerability Management user interface.
          type: string
        name:
          description: Corresponds to the field component of the `f` parameter.
          type: string
        readable_name:
          description: The name of the parameter as it appears in the Tenable Vulnerability Management user interface.
          type: string
    access-groups_v2_v2-AssetRuleFilterControl:
      type: object
      properties:
        type:
          description: The type of control.
          type: string
        regex:
          description: The regular expression Tenable Vulnerability Management uses to match values of the rule type.
          type: string
    access-groups_v2_PaginationResponse:
      description: An object containing pagination information for the current result set.
      type: object
      properties:
        total:
          type: integer
          format: int32
          description: The total number of records matching your search criteria.
        limit:
          type: integer
          format: int32
          description: The number of records requested (or the default value if omitted from the request).
        offset:
          type: integer
          format: int32
          description: The starting record you requested (or zero if omitted).
        sort:
          description: An array of objects specifying how the current result set is sorted.
          type: array
          items:
            $ref: '#/components/schemas/access-groups_v2_Response-PaginationSortObject'
    access-groups_v2_v2-AssetRule:
      type: object
      properties:
        type:
          type: string
          description: The type of asset rule. The asset rule type corresponds to the type of data you can specify in the `terms` parameter. For a complete list of supported rule types, use the [GET /v2/access-groups/filters](ref:io-v2-access-groups-list-filters) endpoint.
        operator:
          type: string
          description: "The operator that specifies how Tenable Vulnerability Management matches the terms value to asset data. \n\nPossible operators include: \n - eq—Tenable Vulnerability Management matches the rule to assets based on an exact match of the specified term. Note: Tenable Vulnerability Management interprets the operator as `equals` for ipv4 rules that specify a single IP address, but interprets the operator as `contains` for ipv4 rules that specify an IP range or CIDR range.\n - match—Tenable Vulnerability Management matches the rule to assets based a partial match of the specified term.\n - starts—Tenable Vulnerability Management matches the rule to assets that start with the specified term.\n - ends—Tenable Vulnerability Management matches the rule to assets that end with the specified term.\n - set-has—Tenable Vulnerability Management matches the rule to assets based on the specified `tag_uuid`.\n\nFor a complete list of operators by rule type, use the [GET /v2/access-groups/rules/filters](ref:io-v2-access-groups-list-rule-filters) endpoint."
        terms:
          description: "The values that Tenable Vulnerability Management uses to match an asset to the rule. A term must correspond to the rule type.\n\nFor example:\n - If the rule type is `aws_account`, the term is an AWS account ID.\n - If the rule type is `fqdn`, the term is a hostname or a fully-qualified domain name (FQDN).\n - If the rule type is `ipv4`, the term is an individual IPv4 address, a range of IPv4 addresses (for example, 192.0.2.57-192.0.2.60), or a CIDR range (for example, 192.0.2.57/24). \n\nFor a complete list of supported values by rule type, use the [GET /v2/access-groups/rules/filters](ref:io-v2-access-groups-list-rule-filters) endpoint.  \n\nIf you specify multiple terms values, Tenable Vulnerability Management includes an asset in the access group if the asset's attributes match any of the terms in the rule.\n<br >You can specify up to 100,000 terms per asset rule."
          type: array
          items:
            type: string
    access-groups_v2_v2-AccessGroupFilters:
      type: object
      properties:
        wildcard_fields:
          description: The fields you can use as a wildcard (`wf` parameter) value in the [GET /v2/access-groups](ref:io-v2-access-groups-list) endpoint.
          type: array
          items:
            type: string
        filters:
          description: The filters and operators for each field you can use when constructing filter (`f` parameter) values in the [GET /v2/access-groups](ref:io-v2-access-groups-list) endpoint.
          type: array
          items:
            $ref: '#/components/schemas/access-groups_v2_v2-AccessGroupFilter'
        sort:
          description: The fields you can use when constructing `sort` parameter values for the [GET /v2/access-groups](ref:io-v2-access-groups-list) endpoint.
          type: array
          items:
            $ref: '#/components/schemas/access-groups_v2_v2-AccessGroupFilterSort'
    access-groups_v2_v2-AccessGroup:
      type: object
      properties:
        container_uuid:
          type: string
          description: The UUID of your Tenable Vulnerability Management instance.
        created_at:
          type: string
          description: An ISO timestamp indicating the date and time on which the access group was created.
        updated_at:
          type: string
          description: An ISO timestamp indicating the date and time on which the access group was last modified.
        id:
          type: string
          description: The UUID of the access group.
        name:
          type: string
          description: "The name of the access group. This name must be:  \n* Unique within your Tenable Vulnerability Management instance.  \n* A maximum of 255 characters.  \n* Alphanumeric, but can include limited special characters (underscore, dash, parenthesis, brackets, colon)."
        all_assets:
          type: boolean
          description: "Specifies whether the access group is the system-provided All Assets access group: \n - If `true`, the access group is the All Assets access group. The only change you can make to this access group is to refine user membership in the group. For more information, see descriptions of the all_users and principals parameters for the [PUT /v2/access-groups/{id}](ref:io-v2-access-groups-edit) endpoint.\n - If `false`, the access group is a user-defined access group, and you can change all parameters for the group. This parameter is `false` for all access groups you create."
        version:
          type: integer
          description: Optional, user-defined value. This value must be incremented each time an access group is updated. Set to `1` by default.
        status:
          type: string
          description: "The status of the process evaluating and assigning assets to the access group. Possible values are: \n - PROCESSING—Tenable Vulnerability Management is currently evaluating assets against the asset rules for the access group. For an indication of evaluation progress, see the `processing_percent_complete` attribute for the access group.\n - COMPLETED—Tenable Vulnerability Management has successfully completed its evaluation of assets against the asset rules for the group.\n - ERROR—Tenable Vulnerability Management encountered an error while evaluating assets against asset rules for the access group. Rule validation typically prevents this status from occurring. However, if you encounter an ERROR status, Tenable recommends that you delete the existing asset rules, then recreate the rules after a short time has elapsed."
        access_group_type:
          type: string
          description: "The type of access group. It can be one of three possible types: \n * MANAGE_ASSETS—Users in this access group can view the asset records created during previous scans and scan the associated targets for those assets.\n * SCAN_TARGETS—Users in this access group can scan targets associated with the access group and view the results of those scans. Targets may be associated with existing assets.\n * ALL—This access group type is only applicable to the default system-generated \"All Assets\" access group that contains all assets in your organization. This group is referred to as the \"All Assets\" group in the user interface. By default, Tenable Vulnerability Management grants all users in this access group both CAN VIEW and CAN SCAN permissions."
          enum:
          - MANAGE_ASSETS
          - SCAN_TARGETS
          - ALL
        principals:
          description: An array of principals. Each principal represents a user or user group assigned to the access group. You cannot add an access group as a principal to another access group.
          type: array
          items:
            $ref: '#/components/schemas/access-groups_v2_v2-AccessGroupPrincipal'
        created_by_uuid:
          type: string
          description: The UUID of the user who created the access group.
        updated_by_uuid:
          type: string
          description: The UUID of the user who last modified the access group.
        updated_by_name:
          type: string
          description: The name of the user who last modified the access group.
        created_by_name:
          type: string
          description: The name of the user who created the access group.
        processing_percent_complete:
          type: integer
          description: The percentage of assets that Tenable Vulnerability Management has evaluated against the asset rules for the access group.
