components:
  schemas:
    LogoObject:
      type: object
      properties:
        uuid:
          type: string
          description: The UUID of the logo.
        container_uuid:
          type: string
          description: The UUID of the container that contains the logo.
        name:
          type: string
          description: The user-defined name of the logo.
        filename:
          type: string
          description: The filename of the logo.
    LogoAssignmentBulk:
      type: object
      required:
      - logo_uuid
      - account_uuids
      properties:
        logo_uuid:
          type: string
          description: The UUID of a logo in the Tenable MSSP Portal.
        account_uuids:
          type: array
          description: An array of customer account UUIDs in the Tenable MSSP Portal.
          items:
            type: string
    LogoListResponse:
      type: object
      properties:
        logos:
          description: An array of logo objects.
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/LogoObject'
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: The HTTP status code of the error.
        error:
          type: string
          description: The standard HTTP error name.
        message:
          type: string
          description: A brief message about the cause of the error.
    LogoUuidResponse:
      type: object
      required:
      - uuid
      properties:
        uuid:
          type: string
          description: The UUID of the logo.
    ErrorResponse-400:
      type: object
      properties:
        error:
          type: string
          description: A brief message about the missing or invalid parameter value(s).
    ErrorResponse-404:
      type: object
      properties:
        error:
          type: string
          description: A brief message about the object that could not be found.
  securitySchemes:
    Bearer:
      type: apiKey
      in: header
      name: Authorization
      description: 'Example: Bearer {{token}}'
