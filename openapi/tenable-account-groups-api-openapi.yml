              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
    delete:
      tags:
      - Account Groups
      summary: Delete account group
      description: 'Deletes the specified account group in the Tenable MSSP Portal.

        Requires ADMINISTRATOR [64] user permissions. See Permissions.'
      operationId: mssp-account-groups-delete
      parameters:
      - name: account_group_uuid
        description: The UUID of the account group to delete.
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Returned if the specified account group was deleted successfully.
          content:
            application/json:
              examples:
                response:
                  value: {}
        '401':
          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: Invalid credentials.
        '403':
          description: Returned if you do not have permissions to delete the specified account group. For more information, see [Permissions](doc:permissions).
        '404':
          description: Returned if the Tenable MSSP Platform could not find the specified account group.
          content:
            application/json:
              examples:
                response:
                  value:
                    error: Account Group with given uuid bb288beb-a20c-4ace-9631-777546cc9953 not found
        '429':
          description: Returned if you attempt to send too many requests in a specific period of time. For more information, see [Rate Limiting](doc:rate-limiting).
          content:
            text/html:
              examples:
                response:
                  value: "<html>\n\n<head>\n    <title>429 Too Many Requests</title>\n</head>\n\n<body bgcolor=\"white\">\n    <center>\n        <h1>429 Too Many Requests</h1>\n    </center>\n    <hr>\n    <center>nginx</center>\n</body>\n\n</html>"
        '500':
          description: Returned if an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
components:
  schemas:
    Request-Create-Account-Group:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          description: 'The name of the account group.


            **Note:** Account group names can only contain letters, numbers, and whitespace.'
        accountUuids:
          description: An array of account UUIDs to add to the account group.
          type: array
          items:
            type: string
            format: uuid
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: The HTTP status code of the error.
        error:
          type: string
          description: The standard HTTP error name.
        message:
          type: string
          description: A brief message about the cause of the error.
    Response-Account-Groups:
      type: object
      properties:
        accountGroupUuid:
          type: string
          format: uuid
          description: The UUID of the account group.
        parentContainerUuid:
          type: string
          format: uuid
          description: The UUID of the account group's parent container.
        name:
          type: string
          description: The name of the account group.
        lastModified:
          type: integer
          format: int64
          description: A Unix timestamp indicating the date and time when the account group was last modified. For example, `1710256733`.
        count:
          type: integer
          description: The number of accounts contained in the account group.
        accountUuids:
          description: An array of account UUIDs that belong to the account group.
          type: array
          items:
            type: string
            format: uuid
  securitySchemes:
    cloud:
      type: apiKey
      in: header
      name: X-ApiKeys
      description: Format - accessKey=ACCESS_KEY;secretKey=SECRET_KEY
x-readme:
  proxy-enabled: false
  samples-languages:
  - python
  - curl
  - node
  - powershell
  - ruby
  - javascript
  - objectivec
  - java
  - php
  - csharp
  - go
  - swift
  - kotlin
