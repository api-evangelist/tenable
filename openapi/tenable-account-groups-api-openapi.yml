openapi: 3.2.0
info:
  title: MSSP Portal Account Groups API
  description: 'The Tenable Managed Security Service Provider (MSSP) Portal API provides a secure and accessible way for MSSP administrators to manage and maintain multiple customer instances of Tenable products. Endpoints in the Tenable MSSP Portal API enables customers to view and manage your MSSP customer accounts.


    For more information about the Tenable MSSP Portal, see the Tenable MSSP Portal User Guide.'
  version: 1.0.0
servers:
- url: https://cloud.tenable.com
security:
- cloud: []
tags:
- name: Account Groups
  description: The Tenable Managed Security Service Provider (MSSP) Portal API provides a secure and accessible way for MSSP administrators to manage and maintain multiple customer instances of Tenable products.
paths:
  /mssp/accountGroup:
    post:
      tags:
      - Account Groups
      summary: Create account group
      description: 'Creates a new account group.

        Requires ADMINISTRATOR [64] user permissions. See Permissions.'
      operationId: mssp-account-groups-create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Request-Create-Account-Group'
      responses:
        '200':
          description: Returned if the account group was created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_group_uuid:
                    type: string
                    format: uuid
                    description: The UUID of the account group.
              examples:
                response:
                  value:
                    account_group_uuid: 04435a26-9da9-48f1-a782-63b2d2ca45fa
        '400':
          description: Returned if your request specified invalid parameters, if your request was improperly formatted, or if an account group with the specified name already exists.
          content:
            application/json:
              examples:
                response:
                  value:
                    error: Account group with this name already exists
        '401':
          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: Invalid credentials.
        '403':
          description: Returned if you do not have permissions to create an account group. For more information, see [Permissions](doc:permissions).
        '404':
          description: Returned if the Tenable MSSP Platform could not find the specified accounts.
        '429':
          description: Returned if you attempt to send too many requests in a specific period of time. For more information, see [Rate Limiting](doc:rate-limiting).
          content:
            text/html:
              examples:
                response:
                  value: "<html>\n\n<head>\n    <title>429 Too Many Requests</title>\n</head>\n\n<body bgcolor=\"white\">\n    <center>\n        <h1>429 Too Many Requests</h1>\n    </center>\n    <hr>\n    <center>nginx</center>\n</body>\n\n</html>"
        '500':
          description: Returned if an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
    get:
      tags:
      - Account Groups
      summary: List account groups
      description: 'Returns a list of account groups.

        Requires BASIC [16] user permissions. See Permissions.'
      operationId: mssp-account-groups-list
      responses:
        '200':
          description: Returned if the list of account groups was retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Response-Account-Groups'
              examples:
                response:
