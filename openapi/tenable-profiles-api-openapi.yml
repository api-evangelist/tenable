      properties:
        task_id:
          type: string
          description: The unique identifier (UUID) of the agent profile deletion task. You can check the status of deletion task via the [Get agent task status](ref:bulk-task-agent-status) endpoint.
        container_uuid:
          type: string
          description: The unique identifier (UUID) of the container where the task is operating.
        status:
          type: string
          description: The status of the task. Possible status values are:<ul><li>`NEW`—The task was created but has not yet started running.</li><li>`RUNNING`—The task is in progress.</li><li>`COMPLETED`—The task is done.</li><li>`FAILED`—There was an error completing the task.</li><li>`STALE`—The task has not been updated in a long time.</li></ul>
          enum:
          - NEW
          - RUNNING
          - COMPLETED
          - FAILED
          - STALE
        message:
          type: string
          description: An informative message about the state of the task.
    Profiles_response-scanner-config-object:
      title: Scanner Config Object
      description: Configuration settings and options applied to the scanner profile.
      type: object
      properties:
        version:
          description: The version applied to the members of the scanner profile.
          type: string
          example: 10.7.1
        pluginset:
          description: 'The plugin update plan configuration. You can specify what plugins to install on linked scanners during the daily plugin update.


            You can choose from the following options: <ul><li>Auto update to the latest—Specify the value `latest` to auto update to the latest.</li><li>Delay plugin updates by days—Specify a two digit number `1` to `30` indicating the number of days to delay plugin updates.</li><li>Select plugin set from last 30 days—Specify a plugin set from the last 30 days, for example `202407172302`. Plugin sets must be 12 digits.'
          type: string
          example: '202407172302'
        update_disabled:
          description: Indicates whether or not the scanners are excluded from software updates. If set to true, all scanners assigned to this profile are prevented from receiving software updates. This setting overrides scheduled freeze windows.
          type: boolean
    Profiles_request-scanner-profile-config-object:
      title: Scanner Profile Config
      description: Configuration settings and options to apply to the profile.
      type: object
      properties:
        version:
          description: The version to apply to the members of the scanner profile.
          type: string
          example: 10.7.1
        pluginset:
          description: "The plugin update plan configuration. You can specify what plugins to install on linked scanners during the daily plugin update. \n\nYou can choose from the following options: <ul><li>Auto update to the latest—Specify the value `latest` to auto update to the latest.</li><li>Delay plugin updates by days—Specify a two digit number `1` to `30` indicating the number of days to delay plugin updates.</li><li>Select plugin set from last 30 days—Specify a plugin set from the last 30 days, for example `202407172302`. Plugin sets must be 12 digits."
          type: string
          example: '202407172302'
        update_disabled:
          description: Indicates whether or not to exclude scanners from software updates. If set to true, all scanners assigned to this profile are prevented from receiving software updates. This setting overrides scheduled freeze windows.
          type: boolean
  parameters:
    Profiles_profile_uuid-path-param:
      description: The unique identifier (UUID) of the profile.
      required: true
      name: profile_uuid
      in: path
      schema:
        type: string
