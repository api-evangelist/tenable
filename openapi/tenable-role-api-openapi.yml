                          entityIds:
                            type:
                            - array
                            - 'null'
                            items:
                              type: string
                          dynamicId:
                            type:
                            - string
                            - 'null'
                            enum:
                            - self-user-id
                            - null
                            default: null
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Role
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Validates the POST /roles request
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - name
                - description
                properties:
                  name:
                    type: string
                  description:
                    type: string
      operationId: postApiRoles
      x-operation-id-source: derived
