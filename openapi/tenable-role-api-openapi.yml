openapi: 3.2.0
info:
  title: Identity Exposure Role API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Role
  description: Groupment of permissions that may be assigned to several users
paths:
  /api/roles:
    get:
      summary: Retrieve all role instances
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the get /roles response
                type: array
                items:
                  description: Role
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - name
                  - description
                  - permissions
                  properties:
                    id:
                      type: number
                    name:
                      type: string
                    description:
                      type: string
                    permissions:
                      type: array
                      items:
                        description: Permission
                        type: object
                        additionalProperties: false
                        required:
                        - entityIds
                        - action
                        - entityName
                        properties:
                          entityName:
                            type: string
                          action:
                            type: string
                          entityIds:
                            type:
                            - array
                            - 'null'
                            items:
                              type: string
                          dynamicId:
                            type:
                            - string
                            - 'null'
                            enum:
                            - self-user-id
                            - null
                            default: null
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Role
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiRoles
      x-operation-id-source: derived
    post:
      summary: Create role instance
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the get /roles response
                type: array
                minItems: 1
                items:
                  description: Role
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - name
                  - description
                  - permissions
                  properties:
                    id:
                      type: number
                    name:
                      type: string
                    description:
                      type: string
                    permissions:
                      type: array
                      items:
                        description: Permission
                        type: object
                        additionalProperties: false
                        required:
                        - entityIds
                        - action
