openapi: 3.2.0
info:
  title: Identity Exposure Attack API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Attack
  description: Attacks as detected by Tenable.ad
paths:
  /api/profiles/{profileId}/attacks:
    get:
      summary: Get all attacks
      description: 'Required license type: ioa, ioaPreview'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates attack search response payload
                type: array
                items:
                  description: Attack instance
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - directoryId
                  - attackTypeId
                  - dc
                  - date
                  - vector
                  - source
                  - destination
                  - isClosed
                  properties:
                    id:
                      type: number
                      description: Unique numeric identifier of the attack
                    directoryId:
                      type: number
                      description: Identifier of the directory the attacked Domain Controller belongs to
                    attackTypeId:
                      type: number
                      description: Identifier of the attack-type that has identified the attack
                    dc:
                      type: string
                      description: Fully qualified domain name of the attacked Domain Controller
                    date:
                      type: string
                      format: date-time
                      description: Date on which the attack has been identified
                    vector:
                      type: object
                      additionalProperties: false
                      properties:
                        template:
                          type: string
                          description: Localized description template for the attack vector
                        attributes:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required:
                            - name
                            - value
                            - valueType
                            properties:
                              name:
                                type: string
                                description: Name of the attack vector attribute
                              value:
                                type: string
                                description: JSON-stringified value of the attack vector attribute
                              valueType:
                                type: string
                                description: Type of the attack vector attribute
                      description: Attack vector data
                    source:
                      type: object
                      additionalProperties: false
                      properties:
                        ip:
                          type:
                          - string
                          - 'null'
                          description: Endpoint IP, if available
                        type:
                          enum:
                          - computer
                          - dc
                          - server
                          - user
                          - null
                          description: Endpoint object type, if available
                        hostname:
                          type:
                          - string
                          - 'null'
                          description: Endpoint hostname, if available
                      description: Information on the source of the attack
                    destination:
                      type: object
                      additionalProperties: false
                      properties:
                        ip:
                          type:
                          - string
                          - 'null'
                          description: Endpoint IP, if available
                        type:
                          enum:
                          - computer
                          - dc
                          - server
                          - user
                          - null
                          description: Endpoint object type, if available
                        hostname:
                          type:
                          - string
                          - 'null'
                          description: Endpoint hostname, if available
                      description: Information on the destination of the attack
                    isClosed:
                      type: boolean
                      description: Whether the customer has closed the attack
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Attack
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: profileId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: attackTypeIds
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        deprecated: false
      - name: dateEnd
        in: query
        schema:
          type: string
          format: date-time
        required: false
        deprecated: false
      - name: dateStart
        in: query
        schema:
          type: string
          format: date-time
        required: false
        deprecated: false
      - name: includeClosed
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        required: false
        deprecated: false
      - name: limit
        in: query
        schema:
          type: string
          pattern: ^[0-9]+$
        required: false
        deprecated: false
      - name: order
        in: query
        schema:
          type: string
          enum:
          - desc
          - asc
        required: false
        deprecated: false
      - name: resourceType
        in: query
        schema:
          type: string
          enum:
          - infrastructure
          - directory
          - hostname
          - ip
        required: true
        deprecated: false
      - name: resourceValue
        in: query
        schema:
          type: string
        required: true
        deprecated: false
      - name: search
        in: query
        schema:
          type: string
        required: false
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiProfilesByProfileIdAttacks
      x-operation-id-source: derived
  /api/profiles/{profileId}/attacks/export:
    get:
      summary: Get all attacks in CSV rows format
      description: 'Required license type: ioa, ioaPreview'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates attack search response payload
                type: array
                items:
                  description: Attack instance
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - directoryId
                  - attackTypeId
                  - dc
                  - date
                  - vector
                  - source
                  - destination
                  - isClosed
                  properties:
                    id:
                      type: number
                      description: Unique numeric identifier of the attack
                    directoryId:
                      type: number
                      description: Identifier of the directory the attacked Domain Controller belongs to
                    attackTypeId:
                      type: number
                      description: Identifier of the attack-type that has identified the attack
                    dc:
                      type: string
                      description: Fully qualified domain name of the attacked Domain Controller
                    date:
                      type: string
                      format: date-time
                      description: Date on which the attack has been identified
                    vector:
                      type: object
                      additionalProperties: false
                      properties:
                        template:
                          type: string
                          description: Localized description template for the attack vector
                        attributes:
                          type: array
                          items:
                            type: object
                            additionalProperties: false
                            required:
                            - name
                            - value
                            - valueType
                            properties:
                              name:
                                type: string
                                description: Name of the attack vector attribute
                              value:
                                type: string
                                description: JSON-stringified value of the attack vector attribute
                              valueType:
                                type: string
                                description: Type of the attack vector attribute
                      description: Attack vector data
                    source:
                      type: object
                      additionalProperties: false
                      properties:
                        ip:
                          type:
                          - string
                          - 'null'
                          description: Endpoint IP, if available
                        type:
                          enum:
                          - computer
                          - dc
                          - server
                          - user
                          - null
                          description: Endpoint object type, if available
                        hostname:
                          type:
                          - string
                          - 'null'
                          description: Endpoint hostname, if available
                      description: Information on the source of the attack
                    destination:
                      type: object
                      additionalProperties: false
                      properties:
                        ip:
                          type:
                          - string
                          - 'null'
                          description: Endpoint IP, if available
                        type:
                          enum:
                          - computer
                          - dc
                          - server
                          - user
                          - null
                          description: Endpoint object type, if available
                        hostname:
                          type:
                          - string
                          - 'null'
                          description: Endpoint hostname, if available
                      description: Information on the destination of the attack
                    isClosed:
                      type: boolean
                      description: Whether the customer has closed the attack
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Attack
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: profileId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: attackTypeIds
        in: query
        schema:
          type: array
          items:
            type: string
        required: false
        deprecated: false
      - name: dateEnd
        in: query
        schema:
          type: string
          format: date-time
        required: false
        deprecated: false
      - name: dateStart
        in: query
        schema:
          type: string
          format: date-time
        required: false
        deprecated: false
      - name: includeClosed
        in: query
        schema:
          type: string
          enum:
          - 'true'
          - 'false'
        required: false
        deprecated: false
      - name: limit
        in: query
        schema:
          type: string
          pattern: ^[0-9]+$
        required: false
        deprecated: false
      - name: order
        in: query
        schema:
          type: string
          enum:
          - desc
          - asc
        required: false
        deprecated: false
      - name: resourceType
        in: query
        schema:
          type: string
          enum:
          - infrastructure
          - directory
          - hostname
          - ip
        required: true
        deprecated: false
      - name: resourceValue
        in: query
        schema:
          type: string
        required: true
        deprecated: false
      - name: search
        in: query
        schema:
          type: string
        required: false
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiProfilesByProfileIdAttacksExport
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKey:
      name: x-api-key
      description: The user's API key
      in: header
      type: apiKey
x-readme:
  explorer-enabled: true
  proxy-enabled: true
