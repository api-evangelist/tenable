  /was/v2/plugins/{plugin_id}:
    get:
      tags:
      - Plugins
      summary: Get plugin details
      operationId: was-v2-plugins-details
      description: Returns details for the specified Tenable Web App Scanning plugin. <div class="perms-callout">Requires the Basic [16] user role or the `WAS.TOGGLE_WAS.USE` custom role privilege. See [Roles](doc:roles).</div>
      parameters:
      - in: path
        name: plugin_id
        required: true
        schema:
          type: integer
        description: The ID of a Tenable Web App Scanning plugin.
      responses:
        '200':
          description: Returned if the details for the specified plugin were retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginWithMetadata'
              examples:
                response:
                  value:
                    plugin_id: 98074
                    name: Backup file
                    family: Data Exposure
                    solution: Do not keep obsolete versions of files under the virtual web server root.
                    description: "A common practice when administering web applications is to create a copy/backup\n  of a particular file or directory prior to making any modification to the file.\n  Another common practice is to add an extension or change the name of the original\n  file to signify that it is a backup (examples include `.bak`, `.orig`, `.backup`,\n  etc.).\n\n  During the initial recon stages of an attack, cyber-criminals will attempt to\n  locate backup files by adding common extensions onto files already discovered on\n  the webserver. By analysing the response headers from the server they are able to\n  determine if the backup file exists.\n  These backup files can then assist in the compromise of the web application.\n\n  By utilising the same method, scanner was able to discover a possible backup file."
                    synopsis: Backup file
                    published: '2017-03-31T00:00:00Z'
                    patch_published: null
                    plugin_modified: '2017-10-16T00:00:00Z'
                    risk_factor: medium
                    see_also:
                    - http://www.webappsec.org/projects/threat/classes/information_leakage.shtml
                    - https://www.owasp.org/index.php/Review_Old,_Backup_and_Unreferenced_Files_for_Sensitive_Information_(OTG-CONFIG-004)
                    cvss3_base_score: 5.3
                    wasc:
                    - Predictable Resource Location
                    cwe:
                    - '530'
                    owasp:
                    - year: '2010'
                      category: A6
                    - year: '2013'
                      category: A5
                    - year: '2017'
                      category: A6
        '400':
          description: Returned if your request specifies an invalid ID for a Tenable Web App Scanning plugin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    reasons:
                    - code: INVALID_ID_FORMAT
                      reason: The provided ID of 'uniqueID' must be UUID type
        '401':
          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: Invalid credentials.
        '404':
          description: Returned if Tenable Web App Scanning cannot find the specified plugin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    reasons:
                    - code: NOT_FOUND
                      reason: Resource with ID '12345' not found
        '429':
          description: Returned if you attempt to send too many requests in a specific period of time. For more information, see [Rate Limiting](doc:rate-limiting).
          content:
            text/html:
              examples:
                response:
                  value: "<html>\n\n<head>\n    <title>429 Too Many Requests</title>\n</head>\n\n<body bgcolor=\"white\">\n    <center>\n        <h1>429 Too Many Requests</h1>\n    </center>\n    <hr>\n    <center>nginx</center>\n</body>\n\n</html>"
        '500':
          description: Returned if an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
components:
  schemas:
    PaginationResponse:
      description: An object containing pagination information for the current result set.
      type: object
      properties:
        total:
          type: integer
          format: int32
          description: The total number of records matching your search criteria.
        limit:
          type: integer
          format: int32
          description: The number of records requested (or the default value if omitted from the request).
        offset:
          type: integer
          format: int32
          description: The starting record you requested (or zero if omitted).
        sort:
          description: An array of objects specifying how the current result set is sorted.
          type: array
          items:
            $ref: '#/components/schemas/PaginationResponseSortObject'
    plugins_plugin_list_details:
      type: object
      properties:
        id:
          type: integer
          description: The ID of the plugin.
        name:
          type: string
          description: The name of the plugin.
        attributes:
          type: array
          description: The plugin attributes. For more information, see [Tenable Plugin Attributes](/docs/tenable-plugin-attributes).
          items:
            $ref: '#/components/schemas/plugins_attributes_full'
    plugins_attributes_short:
      type: object
      properties:
        attribute_name:
          type: string
          description: The name of the attribute.
        attribute_value:
          type: string
          description: The value of the attribute.
    plugins_ResponsePluginsList:
      type: object
      properties:
        plugins:
          type: array
          items:
            properties:
              id:
                type: integer
                description: The unique ID of the plugin.
              name:
                type: string
                description: The name of the plugin.
        name:
          type: string
          description: The name of the plugin family.
        id:
          type: integer
          description: The unique ID of the plugin family.
    plugins_plugins_list_response:
      type: object
      properties:
        data:
          type: object
          properties:
            plugin_details:
              type: array
              items:
                $ref: '#/components/schemas/plugins_plugin_list_details'
        size:
          type: integer
          description: The number of records in the returned result set.
        params:
          type: object
          description: The URL query parameters for the returned data set. If the request does not specify the parameters, contains default values.
          properties:
            page:
              type: integer
              description: The result set page index. For example, if page size is 10, page 2 contains records 10-19. Default value is 1.
            size:
              type: integer
              description: The result set page size. Default value is 1,000.
            last_updated:
              type: string
              description: The 'last_updated' filter value.
        total_count:
          type: integer
          description: The total number of available plugin records after Tenable Vulnerability Management applies the last_updated filter.
    Plugin:
      type: object
      description: The plugin properties.
      required:
      - plugin_id
      - name
      - family
      properties:
        plugin_id:
          description: The ID of the plugin.
          type: integer
          example: 98100
        name:
          description: The name of the plugin.
          type: string
        family:
          description: The name of the plugin family.
          type: string
    PaginationResponseSortObject:
      description: An object specifying how the current result set is sorted, including the property by which the results were sorted and the sort direction.
      type: object
      properties:
        name:
          type: string
          description: The property used to sort the results.
        order:
          type: string
          description: The sort direction for the results. `asc` for ascending or `desc` for descending.
    plugins_plugin:
      type: object
      properties:
        attributes:
          type: array
          description: The plugin attributes.
          items:
            $ref: '#/components/schemas/plugins_attributes_short'
        family_name:
          type: string
          description: The name of the plugin family.
        name:
          type: string
          description: The name of the plugin.
        id:
          type: integer
          description: The ID of the plugin.
    plugins_attributes_full:
      type: object
      properties:
        plugin_modification_date:
          type: string
          description: The date when Tenable last updated the plugin.
        plugin_version:
          type: string
          description: The version of the plugin.
        exploited_by_malware:
          type: boolean
          description: Indicates whether the vulnerability discovered by this plugin is known to be exploited by malware.
        description:
          type: string
          description: The extended description of the plugin.
        unsupported_by_vendor:
          type: boolean
          description: Indicates whether the software found by this plugin is unsupported by the software's vendor (for example, Windows 95 or Firefox 3).
        cvss_temporal_score:
          type: number
          description: The raw CVSSv2 temporal metrics for the vulnerability.
        patch_publication_date:
          type: string
          description: The date when the vendor published a patch for the vulnerability.
        see_also:
          type: array
          description: Links to external websites that contain helpful information about the vulnerability.
          items:
            type: string
        default_account:
          type: string
          description: Indicates whether the plugin checks for default accounts requiring the use of credentials other than the credentials provided in the scan policy. For more information, see [What are the plugins that test for default accounts?](https://community.tenable.com/s/article/What-are-the-plugins-that-test-for-default-accounts) in the Tenable Community Portal.
        exploit_available:
          type: boolean
          description: Indicates whether a known public exploit exists for the vulnerability.
        cve:
          type: array
          description: A list of Common Vulnerabilities and Exposures (CVE) IDs for the vulnerabilities associated with the plugin.
          items:
            type: string
        exploit_framework_canvas:
          type: boolean
          description: Indicates whether an exploit exists in the Immunity CANVAS framework.
        cvss_base_score:
          type: string
          description: The CVSSv2 base score (intrinsic and fundamental characteristics of a vulnerability that are constant over time and user environments).
        solution:
          type: string
          description: Remediation information for the vulnerability.
        cvss_vector:
          $ref: '#/components/schemas/plugins_cvss_vector'
        exploit_framework_exploithub:
          type: boolean
          description: Indicates whether an exploit exists in the ExploitHub framework.
        cpe:
          type: array
          description: A list of plugin target systems identified by Common Platform Enumeration (CPE).
          items:
            type: string
        plugin_publication_date:
          type: string
          description: The date when Tenable originally published the plugin.
        exploit_framework_core:
          type: boolean
          description: Indicates whether an exploit exists in the CORE Impact framework.
        in_the_news:
          type: boolean
          description: Indicates whether this plugin has received media attention (for example, ShellShock, Meltdown).
        has_patch:
          type: boolean
          description: Indicates whether the vendor has published a patch for the vulnerability.
        xref:
          type: array
          description: References to third-party information about the vulnerability, exploit, or update associated with the plugin. Each reference includes a type, for example, 'FEDORA', and an ID, for example, '2003-047'.
          items:
            type: string
        malware:
          type: boolean
          description: Indicates whether the plugin targets potentially malicious files or processes.
        exploit_framework_d2_elliot:
          type: boolean
          description: Indicates an exploit exists in the D2 Elliot Web Exploitation framework.
        xrefs:
          type: array
          description: References to third-party information about the vulnerability, exploit, or update associated with the plugin. Each reference includes a type and an ID. For example, 'FEDORA' and '2003-047'.
          items:
            type: string
        risk_factor:
          type: string
          description: 'The risk factor of the vulnerability associated with the plugin. The risk factor is determined based on the calculation of the CVSS score, possible values are: <ul><li>`Low`—The vulnerability has a CVSS score between 0.1 and 3.9</li><li>`Medium`—The vulnerability has a CVSS score between 4.0 and 6.9</li><li>`High`—The vulnerability has a CVSS score between 7.0 and 9.9</li><li>`Critical`—The vulnerability has a CVSS score of 10.0</li></ul> **Note:** The CVSS score is dependent on the default CVSS severity metric setting of the user''s container. This setting can be set to either CVSSv2 or CVSSv3. For information about how to change this setting, see the Severity section on the [General Settings](https://docs.tenable.com/vulnerability-management/Content/Settings/General/General.htm) page in the Tenable Vulnerability Management User Guide.'
        synopsis:
          type: string
          description: A brief summary of the vulnerability or vulnerabilities associated with the plugin.
        cvss3_temporal_score:
          type: number
          description: The CVSSv3 temporal metrics for the vulnerability.
        exploited_by_nessus:
          type: boolean
          description: Indicates whether Nessus exploited the vulnerability during the process of identification.
        cvss3_base_score:
          type: string
          description: The CVSSv3 base score (intrinsic and fundamental characteristics of a vulnerability that are constant over time and user environments).
        exploit_framework_metasploit:
          type: boolean
          description: Indicates whether an exploit exists in the Metasploit framework.
        plugin_type:
          type: string
          description: Plugin type, for example, local, remote, or combined. For more information about plugin type, see [Nessus Plugin Types and Categories](https://community.tenable.com/s/article/Nessus-Plugin-Types-and-Categories) in the Tenable Community Portal.
        vpr:
          type: object
          description: Information about the Vulnerability Priority Rating (VPR) for the plugin.
          properties:
            score:
              type: number
              format: float
              description: The Vulnerability Priority Rating (VPR) for the vulnerability. If a plugin is designed to detect multiple vulnerabilities, the VPR represents the highest value calculated for a vulnerability associated with the plugin. For more information, see <a href="https://docs.tenable.com/cloud/Content/Analysis/RiskMetrics.htm" target="_blank">Severity vs. VPR</a> in the <i>Tenable Vulnerability Management User Guide</i>.
            drivers:
              type: object
              description: The key drivers Tenable uses to calculate a vulnerability's VPR. For more information, see <a href="/docs/vpr-drivers-tio">Vulnerability Priority Rating Drivers</a>.
              properties: {}
            updated:
              type: string
              description: The ISO timestamp when Tenable Vulnerability Management last imported the VPR for this vulnerability. Vulnerability Management imports updated VPR values every time you run a scan.
    PluginWithMetadata:
      type: object
      required:
      - plugin_id
      - name
      - family
      - description
      - synopsis
      - risk_factor
      properties:
        plugin_id:
          description: The ID of the plugin used to detect the vulnerability.
          type: integer
          example: 98100
        name:
          description: The name of the plugin.
          type: string
          example: Cross-Site Scripting (XSS)
        family:
          description: The name of the plugin family.
          type: string
          example: Component Vulnerability
        solution:
          description: Remediation information for the vulnerability targeted by the plugin.
          type: string
          example: Do not keep obsolete versions of files under the virtual web server root.
        description:
          description: An extended description of the vulnerability targeted by the plugin.
          type: string
        synopsis:
          description: A short summary of the vulnerability targeted by the plugin.
          type: string
        published:
          description: The publication date of the plugin.
          type: string
          example: '2017-03-31T00:00:00'
        patch_published:
          description: The date a patch was published to fix the vulnerability targeted by the plugin.
          type: string
          format: date-time
        plugin_modified:
          description: The date when Tenable last modified the plugin.
          type: string
          example: '2017-10-16T00:00:00'
        risk_factor:
          description: "The risk factor associated with the plugin. Possible values are:\n - low\n - medium\n - high\n - critical. See the `risk_factor` attribute in [Tenable Plugin Attributes](doc:tenable-plugin-attributes)."
          type: string
          enum:
          - info
          - low
          - medium
          - high
          - critical
          example: high
        see_also:
          description: A reference link discussing the vulnerability targeted by the plugin, typically a vendor security advisory or news article.
          type: array
          items:
            type: string
            format: uri
          example: http://www.nessus.org/u?842bf415
        cvss3_base_score:
          description: The CVSSv3 base score for the vulnerability targeted by the plugin (intrinsic and fundamental characteristics of a vulnerability that are constant over time and user environments).
          type: number
          minimum: 0
          maximum: 10
          example: 10
        wasc:
          description: The list of Web Application Security Consortium (WASC) category associated with the vulnerability targeted by the plugin.
          type: array
          items:
            type: string
        cwe:
          description: The Common Weakness Enumeration (CWE) ID for the vulnerability targeted by the plugin.
          type: array
          items:
            type: string
        owasp:
          description: The Open Web Application Security Project (OWASP) category for the vulnerability targeted by the plugin.
          type: array
          items:
            type: object
            required:
            - category
            - year
            properties:
              category:
                type: string
                enum:
                - A1
                - A2
                - A3
                - A4
                - A5
                - A6
                - A7
                - A8
                - A9
                - A10
              year:
                type: string
                example: '2010'
    ErrorResponse:
      type: object
      required:
      - reasons
      description: Tenable Web App Scanning error response.
      properties:
        reasons:
          type: array
          description: A list of reasons for the Tenable Web App Scanning error.
          items:
            type: object
            description: A reason for the Tenable Web App Scanning error, including a code and an extended description.
            minItems: 1
            required:
            - code
            - reason
            properties:
              code:
                type: string
                description: "The Tenable Web App Scanning error code. Error code values include:\n - `NOT_FOUND`—Returned if Tenable Web App Scanning could not find the resource you specified.\n - `INVALID_ID_FORMAT`—Returned if you specify a resource ID in an invalid format.\n - `INVALID_PARAMETER`—Returned if you specify an invalid URL parameter.\n- `INVALID_JSON_BODY`—Returned if you specify invalid JSON in request payload.\n - `DUPLICATE_ENTITY`—Returned if you attempt to create a duplicate resource.\n - `NOT_ALLOWED`—Returned if Tenable Web App Scanning encounters a stateful conflict, for example, if you attempt to start a scan that is already in progress.\n - `OPERATION_FORBIDDEN`—Returned if you do not have sufficient permissions to access a resource or complete a task."
              reason:
                type: string
                description: The extended description of the cause of the Tenable Web App Scanning error.
    plugins_ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: The HTTP status code of the error.
        error:
          type: string
          description: The standard HTTP error name.
        message:
          type: string
          description: A brief message about the cause of the error.
    plugins_cvss_vector:
      type: object
      description: The raw CVSSv2 metrics for the vulnerability. For more information, see CVSSv2 documentation.
      properties:
        AccessComplexity:
          type: string
          description: The CVSSv2 Access Complexity (AC) metric for the vulnerability the plugin covers. Possible values include:<br />• H—High<br />• M—Medium<br />• L—Low
        AccessVector:
          type: string
          description: 'The CVSSv2 Access Vector (AV) metric for the vulnerability the plugin covers. Possible values include: <br />• L—Local<br />• A—Adjacent Network<br />• N—Network'
        Authentication:
          type: string
          description: 'The CVSSv2 Authentication (Au) metric for the vulnerability the plugin covers. Possible values include: <br />• N—None<br />• S—Single<br />• M—Multiple'
        Availability-Impact:
          type: string
          description: 'The CVSSv2 availability impact metric for the vulnerability the plugin covers. Possible values include: <br />• N—None<br />• P—Partial<br />• C—Complete'
        Confidentiality-Impact:
          type: string
          description: 'The CVSSv2 confidentiality impact metric for the vulnerability the plugin covers. Possible values include: <br />• N—None<br />• P—Partial<br />• C—Complete'
        Integrity-Impact:
          type: string
          description: 'The CVSSv2 integrity impact metric for the vulnerability the plugin covers. Possible values include: <br />• N—None<br />• P—Partial<br />• C—Complete'
  parameters:
    sort-plugins:
      description: 'The field you want to use to sort the results by along with the sort order. The field is specified first, followed by a colon, and the order is specified second (`asc` or `desc`). For example, `plugin_id:asc` would sort results by the `plugin_id` field in ascending order.


        If you specify multiple fields, the fields must be separated by commas. For example, `family:asc;name:desc` would first sort results by the `family` field in ascending order and then by the `name` field in descending order.'
      example: family:asc;name:desc
      in: query
      name: sort
      required: false
      schema:
        type: string
    offset:
      description: The starting record to retrieve. If this parameter is omitted, Tenable Web App Scanning uses the default value of `0`.
      in: query
      name: offset
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    limit:
      description: The number of records to retrieve. If this parameter is omitted, Tenable Web App Scanning uses the default value of `10`. The minimum value is `0` and the maximum value is `200`. If you need to retrieve more than 200 records, use the offset value to iterate through page responses.
      in: query
      name: limit
      required: false
      schema:
        type: integer
        format: int32
        minimum: 0
        maximum: 200
        default: 10
  securitySchemes:
    Bearer:
      type: apiKey
      in: header
      name: Authorization
      description: 'Example: Bearer {{token}}'
