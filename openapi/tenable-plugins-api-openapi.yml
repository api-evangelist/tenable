        required: false
        name: all
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: Returned if the list of plugin families was retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  families:
                    type: array
                    items:
                      properties:
                        count:
                          type: integer
                          description: The number of plugins in the family.
                        name:
                          type: string
                          description: The name of the family.
                        id:
                          type: integer
                          description: The unique ID of the family.
              examples:
                response:
                  value:
                    families:
                    - count: 11342
                      name: AIX Local Security Checks
                      id: 1
                    - count: 1164
                      name: Amazon Linux Local Security Checks
                      id: 35
                    - count: 114
