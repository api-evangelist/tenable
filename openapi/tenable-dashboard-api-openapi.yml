openapi: 3.2.0
info:
  title: Identity Exposure Dashboard API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Dashboard
  description: A widget container
paths:
  /api/dashboards:
    get:
      summary: Retrieve all dashboard instances
      description: 'Required license type: ioe, ioaPreview, ioa'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - name
                  - order
                  - userId
                  properties:
                    id:
                      type: number
                    name:
                      type: string
                    order:
                      type: number
                    userId:
                      type: number
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Dashboard
      x-tenablead-required-product-license-type:
      - ioe
      - ioaPreview
      - ioa
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiDashboards
      x-operation-id-source: derived
    post:
      summary: Create dashboard instance
      description: 'Required license type: ioe, ioaPreview, ioa'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - id
                - name
                - order
                - userId
                properties:
                  id:
                    type: number
                  name:
                    type: string
                  order:
                    type: number
                  userId:
                    type: number
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Dashboard
      x-tenablead-required-product-license-type:
      - ioe
      - ioaPreview
      - ioa
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - name
              - order
              properties:
                name:
                  type: string
                  maxLength: 100
                order:
                  type: number
                  minimum: 0
                  maximum: 2147483647
      operationId: postApiDashboards
      x-operation-id-source: derived
  /api/dashboards/{id}:
    get:
      summary: Get dashboard instance by id
      description: 'Required license type: ioe, ioaPreview, ioa'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - id
                - name
                - order
                - userId
                properties:
                  id:
                    type: number
                  name:
                    type: string
                  order:
                    type: number
                  userId:
                    type: number
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Dashboard
      x-tenablead-required-product-license-type:
      - ioe
      - ioaPreview
      - ioa
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiDashboardsById
      x-operation-id-source: derived
    patch:
      summary: Update dashboard instance
      description: 'Required license type: ioe, ioaPreview, ioa'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - id
                - name
                - order
                - userId
                properties:
                  id:
                    type: number
                  name:
                    type: string
                  order:
                    type: number
                  userId:
                    type: number
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Dashboard
      x-tenablead-required-product-license-type:
      - ioe
      - ioaPreview
      - ioa
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  maxLength: 100
                order:
                  type: number
                  minimum: 0
                  maximum: 2147483647
      operationId: patchApiDashboardsById
      x-operation-id-source: derived
    delete:
      summary: Delete dashboard instance with it's associated widgets
      description: 'Required license type: ioe, ioaPreview, ioa'
      responses:
        '204':
          description: ''
          content:
            application/json:
              schema:
                additionalProperties: false
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Dashboard
      x-tenablead-required-product-license-type:
      - ioe
      - ioaPreview
      - ioa
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: deleteApiDashboardsById
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKey:
      name: x-api-key
      description: The user's API key
      in: header
      type: apiKey
x-readme:
  explorer-enabled: true
  proxy-enabled: true
