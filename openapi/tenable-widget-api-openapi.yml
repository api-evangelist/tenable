      summary: Get all widgets by dashboard id
      description: 'Required license type: ioe, ioaPreview, ioa'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - posX
                  - posY
                  - width
                  - height
                  - dashboardId
                  properties:
                    id:
                      type: number
                    posX:
                      type: number
                    posY:
                      type: number
                    width:
                      type: number
                    height:
                      type: number
                    dashboardId:
                      type: number
                    title:
                      type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Widget
      x-tenablead-required-product-license-type:
      - ioe
      - ioaPreview
      - ioa
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: dashboardId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiDashboardsByDashboardIdWidgets
      x-operation-id-source: derived
