        schema:
          type: string
          format: uuid
      - name: sort
        in: query
        description: "Determines the sort order of the scan configurations. You must enter the sort order in the following format: \n\n`<sorting_property>:<sorting_order>`\n\n The supported sorting properties are `name` and `last_modification_date`. The supported sorting orders are ascending (`asc`) and descending (`desc`). For example, `name:asc` sorts results by the `name` property in ascending order."
        required: false
        schema:
          type: string
      - name: offset
        in: query
        description: The starting record to retrieve. If this parameter is omitted, Tenable Vulnerability Management uses the default value of `0`.
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        description: "The number of records to retrieve. If this parameter is omitted, Tenable Vulnerability Management uses the default value of `200`. The minimum value is `0` and the maximum value of `5000`. \n\nIf you need to retrieve more than 5000 records, use the offset parameter to iterate through the page responses."
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Returned if the list of scan configurations in the specified shared collection was retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scans:
                    type: array
                    items:
                      $ref: '#/components/schemas/Shared_Collections_scan-object-list'
