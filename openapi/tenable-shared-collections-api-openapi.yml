                    - control: true
                      creation_date: 0
                      enabled: false
                      id: 47
                      last_modification_date: 0
                      legacy: false
                      name: another-jun22-post-autocreated-test
                      owner: user@example.com
                      policy_id: 46
                      read: true
                      schedule_uuid: template-45ad9347-fbda-58c1-b7d0-1adf800f16c1684e4541d7721533
                      shared: false
                      status: empty
                      has_triggers: false
                      type: public
                      permissions: 128
                      user_permissions: 128
                      wizard_uuid: ad629e16-03b6-8c1d-cef6-ef8c9dd3c658d24bd260ef5f9e66
                      status_times: {}
                    - control: true
                      creation_date: 0
                      enabled: false
                      id: 45
                      last_modification_date: 0
                      legacy: false
                      name: jun-22-auto-routed-create-2
                      owner: user@example.com
                      policy_id: 44
                      read: true
                      schedule_uuid: template-1d847f60-df27-de91-f416-663c14d2372fb44072de1a39bf07
                      shared: false
                      status: empty
                      has_triggers: false
                      type: public
                      permissions: 128
                      user_permissions: 128
                      wizard_uuid: ad629e16-03b6-8c1d-cef6-ef8c9dd3c658d24bd260ef5f9e66
                      status_times: {}
                    - control: true
                      creation_date: 0
                      enabled: false
                      id: 65
                      last_modification_date: 0
                      legacy: false
                      name: my-third-default-permission-scan
                      owner: user@example.com
                      policy_id: 64
                      read: true
                      schedule_uuid: template-f8dff1f6-dd34-cdd4-3408-34d70999e47cc31f7e89dbe1014d
                      shared: true
                      status: empty
                      has_triggers: false
                      type: public
                      permissions: 128
                      user_permissions: 128
                      wizard_uuid: ad629e16-03b6-8c1d-cef6-ef8c9dd3c658d24bd260ef5f9e66
                      status_times: {}
                    pagination:
                      total: 3
                      limit: 200
                      offset: 0
        '204':
          description: Returned if there are no shared scan configurations in the shared collection.
          content:
            application/octet-stream:
              examples:
                response:
                  value: {}
        '400':
          description: Returned if your request specified invalid parameters or if your request was improperly formatted.
        '401':
          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_Collections_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: Invalid credentials.
        '403':
          description: Returned if you do not have permission to list scan configurations for the shared collection.
        '404':
          description: Returned if Tenable Vulnerability Management could not find the specified shared collection.
          content:
            application/json:
              examples:
                response:
                  value:
                    error: No shared collection found
        '429':
          description: Returned if you attempt to send too many requests in a specific period of time. For more information, see [Rate Limiting](doc:rate-limiting).
          content:
            text/html:
              examples:
                response:
                  value: "<html>\n\n<head>\n    <title>429 Too Many Requests</title>\n</head>\n\n<body bgcolor=\"white\">\n    <center>\n        <h1>429 Too Many Requests</h1>\n    </center>\n    <hr>\n    <center>nginx</center>\n</body>\n\n</html>"
        '500':
          description: Returned if an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_Collections_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
      security:
      - Shared_Collections_cloud: []
    delete:
      summary: Remove scan configs from shared collection
      description: "Removes scan configurations from a shared collection. \n\nThis request creates an asynchronous job in Tenable Vulnerability Management. You can query the status of the job with the [Get job status](ref:shared-collections-job-status) endpoint. <div class=\"perms-callout\">Requires the Scan Operator [24] user role and the `CAN_EDIT` shared collections permission. Alternatively, requires the `VM.VM_SCAN.VM_SCAN_SHARED_COLLECTION.DELETE` custom role privilege. See [Roles](doc:roles) and [Permissions](doc:permissions).</div>"
      operationId: shared-collections-configs-remove
      tags:
      - Shared Collections
      parameters:
      - name: shared_collection_id
        in: path
        required: true
        description: The `uuid` of the shared collection to remove scan configurations from.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - scan_configs
              properties:
                scan_configs:
                  type: array
                  description: The list of scan configuration IDs to remove from the shared collection.
                  items:
                    type: string
                    example: f536f82a-a3e2-4911-84cb-72cc0177578a
      responses:
        '200':
          description: Returned if the asynchronous job was queued successfully. You can query the status of the job with the [Get job status](ref:shared-collections-job-status) endpoint.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_Collections_async-api-response-body'
              examples:
                response:
                  value:
                    message: Request has been received.
                    request_status_id: 311dd641-88e6-4b9e-ae93-693d66dfb463
        '401':
          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_Collections_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: Invalid credentials.
        '403':
          description: Returned if you do not have permission to remove scan configurations from the shared collection.
        '404':
          description: Returned if Tenable Vulnerability Management could not find the specified shared collection.
          content:
            application/json:
              examples:
                response:
                  value:
                    error: No shared collection found with uuid=f5751411-308d-4c56-b85e-48829707c5f3
        '429':
          description: Returned if you attempt to send too many requests in a specific period of time. For more information, see [Rate Limiting](doc:rate-limiting).
          content:
            text/html:
              examples:
                response:
                  value: "<html>\n\n<head>\n    <title>429 Too Many Requests</title>\n</head>\n\n<body bgcolor=\"white\">\n    <center>\n        <h1>429 Too Many Requests</h1>\n    </center>\n    <hr>\n    <center>nginx</center>\n</body>\n\n</html>"
        '500':
          description: Returned if an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shared_Collections_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
      security:
      - Shared_Collections_cloud: []
components:
  schemas:
    Shared_Collections_PaginationResponse:
      description: An object containing pagination information for the current result set.
      type: object
      properties:
        total:
          type: integer
          format: int32
          description: The total number of records matching your search criteria.
        limit:
          type: integer
          format: int32
          description: The number of records requested (or the default value if omitted from the request).
        offset:
          type: integer
          format: int32
          description: The starting record you requested (or zero if omitted).
    Shared_Collections_request-create-acl-object:
      type: object
      description: The access control list (ACL) object that defines the access to a shared collection for a given user or group.
      required:
      - permission
      - uuid
      - type
      properties:
        permission:
          type: string
          description: "The level of access a user or group has to the shared collection. The `OWNER` permission can only be assigned to the `USER` type. \n\nNote that users (or a user in a group) that are assigned the `CAN_EDIT` or `OWNER` permissions must have at at least the Scan Operator [24] user role role or the `IO.SHARED_COLLECTIONS.MANAGE` custom role privilege. See [Roles](doc:roles)."
          enum:
          - OWNER
          - CAN_VIEW
          - CAN_EDIT
          example: OWNER
        type:
          type: string
          description: Indicates whether or not the permission applies to a user or a group.
          enum:
          - USER
          - GROUP
          example: USER
        uuid:
          type: string
          description: The unique ID for the user or group you want to grant permission to for the shared collection.
          example: d72d3138-364b-4d67-a290-a3362a4d18af
        name:
          type: string
          description: A name for the user or group.
          example: developer@example.com
    Shared_Collections_settings-rrules:
      type: string
      description: 'The interval at which the scan repeats. The interval is formatted as a string of three values delimited by semi-colons. These values are: the frequency (FREQ=ONETIME or DAILY or WEEKLY or MONTHLY or YEARLY), the interval (INTERVAL=1 or 2 or 3 ... x), and the days of the week (BYDAY=SU,MO,TU,WE,TH,FR,SA). For a scan that runs every three weeks on Monday Wednesday and Friday, the string would be `FREQ=WEEKLY;INTERVAL=3;BYDAY=MO,WE,FR`. If the scan is not scheduled to recur, this attribute is `null`. For more information, see [rrules Format](doc:example-assessment-scan-recurring#rrules-format).


        **Note:** To set the `rrules` parameter for an agent scan, the request must also include the following body parameters:<ul><li>The `uuid` parameter must specify an agent scan template. For more information, see [Tenable-Provided Agent Templates](https://docs.tenable.com/vulnerability-management/Content/Scans/AgentTemplates.htm) and the [List templates](ref:editor-list-templates) endpoint.</li><li>The `agent_group_id` parameter must specify an agent group. For more information, see [Agent Groups](ref:agent-groups).</li></ul>For an example request body for an agent scan, see [Example Agent Scan: Recurring](doc:example-agent-scan-recurring).'
    Shared_Collections_request-update-shared-collection:
      type: object
      required:
      - name
      - acl
      properties:
        name:
          type: string
          description: A name for the shared collection. Names cannot exceed 100 characters.
          example: Office scans
        description:
          type: string
          description: A description for shared collection. Descriptions cannot exceed 1,000 characters.
          example: Shared scan configurations for the office.
        acl:
          type: array
          items:
            $ref: '#/components/schemas/Shared_Collections_request-update-acl-object'
    Shared_Collections_acl-object:
      type: object
      description: The access control list (ACL) object that defines the permissions for a shared collection for a given user or group.
      required:
      - permission
      - uuid
      - type
      properties:
        permission:
          type: string
          description: "The level of access a user or group has to the shared collection. \n\nNote: `REMOVE_USER` is only used in update requests to remove a user from the shared collection."
          enum:
          - OWNER
          - CAN_VIEW
          - CAN_EDIT
          - REMOVE_USER
          example: OWNER
        uuid:
          type: string
          format: uuid
          description: The unique ID for the user or group.
          example: d72d3138-364b-4d67-a290-a3362a4d18af
        name:
          type: string
          description: The user or group name.
          example: developer@example.com
        type:
          type: string
          description: The type of permission. Either `USER` or `GROUP`.
          enum:
          - USER
          - GROUP
          example: USER
    Shared_Collections_async-api-response-body:
      type: object
      properties:
        message:
          type: string
          description: The message for the initial status of the asynchronous job.
          example: Request has been received.
        request_status_id:
          type: string
          description: 'The unique ID for tracking the status of the requested asynchronous job. You can query the status of the job with the [Get job status](ref:shared-collections-create) endpoint. '
          example: e3d24812682ee9a312ef178b8a0deb8a
    Shared_Collections_scan-object-list:
      type: object
      properties:
        control:
          type: boolean
          description: If `true`, the scan has a schedule and can be launched.
        creation_date:
          type: integer
          description: For newly-created scans, the date on which the scan configuration was originally created. For scans that have been launched at least once, this attribute does not represent the date on which the scan configuration was originally created. Instead, it represents the date on which the scan was first launched, in Unix time format.
          format: int64
        enabled:
          type: boolean
          description: For Nessus scanner scans, a value indicating whether the scan schedule is active (`true`) or inactive (`false`). For Nessus Agent scans, a value indicating whether triggers for triggered scans are active (`true`) or inactive (`false`).
        id:
          type: integer
          description: The unique ID of the scan.
          format: int32
        last_modification_date:
          type: integer
          description: For newly-created scans, the date on which the scan configuration was created. For scans that have been launched at least once, this attribute does not represent the date on which the scan configuration was last modified. Instead, it represents the date on which the scan was last launched, in Unix time format. Tenable Vulnerability Management updates this attribute each time the scan launches.
          format: int64
        legacy:
          type: boolean
          description: A value indicating whether the scan results were created before a change in storage method. If `true`, Tenable Vulnerability Management stores the results in the old storage method. If `false`, Tenable Vulnerability Management stores the results in the new storage method.
        name:
          type: string
          description: The name of the scan.
        owner:
          type: string
          description: The owner of the scan.
        policy_id:
          type: integer
          description: The unique ID of the user-defined template (policy) on which the scan configuration is based.
        read:
          type: boolean
          description: A value indicating whether the user account associated with the request message has viewed the scan in the Tenable Vulnerability Management user interface. If `1`, the user account has viewed the scan results.
        schedule_uuid:
          type: string
          description: The UUID for a specific instance in the scan schedule.
        shared:
          type: boolean
          description: If `true`, the scan is shared with users other than the scan owner. The level of sharing is specified in the `acls` attribute of the scan details.
        status:
          type: string
          description: The status of the scan. For a list of possible values, see [Scan Status](doc:scan-status-tio).
        template_uuid:
          type: string
          description: The UUID of the template.
        type:
          type: string
          description: The type of scan.
        permissions:
          type: integer
          description: The requesting user's permissions for the scan.
          format: int32
        user_permissions:
          type: integer
          description: The sharing permissions for the scan.
          format: int32
        uuid:
          type: string
          description: The UUID of the scan.
        wizard_uuid:
          type: string
          description: The UUID of the Tenable-provided template used to create either the scan or the user-defined template (policy) on which the scan configuration is based.
        progress:
          type: integer
          description: The progress of the scan ranging from 0 to 100.
        timezone:
          type: string
          description: The timezone of the scheduled start time for the scan.
        rrules:
          $ref: '#/components/schemas/Shared_Collections_settings-rrules'
        starttime:
          type: string
          description: 'For one-time scans, the starting date and time for the scan. For recurrent scans, the first date on which the scan schedule is active and the time that recurring scans launch based on the `rrules` attribute.


            This attribute has the following format: `YYYYMMDDTHHMMSS`.'
        total_targets:
          type: integer
          description: The total number of targets in the scan.
    Shared_Collections_ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: The HTTP status code of the error.
        error:
          type: string
          description: The standard HTTP error name.
        message:
          type: string
          description: A brief message about the cause of the error.
    Shared_Collections_request-create-shared-collection:
      type: object
      required:
      - name
      - acl
      properties:
        name:
          type: string
          description: A name for the shared collection. Names cannot exceed 100 characters.
          example: Office scans
        description:
          type: string
          description: A description for shared collection. Descriptions cannot exceed 1,000 characters.
          example: Shared scan configurations for the office.
        acl:
          type: array
          items:
            $ref: '#/components/schemas/Shared_Collections_request-create-acl-object'
    Shared_Collections_request-status-response-body:
      type: object
      properties:
        container_uuid:
          type: string
          description: The unique ID of the container.
          example: 999ec76a-1a16-4bfb-bf20-f23908475372
        type:
          type: string
          description: The type of asynchronous job. For shared collections, the type is always `shared-collections`.
          example: shared-collections
        id:
          type: string
          description: "The unique ID for tracking the status of the asynchronous job. This is the same value as the `request_status_id` property returned in the response bodies of the following endpoints: \n- [Create shared collection](ref:shared-collections-create) \n- [Update shared collection](ref:shared-collections-update) \n- [Delete shared collection](ref:shared-collections-delete) \n- [Add scan configs to shared collection](ref:shared-collections-config-add) \n- [Remove scan configs from shared collection](ref:shared-collections-configs-remove) endpoints."
          example: 62a9f498-1738-42d1-bb1b-01b68fce7cc3
        status:
          type: string
          description: The status of the asynchronous operation. The possible statuses are `completed`, `received`, `processing`, and `aborted`.
          example: completed
        created:
          type: string
          description: A Unix timestamp indicating the date and time when the asynchronous job was created.
          example: '1734376507'
        modified:
          type: string
          description: A Unix timestamp indicating the date and time when the asynchronous job was modified.
          example: '1734376665'
    Shared_Collections_shared-collection-object:
      type: object
      properties:
        name:
          type: string
          description: The name of the shared collection.
          example: Account 24 shared scans
        description:
          type: string
          description: The description of the shared collection.
          example: Shared scan configurations for account 24
        uuid:
          type: string
          format: uuid
          description: The unique ID for the shared collection.
          example: e956769e-76fc-4949-8a5a-135cbb72fff6
        acl:
          type: array
          items:
            $ref: '#/components/schemas/Shared_Collections_acl-object'
      required:
      - name
      - description
      - uuid
      - acl
    Shared_Collections_request-update-acl-object:
      type: object
      description: The access control list (ACL) object that defines the access to a shared collection for a given user or group.
      required:
      - permission
      - uuid
      - type
      properties:
        permission:
          type: string
          description: "The level of access a user or group has to the shared collection. Use the `REMOVE_USER` value to remove the specified user or group from the shared collection. The `OWNER` permission can only be assigned to the `USER` type. \n\nNote that users (or a user in a group) that are assigned the `CAN_EDIT` or `OWNER` permissions must have at at least the Scan Operator [24] user role role or the `IO.SHARED_COLLECTIONS.MANAGE` custom role privilege. See [Roles](doc:roles)."
          enum:
          - OWNER
          - CAN_VIEW
          - CAN_EDIT
          - REMOVE_USER
          example: OWNER
        uuid:
          type: string
          description: The unique ID for the user or group you want to grant permission to for the shared collection.
          example: d72d3138-364b-4d67-a290-a3362a4d18af
        type:
          type: string
          description: Indicates whether or not the permission applies to a user or a group.
          enum:
          - USER
          - GROUP
          example: USER
        name:
          type: string
          description: A name for the user or group.
          example: developer@example.com
  securitySchemes:
    Bearer:
      type: apiKey
      in: header
      name: Authorization
      description: 'Example: Bearer {{token}}'
