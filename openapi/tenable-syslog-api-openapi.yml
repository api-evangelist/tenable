openapi: 3.2.0
info:
  title: Identity Exposure Syslog API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Syslog
  description: A syslog alert
paths:
  /api/syslogs:
    get:
      summary: Retrieve all syslog instances
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the get /syslogs response
                type: array
                items:
                  description: syslog
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - ip
                  - port
                  - protocol
                  - tls
                  - criticityThreshold
                  - directories
                  - checkers
                  - attackTypes
                  - profiles
                  - shouldNotifyOnInitialFullSecurityCheck
                  - relayId
                  properties:
                    id:
                      type: integer
                    ip:
                      type: string
                    port:
                      type: integer
                    protocol:
                      type: string
                      enum:
                      - UDP
                      - TCP
                    tls:
                      type: boolean
                    criticityThreshold:
                      type: integer
                    description:
                      type:
                      - string
                      - 'null'
                    filterExpression:
                      type:
                      - object
                      - 'null'
                    inputType:
                      type: string
                      enum:
                      - deviances
                      - adObjectChanges
                      - attacks
                      - healthChecks
                    directories:
                      minItems: 1
                      type: array
                      items:
                        type: integer
                    checkers:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: integer
                    attackTypes:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: integer
                    profiles:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: integer
                    shouldNotifyOnInitialFullSecurityCheck:
                      type: boolean
                    relayId:
                      type:
                      - number
                      - 'null'
                    healthCheckNames:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Syslog
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiSyslogs
      x-operation-id-source: derived
    post:
      summary: Create syslog instance
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the post /syslogs response
                type: array
                items:
                  description: syslog
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - ip
                  - port
                  - protocol
                  - tls
                  - criticityThreshold
                  - directories
                  - checkers
                  - attackTypes
                  - profiles
                  - shouldNotifyOnInitialFullSecurityCheck
                  - relayId
                  properties:
                    id:
                      type: integer
                    ip:
                      type: string
                    port:
                      type: integer
                    protocol:
                      type: string
                      enum:
                      - UDP
                      - TCP
                    tls:
                      type: boolean
                    criticityThreshold:
                      type: integer
                    description:
                      type:
                      - string
                      - 'null'
                    filterExpression:
                      type:
                      - object
                      - 'null'
                    inputType:
                      type: string
                      enum:
                      - deviances
                      - adObjectChanges
                      - attacks
                      - healthChecks
                    directories:
                      minItems: 1
                      type: array
                      items:
                        type: integer
                    checkers:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: integer
                    attackTypes:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: integer
                    profiles:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: integer
                    shouldNotifyOnInitialFullSecurityCheck:
                      type: boolean
                    relayId:
                      type:
                      - number
                      - 'null'
                    healthCheckNames:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Syslog
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              minLength: 1
              items:
                allOf:
                - type: object
                  required:
                  - ip
                  - port
                  - protocol
                  - tls
                  - criticityThreshold
                  - inputType
                  - directories
                  - shouldNotifyOnInitialFullSecurityCheck
                  properties:
                    ip:
                      type: string
                    port:
                      type: integer
                    protocol:
                      type: string
                      enum:
                      - UDP
                      - TCP
                    tls:
                      type: boolean
                    criticityThreshold:
                      type: integer
                    directories:
                      minItems: 1
                      type: array
                      items:
                        type: integer
                    description:
                      type: string
                    inputType:
                      type: string
                      enum:
                      - deviances
                      - adObjectChanges
                      - attacks
                      - healthChecks
                    shouldNotifyOnInitialFullSecurityCheck:
                      type: boolean
                    relayId:
                      type:
                      - number
                      - 'null'
                - description: List the properties that depend on the input type
                  type: object
                  oneOf:
                  - allOf:
                    - properties:
                        inputType:
                          enum:
                          - deviances
                    - required:
                      - checkers
                      - profiles
                      properties:
                        checkers:
                          type: array
                          minItems: 1
                          items:
                            type: integer
                        profiles:
                          type: array
                          minItems: 1
                          items:
                            type: integer
                  - allOf:
                    - not:
                        properties:
                          inputType:
                            enum:
                            - deviances
                    - oneOf:
                      - allOf:
                        - properties:
                            inputType:
                              enum:
                              - attacks
                        - required:
                          - attackTypes
                          - profiles
                          properties:
                            attackTypes:
                              type: array
                              minItems: 1
                              items:
                                type: integer
                            profiles:
                              type: array
                              minItems: 1
                              items:
                                type: integer
                      - allOf:
                        - not:
                            properties:
                              inputType:
                                enum:
                                - attacks
                        - oneOf:
                          - allOf:
                            - properties:
                                inputType:
                                  enum:
                                  - adObjectChanges
                            - properties:
                                filterExpression:
                                  type: object
                          - allOf:
                            - not:
                                properties:
                                  inputType:
                                    enum:
                                    - adObjectChanges
                            - required:
                              - healthCheckNames
                              properties:
                                healthCheckNames:
                                  type: array
                                  minItems: 1
                                  items:
                                    type: string
      operationId: postApiSyslogs
      x-operation-id-source: derived
