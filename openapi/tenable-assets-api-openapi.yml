    assets_assetsBulkMoveRequest:
      type: object
      required:
      - source
      - destination
      - targets
      description: The parameters for moving assets from one network to another.
      properties:
        source:
          type: string
          example: 00000000-0000-0000-0000-000000000000
          description: The unique identifier of the network currently associated with the assets. Use the [GET /networks](ref:networks-list) endpoint with the name attribute as filter to find the UUID of the network.
        destination:
          type: string
          description: The unique identifier of the network to associate with the specified assets. Use the [GET /networks](ref:networks-list) endpoint with the name filter to find the UUID of the network.
          example: 4dee97b4-592b-4b5b-a8a9-d7a605a3723a
        targets:
          type: string
          description: The IPv4 addresses of the assets to move. The addresses can be represented as a comma-separated list, a range, or CIDR, for example `1.1.1.1, 2.2.2.2-2.2.2.200, 3.3.3.0/24`.
          example: 192.0.2.57-192.0.2.69
