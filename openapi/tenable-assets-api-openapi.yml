          - WAS
          - WHITEHAT
          - WIZ_CONFIGURATION
          - WIZ_ISSUES
          - WIZ_VULNERABILITY_MANAGEMENT
        first_seen:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time the source first reported the asset.
        last_seen:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time the source last reported the asset.
    assets_assetsBulkUpdateAcrObject:
      type: object
      required:
      - acr_score
      - asset
      description: Parameters to update the ACR for an asset. For a request body example, see "Update ACR for assets" in [Bulk Asset Operations](doc:bulk-asset-operations).
      properties:
        acr_score:
          type: integer
          description: The ACR score you want to assign to the asset. The ACR must be an integer from 1 to 10.
        reason:
          type: array
          description: "The reasons you are updating the ACR for the assets. Supported values include:\n\n - Business Critical\n - In Scope For Compliance\n - Existing Mitigation Control\n - Dev only \n - Key drivers does not match \n - Other\n\nThis parameter corresponds to the **Overwrite Reasoning** parameter when editing an ACR in the Tenable Vulnerability Management Lumin user interface. For more information, see [Edit an ACR](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminEditACR.htm)."
          items:
            type: string
            enum:
            - Business Critical
            - In Scope For Compliance
            - Existing Mitigation Control
            - Dev only
            - Key drivers does not match
            - Other
        note:
          type: string
          description: 'Any notes you want to add to clarify the circumstances behind the update. This parameter corresponds to the **Note** parameter when editing an ACR in the Tenable Vulnerability Management Lumin user interface. For more information, see [Edit an ACR](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminEditACR.htm).  '
        asset:
          type: array
          description: The identifiers of the assets to update to the specified ACR. At least one asset object is required in this array.
          items:
            $ref: '#/components/schemas/assets_AssetIdentifierObject'
    assets_Response-Asset-Details:
      type: object
      properties:
        name:
          type: string
          description: The name of the asset.
        id:
          type: string
          format: uuid
          description: The unique identifier of the asset. Use this value as the unique key for the asset.
        has_agent:
          type: boolean
          description: Indicates if a Tenable Agent scan detected the asset.
        created_at:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time the asset record was created.
        updated_at:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time the asset record was last updated.
        terminated_at:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time the asset was terminated from a cloud platform (for example, Amazon Web Services [AWS]).
        deleted_at:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time a user deleted the asset record. After deletion, the asset record is retained until it ages out of the license count.
        aes_score_v3:
          type: number
          format: float
          maximum: 1000
          minimum: 0
          description: The version 3 Tenable-defined Asset Exposure Score (AES) for the asset. This metric weighs an asset's [Vulnerability Priority Rating (VPR)](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm#VPR) and [Asset Criticality Rating (AES)](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm#ACR) and then assigns a number from 1 to 1000, with higher numbers for more exposed assets. For more information, see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the _Tenable Vulnerability Management User Guide_.
        acr_score_v3:
          type: number
          format: float
          maximum: 10
          minimum: 0
          description: 'The version 3 Asset Criticality Rating (ACR) assigned to the asset. Tenable assigns an ACR to each asset on your network to represent the asset''s relative risk as an integer from 1 to 10. For more details, see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the *Tenable Vulnerability Management User Guide*.


            Note: This attribute is available only with a Tenable Lumin license.'
        first_seen:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time a scan first identified the asset.
        last_seen:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time of the scan that most recently detected the asset.
        last_scan_target:
          type: string
          description: The IPv4 address, IPv6 address, or fully qualified domain name (FQDN) last used by the scanner to evaluate the asset.
        last_authentication_attempt_date:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time a scan last attempted to authenticate using SSH (on Unix-based systems) or SMB (on Windows systems).
        last_authentication_success_date:
          type: string
          format: date-time
          description: 'A timestamp in ISO 8601 format indicating the date and time a scan last authenticated successfully. Note: This property is not updated by Tenable Agent scans, as agents do not perform login-based authentication.'
        last_authenticated_scan_date:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time of the most recent credentialed scan performed on the asset.
        last_licensed_scan_date:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time of the last scan that identified the asset as licensed. An asset is considered licensed if a scan has returned results from a non-discovery plugin within the past 90 days.
        last_scan_id:
          type: string
          format: uuid
          description: The unique identifier of the scan configuration used for the most recent scan of the asset.
        last_schedule_id:
          type: string
          description: The `schedule_uuid` of the scan schedule used for the most recent scan of the asset.
        sources:
          type: array
          description: A list of sources that identified the asset.
          items:
            $ref: '#/components/schemas/assets_sources'
        tags:
          type: array
          description: A list of tags assigned to the asset.
          items:
            $ref: '#/components/schemas/assets_tags'
        acr_score:
          type: number
          format: float
          maximum: 10
          minimum: 0
          description: 'The Asset Criticality Rating (ACR) assigned to the asset. Tenable assigns an ACR to each asset on your network to represent the asset''s relative risk as an integer from 1 to 10. For more details, see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the *Tenable Vulnerability Management User Guide*.


            Note: This attribute is available only with a Tenable Lumin license.'
        acr_drivers:
          type: array
          description: "The key drivers Tenable used to calculate the asset's Tenable-provided Asset Criticality Rating (ACR). For more details see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the *Tenable Vulnerability Management User Guide*. \n\nNote: This attribute is available only with a Tenable Lumin license."
          items:
            $ref: '#/components/schemas/assets_AcrDriversObject'
        exposure_score:
          type: number
          format: float
          maximum: 1000
          minimum: 0
          description: 'The Asset Exposure Score (AES) assigned to the asset. Tenable assigns an AES to each asset on your network to represent the asset''s relative exposure as an integer between 0 and 1000. For more details, see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the *Tenable Vulnerability Management User Guide*.


            Note: This attribute is available only with a Tenable Lumin license.'
        scan_frequency:
          type: array
          description: 'Information about how often scans were run against the asset during specified time intervals. For more details, see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the *Tenable Vulnerability Management User Guide*.


            Note: This attribute is available only with a Tenable Lumin license.'
          items:
            $ref: '#/components/schemas/assets_AcrScanFrequencyObject'
        network_id:
          type: array
          description: The unique identifier of the network object to which the asset is assigned. For more information, see [Manage Networks](doc:manage-networks-tio).
          items:
            type: string
        ipv4:
          description: A list of IPv4 addresses associated with the asset.
          type: array
          items:
            type: string
        ipv6:
