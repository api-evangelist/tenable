    cvss3_vector:
      type: object
      description: Additional CVSSv3 metrics for the vulnerability.
      properties:
        access_vector:
          type: string
          description: "The CVSSv2 Attack Vector (AV) metric for the vulnerability the plugin covers. Possible values include:\n - Network—Corresponds to the Network (N) value for the AV metric. \n - Adjacent Network—Corresponds to the Adjacent Network (A) value for the AV metric. \n - Local—Corresponds to the Local (L) value for the AV metric"
        access_complexity:
          type: string
          description: "The CVSSv3 Access Complexity (AC) metric for the vulnerability the plugin covers. Possible values include: \n - H—High\n - M—Medium\n - L—Low"
        authentication:
          type: string
          description: "The CVSSv2 Authentication (Au) metric for the vulnerability the plugin covers. Possible values include:\n - None required—Corresponds to the None (N) value for the Au metric. \n - Requires-single-instance—Corresponds to the Single (S) value for the Au metric. \n - Requires-multiple-instances—Corresponds to the Multiple (M) value for the Au metric"
        confidentiality_impact:
          type: string
          description: "The CVSSv3 confidentiality impact metric of the vulnerability the plugin covers to the vulnerable component. Possible values include: \n - H—High\n - L—Low\n - N—None"
        integrity_impact:
          type: string
          description: "The CVSSv3 integrity impact metric for the vulnerability the plugin covers. Possible values include:\n - H—High\n - L—Low\n - N—None"
        availability_impact:
          type: string
          description: "The CVSSv2 availability impact metric for the vulnerability the plugin covers. Possible values include: \n - H—High\n - L—Low\n - N—None"
        raw:
          type: string
          description: The complete `cvss3_vector` metrics and result values for the vulnerability the plugin covers in a condensed and coded format. For example, `AV:N/AC:M/Au:N/C:C/I:C/A:C`.
    was-scan-information:
      description: Information about the latest scan that detected the vulnerability.
      type: object
      properties:
        schedule_uuid:
          type: string
          description: The schedule UUID for the scan that found the vulnerability.
        started_at:
          type: string
          description: The ISO timestamp when the scan started.
        completed_at:
          type: string
          description: The ISO timestamp when the scan completed.
        uuid:
          type: string
          description: The UUID of the scan that found the vulnerability.
    cvss_vector:
      type: object
      description: Additional CVSSv2 metrics for the vulnerability.
      properties:
        access_vector:
          type: string
          description: "The CVSSv2 Access Vector (AV) metric for the vulnerability the plugin covers. Possible values include: \n - L—Local\n - A—Adjacent Network\n - N—Network"
        access_complexity:
          type: string
          description: "The CVSSv2 Access Complexity (AC) metric for the vulnerability the plugin covers. Possible values include:\n - H—High\n - M—Medium\n - L—Low"
        authentication:
          type: string
          description: "The CVSSv2 Authentication (Au) metric for the vulnerability the plugin covers. Possible values include: \n - N—None\n - S—Single\n - M—Multiple"
        confidentiality_impact:
          type: string
          description: "The CVSSv2 confidentiality impact metric for the vulnerability the plugin covers. Possible values include: \n - N—None\n - P—Partial\n - C—Complete"
        integrity_impact:
          type: string
          description: "The CVSSv2 integrity impact metric for the vulnerability the plugin covers. Possible values include: \n - N—None\n - P—Partial\n - C—Complete"
        availability_impact:
          type: string
          description: "The CVSSv2 availability impact metric for the vulnerability the plugin covers. Possible values include: \n - N—None\n - P—Partial\n - C—Complete"
        raw:
          type: string
          description: The complete `cvss_vector` metrics and result values for the vulnerability the plugin covers in a condensed and coded format. For example, `AV:N/AC:M/Au:N/C:C/I:C/A:C`.
    cvss3_temporal_vector:
      type: object
      description: CVSSv3 temporal metrics for the vulnerability.
      properties:
        exploitability:
          type: string
          description: "The CVSSv3 Exploit Maturity Code (E) for the vulnerability the plugin covers. Possible values include: \n - Unproven—Corresponds to the Unproven (U) value for the E metric\n - Proof-of-concept—Corresponds to the Proof-of-Concept (POC) value for the E metric\n - Functional—Corresponds to the Functional (F) value for the E metric\n - High—Corresponds to the High (H) value for the E metric\n - Not-defined—Corresponds to the Not Defined (ND) value for the E metric"
        remediation_level:
          type: string
          description: "The CVSSv3 Remediation Level (RL) temporal metric for the vulnerability the plugin covers. Possible values include: \n - O—Official Fix\n - T—Temporary Fix\n - W—Workaround\n - U—Unavailable\n - X—Not Defined"
        report_confidence:
          type: string
          description: "The CVSSv3 Report Confidence (RC) temporal metric for the vulnerability the plugin covers. Possible values include: \n - U—Unknown\n - R—Reasonable\n - C—Confirmed\n - X—Not Defined"
        raw:
          type: string
          description: The complete `cvss3_temporal_vector` metrics and result values for the vulnerability the plugin covers in a condensed and coded format. For example, `E:U/RL:OF/RC:C`.
    epss_filter:
      description: "Filters vulnerabilities by their Exploit Prediction Scoring System (EPSS) score, expressed as a percentage from 0 to 100. You can combine properties to define value ranges. For example, use `gte: 50` and `lte: 80` to return vulnerabilities with EPSS scores between 50 and 80 inclusive. \n\nFor more information, see FIRST's [Exploit Prediction Scoring System (EPSS)](https://www.first.org/epss/).\n\n**Note:** This filter is not yet available but will be supported soon."
      type: object
      properties:
        eq:
          description: Returns vulnerabilities with an EPSS score equal to the specified value(s). Cannot be combined with `lt`, `gt`, `lte`, or `gte`.
          type: array
          items:
            type: number
            format: float
            minimum: 0
            maximum: 100
        neq:
          description: Returns vulnerabilities with an EPSS score _not_ equal to the specified value(s). Can be combined with `eq`.
          type: array
          items:
            type: number
            format: float
            minimum: 0
            maximum: 100
        gt:
          description: Returns vulnerabilities with an EPSS score _greater than_ the specified value. Cannot be combined with `eq`.
          type: number
          format: float
          minimum: 0
          maximum: 100
        gte:
          description: Returns vulnerabilities with an EPSS score _greater than or equal to_ the specified value. Cannot be combined with `eq`.
          type: number
          format: float
          minimum: 0
          maximum: 100
        lt:
          description: Returns vulnerabilities with an EPSS score _less than_ the specified value. Cannot be combined with `eq`.
          type: number
          format: float
          minimum: 0
          maximum: 100
        lte:
          description: Returns vulnerabilities with an EPSS score _less than or equal to_ the specified value. Cannot be combined with `eq`.
          type: number
          format: float
          minimum: 0
          maximum: 100
    exploit_framework:
      type: object
      description: Detail of exploit framework
      properties:
        type:
          type: string
          description: Framework type/name. Eg. canvas, metasploit, exploithub, etc.
        ids:
          type: array
          description: framework ids
          items:
            type: string
    response-findings-export-status:
      description: Information about the specified findings export job.
      type: object
      properties:
        uuid:
          type: string
          description: The UUID of the findings export request.
        status:
          type: string
          description: "The status of the findings export request. Possible values include:\n - QUEUED—Tenable Web App Scanning has queued the export request until other requests currently in process are completed.\n - PROCESSING—Tenable Web App Scanning has started processing the export request.\n - FINISHED—Tenable Web App Scanning has completed processing the export request. The list of chunks is complete.\n - CANCELLED—An administrator has cancelled the export request.\n - ERROR—Tenable Web App Scanning encountered an error while processing the export request. Tenable recommends that you retry the request. If the status persists on retry, contact Tenable Support."
        reason:
          type: string
          description: "The reason the export failed or completed with errors. This property is only present when the export status is `ERROR` or `FINISHED` with failed chunks. Possible values include:\n - \"The export request timed out. Try again.\"\n - \"An unexpected error occurred while processing the export. Try again later.\"\n - \"The export could not be completed. If this issue persists, please contact support.\"\n - \"{N} of {M} chunks failed to process. The remaining chunks are available for download.\""
        chunks_available:
          type: array
          description: A list of completed chunks available for download.
          items:
            type: integer
            format: int32
        chunks_failed:
          type: array
          description: A list of chunks for which the export process failed. If a chunk fails processing, submit the export request again. If the chunk continues to fail, contact Tenable Support.
          items:
            type: integer
            format: int32
        chunks_cancelled:
          type: array
          description: A list of chunks for which the export process was cancelled. If a chunk fails processing, Tenable Web App Scanning automatically cancels all subsequent chunks queued for export in the same request.
          items:
            type: integer
            format: int32
        total_chunks:
          type: integer
          description: The total number of chunks associated with the export job as a whole.
        chunks_available_count:
          type: integer
          description: The total number of completed chunks available for download.
        empty_chunks_count:
          type: integer
          description: The total number of empty chunks.
        finished_chunks:
          type: integer
          description: The number of chunks that have been processed and are available for download.
        filters:
          type: object
          description: The filters used in the findings export job request. For a list of possible filters, see the filters available for the [Export findings](ref:was-export-findings) endpoint.
          properties: {}
        num_assets_per_chunk:
          type: integer
          description: The number of assets contained in each export chunk.
        created:
          type: integer
          format: int64
          description: A Unix timestamp indicating the date and time on which the exports job was created.
    vpr_filter:
      description: 'Filters vulnerabilities based on their Vulnerability Priority Rating (VPR) version 1 score. You can define score ranges using properties such as `gte` (greater than or equal to) and `lte` (less than or equal to). For example, to match vulnerabilities with VPR scores between 9.0 and 9.9, include `{ "gte": 9.0, "lte": 9.9 }` in the filter.




        For details about VPR, see [Vulnerability Priority Rating](https://docs.tenable.com/vulnerability-management/Content/Explore/Findings/RiskMetrics.htm#Vulnerability-Priority-Rating-) in the _Tenable Vulnerability Management User Guide_.'
      type: object
      properties:
        eq:
          description: Returns vulnerabilities with a VPR exactly equal to the specified score or scores. This property _cannot_ be used in combination with `lt`, `gt`, `lte`, or `gte`.
          type: array
          items:
            type: number
            format: float
            minimum: 0.1
            maximum: 10
        neq:
          description: Returns vulnerabilities with a VPR _not_ equal to the specified score or scores. This property can be combined with the `eq` property.
          type: array
          items:
            type: number
            format: float
            minimum: 0.1
            maximum: 10
        gt:
          description: Returns vulnerabilities with a VPR _greater than_ the specified score. This property cannot be combined with the `eq` property.
          type: number
          format: float
          minimum: 0.1
          maximum: 10
        gte:
          description: Returns vulnerabilities with a VPR _greater than or equal to_ the specified score. This property cannot be combined with the `eq` property.
          type: number
          format: float
          minimum: 0.1
          maximum: 10
        lt:
          description: Returns vulnerabilities with a VPR _less than_ the specified score. This property cannot be combined with the `eq` property.
          type: number
          format: float
          minimum: 0.1
          maximum: 10
        lte:
          description: Returns vulnerabilities with a VPR _less than or equal to_ the specified score. This property cannot be combined with the `eq` property.
          type: number
          format: float
          minimum: 0.1
          maximum: 10
    cvss4_vector:
      type: object
      description: An object representing the full set of CVSS v4.0 base metrics for the vulnerability. These metrics define the intrinsic characteristics of the vulnerability, including how it can be exploited (e.g., attack vector, privileges required) and the potential impacts to both the vulnerable system and subsequent systems (e.g., confidentiality, integrity, availability). For the complete specification, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).
      properties:
        attack_vector:
          type: string
          description: The CVSSv4 Attack Vector (AV) metric, which describes the context by which the vulnerability can be exploited. For more details, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).
          enum:
          - Network
          - Adjacent
          - Local
          - Physical
        attack_complexity:
          type: string
          description: The CVSSv4 Attack Complexity (AC) metric, which indicates the conditions beyond the attacker's control that must exist to exploit the vulnerability. For more details, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).
          enum:
          - Low
          - High
        attack_requirements:
          type: string
          description: The CVSSv4 Attack Requirements (AR) metric specifies prerequisite conditions of the vulnerable component that must be met for an attack to succeed. For more details, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).
          enum:
          - None
          - Present
        privileges_required:
          type: string
          description: The CVSSv4 Privileges Required (PR) metric indicates the level of privileges an attacker must have to successfully exploit the vulnerability. For more details, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).
          enum:
          - None
          - Low
          - High,
        user_interaction:
          type: string
          description: The CVSSv4 User Interaction (UI) metric describes the level of user interaction required for an attack to succeed. For more details, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).
          enum:
          - None
          - Passive
          - Active
        vulnerable_system_confidentiality:
          type: string
          description: The CVSSv4 Vulnerable System Confidentiality (VC) metric measures the impact on the confidentiality of information on the vulnerable system. For more details, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).
          enum:
          - High
          - Low
          - None
        vulnerable_system_integrity:
          type: string
          description: The CVSSv4 Vulnerable System Integrity (VI) metric measures the impact on the integrity of information on the vulnerable system. For more details, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).
          enum:
          - High
          - Low
          - None
        vulnerable_system_availability:
          type: string
          description: The CVSSv4 Vulnerable System Availability (VA) metric measures the impact on the availability of the vulnerable system. For more details, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).
          enum:
          - High
          - Low
          - None
        subsequent_system_confidentiality:
          type: string
          description: The CVSSv4 Subsequent System Confidentiality (SC) metric measures the impact on the confidentiality of information on systems _subsequent_ to the vulnerable component. For more details, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).
          enum:
          - High
          - Low
          - None
        subsequent_system_integrity:
          type: string
          description: The CVSSv4 Subsequent System Integrity (SI) metric measures the impact on the integrity of information on systems *subsequent* to the vulnerable component. For more details, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).
          enum:
          - High
          - Low
          - None
        subsequent_system_availability:
          type: string
          description: The CVSSv4 Subsequent System Availability (SA) metric measures the impact on the availability of systems _subsequent_ to the vulnerable component. For more details, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).
          enum:
          - High
          - Low
          - None
        raw:
          type: string
          description: The complete CVSSv4 Base vector string representing all metric values in a compact, standardized format. This includes metrics such as Attack Vector, Attack Complexity, Privileges Required, and others. For example, `AV:N/AC:L/AT:P/PR:H/UI:N/VC:N/VI:N/VA:H/SC:N/SI:N/SA:H`. For more details, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).
    cvss4_filter:
      description: 'Filters vulnerabilities based on their CVSS version 4 (CVSSv4) base score. You can specify score ranges using the provided comparison properties. For example, to retrieve vulnerabilities with a CVSSv4 score between 7.0 and 9.9, include `{ "gte": 7.0, "lte": 9.9 }` in your filter.


        For more details about CVSSv4, see the [CVSS v4.0 Specification](https://www.first.org/cvss/v4-0/specification-document).'
      type: object
      properties:
        eq:
          description: Returns vulnerabilities with a CVSSv4 score exactly equal to the specified value(s). Cannot be combined with `lt`, `gt`, `lte`, or `gte`.
          type: array
          items:
            type: number
            format: float
            minimum: 0
            maximum: 10
        neq:
          description: Returns vulnerabilities with a CVSSv4 score _not_ equal to the specified value(s). Can be combined with eq.
          type: array
          items:
            type: number
            format: float
            minimum: 0
            maximum: 10
        gt:
          description: Returns vulnerabilities with a CVSSv4 score _greater than_ the specified value. Cannot be combined with `eq`.
          type: number
          format: float
          minimum: 0
          maximum: 10
        gte:
          description: Returns vulnerabilities with a CVSSv4 score _greater than or equal to_ the specified value. Cannot be combined with `eq`.
          type: number
          format: float
          minimum: 0
          maximum: 10
        lt:
          description: Returns vulnerabilities with a CVSSv4 score _less than_ the specified value. Cannot be combined with `eq`.
          type: number
          format: float
          minimum: 0
          maximum: 10
        lte:
          description: Returns vulnerabilities with a CVSSv4 score _less than or equal to_ the specified value. Cannot be combined with `eq`.
          type: number
          format: float
          minimum: 0
          maximum: 10
    response-findings-export-jobs:
      type: object
      properties:
        uuid:
          type: string
          description: The UUID of the findings export request.
        status:
          type: string
          description: "The status of the findings export request. Possible values include:\n - QUEUED—Tenable Web App Scanning has queued the export request until other requests currently in process are completed.\n - PROCESSING—Tenable Web App Scanning has started processing the export request.\n - FINISHED—Tenable Web App Scanning has completed processing the export request. The list of chunks is complete.\n - CANCELLED—An administrator has cancelled the export request.\n - ERROR—Tenable Web App Scanning encountered an error while processing the export request. Tenable recommends that you retry the request. If the status persists on retry, contact Tenable Support."
        reason:
          type: string
          description: "The reason the export failed or completed with errors. This property is only present when the export status is `ERROR` or `FINISHED` with failed chunks. Possible values include:\n - \"The export request timed out. Try again.\"\n - \"An unexpected error occurred while processing the export. Try again later.\"\n - \"The export could not be completed. If this issue persists, please contact support.\"\n - \"{N} of {M} chunks failed to process. The remaining chunks are available for download.\""
        total_chunks:
          type: integer
          description: The total number of chunks associated with the export job as a whole.
