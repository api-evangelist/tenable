    ErrorResponse:
      type: object
      required:
      - reasons
      description: Tenable Web App Scanning error response.
      properties:
        reasons:
          type: array
          description: A list of reasons for the Tenable Web App Scanning error.
          items:
            type: object
            description: A reason for the Tenable Web App Scanning error, including a code and an extended description.
            minItems: 1
            required:
            - code
            - reason
            properties:
              code:
                type: string
                description: "The Tenable Web App Scanning error code. Error code values include:\n - `NOT_FOUND`—Returned if Tenable Web App Scanning could not find the resource you specified.\n - `INVALID_ID_FORMAT`—Returned if you specify a resource ID in an invalid format.\n - `INVALID_PARAMETER`—Returned if you specify an invalid URL parameter.\n- `INVALID_JSON_BODY`—Returned if you specify invalid JSON in request payload.\n - `DUPLICATE_ENTITY`—Returned if you attempt to create a duplicate resource.\n - `NOT_ALLOWED`—Returned if Tenable Web App Scanning encounters a stateful conflict, for example, if you attempt to start a scan that is already in progress.\n - `OPERATION_FORBIDDEN`—Returned if you do not have sufficient permissions to access a resource or complete a task."
              reason:
                type: string
                description: The extended description of the cause of the Tenable Web App Scanning error.
    response-was-findings-chunk:
      type: object
      description: A chunk of WAS findings.
      properties:
        finding_id:
          type: string
          description: The unique identifier of the finding (vulnerability).
        url:
          type: string
          description: The fully-qualified domain name or URL associated with the finding.
        input_type:
          type: string
          description: The type of HTML Form input associated with the finding.
        input_name:
          type: string
          description: The type of page element that's vulnerable. For example, an HTML form.
          example: form
        http_method:
          type: string
          description: The HTTP method associated with the finding. For example, the GET or POST HTTP method.
        output:
          type: string
          description: The text output from the plugin that detected the finding.
          example: 'The backup directory detected at URL: http://webscantest.com/rfplaces/somedir1.rar

            Identified by converting the original directory name of ''somedir1'' to ''somedir1.rar''.'
        proof:
          type: string
          description: The output from the web application corroborating that the finding is present.
          example: <xss_9a3511f8-7852-4096-a7c0-6065ff8ebad3/>
        payload:
          type: string
          description: The attack payload used to detect the finding.
          example: alert('xss')
        state:
          type: string
          description: "The state of the finding as determined by the Tenable Web App Scanning state service. Possible values include:\n - OPEN—The finding is currently present on an asset.\n - REOPENED—The finding was previously marked as fixed on an asset but has returned.\n - FIXED—The finding was present on an asset but is no longer detected.\n\nNote that the API uses different terms for finding states than the user interface. The `new` and `active` states in the user interface map to the `OPEN` state in the API. The `resurfaced` state in the user interface maps to the `REOPENED` state in the API. The `FIXED` state is the same."
          enum:
          - OPEN
          - REOPENED
          - FIXED
        severity:
          type: string
          description: The severity of the finding as defined using the Common Vulnerability Scoring System (CVSS) base score. Possible values include `info` (CVSS score of 0), `low` (CVSS score between 0.1 and 3.9), `medium` (CVSS score between 4.0 and 6.9), `high` (CVSS score between 7.0 and 9.9), and `critical` (CVSS score of 10.0).
          enum:
          - INFO
          - LOW
          - MEDIUM
          - HIGH
          - CRITICAL
        severity_id:
          type: integer
          format: int32
          description: "The code for the severity assigned when a user recast the risk associated with the finding. Possible values include: \n - 0—The vulnerability has a CVSS score of 0, which corresponds to the \"info\" severity level.\n - 1—The vulnerability has a CVSS score between 0.1 and 3.9, which corresponds to the \"low\" severity level.\n - 2—The vulnerability has a CVSS score between 4.0 and 6.9, which corresponds to the \"medium\" severity level.\n - 3—The vulnerability has a CVSS score between 7.0 and 9.9, which corresponds to the \"high\" severity level.\n - 4—The vulnerability has a CVSS score of 10.0, which corresponds to the \"critical\" severity level."
        severity_default_id:
          type: integer
          format: int32
          description: The code for the severity originally assigned to a finding before a user recast the risk associated with the finding. Possible values are the same as for the `severity_id` attribute.
        recast_reason:
          type: string
          description: The text that appears in the Comment field of the recast rule in the Tenable Web App Scanning user interface.
        recast_rule_uuid:
          type: string
          description: The UUID of the recast rule that applies to the plugin.
        severity_modification_type:
          type: string
          description: "The type of modification a user made to the finding's severity. Possible values include: \n - none—No modification has been made.\n - recasted—A user in the Web App Scanning user interface has recast the risk associated with the finding. \n - accepted—A user in the Web App Scanning user interface has accepted the risk associated with the finding. \n\nFor more information about recast and accept rules, see the [Recast/Accept Rules](https://docs.tenable.com/vulnerability-management/Content/Settings/Recast/AboutRecastRules.htm) in the Tenable Vulnerability Management User Guide."
        first_found:
          type: string
          description: An ISO timestamp indicating the date and time when a scan first detected the finding on the asset.
        last_found:
          type: string
          description: An ISO timestamp indicating the date and time when a scan last detected the finding on the asset.
        last_fixed:
          type: string
          description: An ISO timestamp indicating the date and time when a scan no longer detects the previously detected finding on the asset.
        last_observed:
          type: string
          description: An ISO timestamp indicating the date and time when the finding was previously detected/observed on the asset.
        indexed_at:
          type: integer
          format: int64
          description: An ISO timestamp indicating the date and time when the vulnerability was indexed into Tenable Web App Scanning.
        plugin:
          $ref: '#/components/schemas/was_plugin'
        asset:
          $ref: '#/components/schemas/response-was-export-chunk-asset'
        scan:
          $ref: '#/components/schemas/was-scan-information'
    response-was-export-chunk-asset:
      type: object
      description: Information about the asset where the scan detected the vulnerability.
      properties:
        uuid:
          type: string
          description: The UUID of the asset where a scan found the vulnerability.
        fqdn:
          type: string
          description: The fully-qualified domain name of the asset where a scan found the vulnerability.
        ipv4:
          type: string
          description: The IPv4 address of the asset where a scan found the vulnerability.
        ipv4s:
          type: array
          description: The list of IPv4 addresses if the asset has multiple IPv4 addresses.
          items:
            type: string
    vpr_v2_filter:
      description: "Filters vulnerabilities based on their Vulnerability Priority Rating (VPR) version 2 score. This enhanced version is labeled **VPR (Beta)** in the user interface. You can define score ranges using properties such as `gte` (greater than or equal to) and `lte` (less than or equal to). For example, to match vulnerabilities with VPR scores between 9.0 and 9.9, include `{ \"gte\": 9.0, \"lte\": 9.9 }` in the filter. \n\n**Caution**: The `vpr_v2_score` filter parameter is scheduled for deprecation on July 1, 2026 as part of the transition to VPR v2. To ensure continued functionality, update all integrations to use the `vpr_score` filter parameter. On the deprecation date, the system will update `vpr_score` to support the new VPR model. For more information, see [Vulnerability Priority Rating: Transition to VPR Version 2](changelog:vulnerability-priority-rating-transition-to-version-2). \n\nFor details about VPR, see [Vulnerability Priority Rating](https://docs.tenable.com/vulnerability-management/Content/Explore/Findings/RiskMetrics.htm#Vulnerability-Priority-Rating-) in the _Tenable Vulnerability Management User Guide_. To learn about the enhancements introduced in VPR v2, refer to the whitepaper [Enhancements to Tenable Vulnerability Priority Rating (VPR)](https://www.tenable.com/whitepapers/enhancements-to-tenable-vulnerability-priority-rating-vpr)."
      type: object
      properties:
        eq:
          description: Returns vulnerabilities with a VPR exactly equal to the specified score or scores. This property _cannot_ be used in combination with `lt`, `gt`, `lte`, or `gte`.
          type: array
          items:
            type: number
            format: float
            minimum: 0.1
            maximum: 10
        neq:
          description: Returns vulnerabilities with a VPR _not_ equal to the specified score or scores. This property can be combined with the `eq` property.
          type: array
