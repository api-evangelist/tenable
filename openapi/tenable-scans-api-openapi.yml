    patch:
      summary: Update scan status
      description: Update the `requested_action` attribute for a scan. The requested action must be valid for the scan's current status. For example, you can pause or stop a scan if it has a status of `running` or resume a scan if it has a status of `paused`. Otherwise, Tenable Web App Scanning returns a 409 response code. This request creates an asynchronous update job.<div class="perms-callout">Requires the Scan Operator [24] user role or the `WAS.SCAN_WAS.MANAGE` custom role privilege. Additionally, requires the Can Execute [32] scan permission. See [Roles](doc:roles) and [Permissions](doc:permissions).</div>
      operationId: was-v2-scans-status-update
      tags:
      - Scans
      parameters:
      - in: path
        name: scan_id
        required: true
        schema:
          type: string
          format: uuid
        description: The UUID of the scan for which you want to update status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - requested_action
              properties:
                requested_action:
                  type: string
                  description: The action to apply to the scan.
                  enum:
                  - pause
                  - resume
                  - stop
      responses:
        '202':
          description: Returned if Tenable Web App Scanning successfully creates an update job.
          content:
            application/json:
              examples:
                response:
                  value: {}
        '401':
          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
              examples:
                response:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: Invalid credentials.
        '404':
          description: Returned if Tenable Web App Scanning cannot find the specified scan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
              examples:
                response:
                  value:
                    reasons:
                    - code: NOT_FOUND
                      reason: Resource with ID 'b29f198c-eac6-4107-b046-c621f542cd39' not found
        '409':
          description: Returned if the requested action update is invalid for the current scan status.
          content:
            application/json:
              schema:
