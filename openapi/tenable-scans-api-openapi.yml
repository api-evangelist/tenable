      operationId: was-v3-scans-debug-zip-download
      x-readme:
        explorer-enabled: false
      parameters:
      - description: The UUID of the scan for which you want to retrieve debug information.
        in: path
        name: scan_id
        required: true
        schema:
          type: string
          format: uuid
      tags:
      - Scans
      responses:
        '200':
          description: Returned if the ZIP file for the specified scan UUID was downloaded successfully.
