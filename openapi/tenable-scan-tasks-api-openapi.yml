  /scans/check-auto-targets:
    post:
      summary: Test scan routes
      description: Evaluates a list of targets and/or tags against the scan route configuration of scanner groups. Returns the list of missed targets (if any) and the list of matched scanner groups (if any).<div class="perms-callout">Requires the Scan Operator [24] user role. See [Roles](doc:roles).</div>
      operationId: io-scans-check-auto-targets
      tags:
      - Scan Tasks
      parameters:
      - description: Limit the number of missed targets returned in the response.
        required: false
        name: limit
        in: query
        schema:
          type: integer
          example: '5'
          default: null
          format: int32
      - description: Limit the number of matched resource UUIDs returned in the response.
        required: false
        name: matched_resource_limit
        in: query
        schema:
          type: integer
          example: '5'
          default: null
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                network_uuid:
                  type: string
                  description: Specify a value as follows:<ul><li>If your scans involve separate environments with overlapping IP ranges, specify the UUID of the [network](doc:manage-networks-tio) you want to associate with the results of the auto-routed scan. This value must match the network where you have assigned the scanner groups that you configured for scan routing.</li><li>Otherwise, specify the default network (00000000-0000-0000-0000-000000000000).</li></ul>
                  example: 00000000-0000-0000-0000-000000000000
                tags:
                  type: array
                  description: A list of asset tags UUIDs.
                  items:
                    type: string
                    description: The UUID of an asset tag. When you submit this request, Tenable Vulnerability Management resolves this tag to a list of zero or more targets. For more information about asset tags, see [Manage Asset Tags](doc:manage-asset-tags-tio).
                    example: 5c251613-4305-4378-ad64-bd97730e0c59
                target_list:
                  type: string
                  description: A comma-delimited list of targets to scan. For a full list of supported target formats, see the [Tenable Vulnerability Management User Guide](https://docs.tenable.com/vulnerability-management/Content/Scans/AboutScanTargets.htm).
                  example: example.com, example.net, localhost
              required:
              - network_uuid
      responses:
        '200':
          description: Returned if the list of targets or tags was evaluated against the scan route configuration successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan_Tasks_Response-Check-Targets'
              examples:
                response:
                  value:
                    missed_targets:
                    - example.com
                    - localhost
                    total_missed_targets: 2
                    matched_resource_uuids:
                    - 4d636d44-76ba-4f81-bfc6-6b9a0de66ee9
                    total_matched_resource_uuids: 1
        '401':
          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan_Tasks_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: Invalid credentials.
        '429':
          description: Returned if you attempt to send too many requests in a specific period of time. For more information, see [Rate Limiting](doc:rate-limiting).
          content:
            text/html:
              examples:
                response:
                  value: "<html>\n\n<head>\n    <title>429 Too Many Requests</title>\n</head>\n\n<body bgcolor=\"white\">\n    <center>\n        <h1>429 Too Many Requests</h1>\n    </center>\n    <hr>\n    <center>nginx</center>\n</body>\n\n</html>"
        '500':
          description: Returned if an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Scan_Tasks_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
      security:
      - Scan_Tasks_cloud: []
components:
  schemas:
    Scan_Tasks_timezones:
      type: array
      items:
        $ref: '#/components/schemas/Scan_Tasks_timezone'
    Scan_Tasks_settings-rrules:
      type: string
      description: 'The interval at which the scan repeats. The interval is formatted as a string of three values delimited by semi-colons. These values are: the frequency (FREQ=ONETIME or DAILY or WEEKLY or MONTHLY or YEARLY), the interval (INTERVAL=1 or 2 or 3 ... x), and the days of the week (BYDAY=SU,MO,TU,WE,TH,FR,SA). For a scan that runs every three weeks on Monday Wednesday and Friday, the string would be `FREQ=WEEKLY;INTERVAL=3;BYDAY=MO,WE,FR`. If the scan is not scheduled to recur, this attribute is `null`. For more information, see [rrules Format](doc:example-assessment-scan-recurring#rrules-format).


        **Note:** To set the `rrules` parameter for an agent scan, the request must also include the following body parameters:<ul><li>The `uuid` parameter must specify an agent scan template. For more information, see [Tenable-Provided Agent Templates](https://docs.tenable.com/vulnerability-management/Content/Scans/AgentTemplates.htm) and the [List templates](ref:editor-list-templates) endpoint.</li><li>The `agent_group_id` parameter must specify an agent group. For more information, see [Agent Groups](ref:agent-groups).</li></ul>For an example request body for an agent scan, see [Example Agent Scan: Recurring](doc:example-agent-scan-recurring).'
    Scan_Tasks_ManagedCredentialPermissions:
      type: object
      properties:
        grantee_uuid:
          type: string
          description: "The UUID of the user or user group granted permissions for managed credentials. \n\nThis parameter is required when assigning CAN USE [32] or CAN EDIT [64] permissions for managed credentials."
        type:
          type: string
          description: "A value specifying whether the grantee is a user (`user`) or a user group (`group`).  \n\nThis parameter is required when assigning CAN USE [32] or CAN EDIT [64] permissions for  managed credentials."
          enum:
          - user
          - group
        permissions:
          type: integer
          description: "A value specifying the permissions granted to the user or user group for the managed credentials. Possible values are:\n - 32—The user can view credentials information and use the credentials in scans. Corresponds to the **Can Use** permission in the user interface.\n - 64—The user can view and edit credential settings, delete the credentials, and use the credentials in scans. Corresponds to the **Can Edit** permission in the user interface.  \n\nThis parameter is required when assigning CAN USE [32] or CAN EDIT [64] permissions for managed credentials."
        name:
          type: string
          description: "The name of the user or user group that you want to grant permissions for the managed credentials.  \n\nThis parameter is optional when assigning CAN USE [32] or CAN EDIT [64] permissions for the managed credentials."
    Scan_Tasks_Response-Check-Targets:
      type: object
      properties:
        missed_targets:
          type: array
          items:
            type: string
          description: The list of targets that did not match a route in any scanner group.
        total_missed_targets:
          type: integer
          description: The total count of missed targets, before being truncated by the optional `limit` parameter.
        matched_resource_uuids:
          type: array
          items:
            type: string
          description: A list of UUIDs for scanner groups where configured scan routes matched at least one of the specified targets.
        total_matched_resource_uuids:
          type: integer
          description: The count of matched resource UUIDs, before being truncated by the optional `matched_resource_limit` parameter.
    Scan_Tasks_ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: The HTTP status code of the error.
        error:
          type: string
          description: The standard HTTP error name.
        message:
          type: string
          description: A brief message about the cause of the error.
    Scan_Tasks_Response-Scan-Object:
      type: object
      properties:
        name:
          type: string
          description: The name of the scan.
        status:
          type: string
          description: The status of the scan. For a list of possible values, see [Scan Status](doc:scan-status-tio).
        id:
          type: integer
          description: The unique ID of the scan.
        last_modification_date:
          type: integer
          description: For newly-created scans, the date on which the scan configuration was created. For scans that have been launched at least once, this attribute does not represent the date on which the scan configuration was last modified. Instead, it represents the date on which the scan was last launched, in Unix time format. Tenable Vulnerability Management updates this attribute each time the scan launches.
          format: int64
        uuid:
          type: string
          description: The UUID of the scan.
        type:
          type: string
          description: The type of scan (local, remote, or agent).
        owner:
          type: string
          description: The owner of the scan.
        enabled:
          type: boolean
          description: If `true`, the schedule for the scan is enabled.
        read:
          type: boolean
          description: If `true`, the scan has been read.
        shared:
          type: boolean
          description: If `1`, the scan is shared with users other than the scan owner. The level of sharing is specified in the `acls` attribute of the scan details.
        user_permissions:
          type: integer
          description: The sharing permissions for the scan.
        creation_date:
          type: integer
          format: int64
          description: The creation date for the scan in Unix time.
        control:
          type: boolean
          description: If `true`, the scan has a schedule and can be launched.
        starttime:
          type: string
          description: 'For one-time scans, the starting date and time for the scan. For recurrent scans, the first date on which the scan schedule is active and the time that recurring scans launch based on the `rrules` attribute.


            This attribute has the following format: `YYYYMMDDTHHMMSS`.'
        timezone:
          type: string
          description: The timezone of the scheduled start time for the scan.
        rrules:
          $ref: '#/components/schemas/Scan_Tasks_settings-rrules'
        schedule_uuid:
          type: string
          description: The UUID for a specific instance in the scan schedule.
    Scan_Tasks_timezone:
      type: object
      properties:
        name:
          type: string
          description: The readable name of the timezone.
        value:
          type: string
          description: The system value for the timezone.
    Scan_Tasks_CredentialSettingsRequestObject:
      description: 'The configuration settings for the credentials. The parameters of this object vary depending on the credentials type. For more information, see [Determine Settings for a Credential Type](doc:determine-settings-for-credential-type).


        **Note:** This form displays limited parameters that support a Windows type of credentials that uses password authentication.'
      type: object
      properties:
        domain:
          type: string
          description: The Windows domain to which the username belongs.
        username:
          type: string
          description: The username on the target system.
        auth_method:
          type: string
          description: The name for the authentication method. This value corresponds to the credentials[].types[].configuration[].options[].id attribute in the response message for the [GET /credentials/types](ref:credentials-list-credential-types) endpoint.
          enum:
          - Password
        password:
          type: string
          description: The user password on the target system.
  securitySchemes:
    Bearer:
      type: apiKey
      in: header
      name: Authorization
      description: 'Example: Bearer {{token}}'
