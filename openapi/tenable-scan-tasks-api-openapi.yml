                      value: US/Alaska
                    - name: US/Aleutian
                      value: US/Aleutian
                    - name: US/Arizona
                      value: US/Arizona
                    - name: US/Central
                      value: US/Central
                    - name: US/East-Indiana
                      value: US/East-Indiana
                    - name: US/Eastern
                      value: US/Eastern
                    - name: US/Hawaii
                      value: US/Hawaii
                    - name: US/Indiana-Starke
                      value: US/Indiana-Starke
                    - name: US/Michigan
                      value: US/Michigan
                    - name: US/Mountain
                      value: US/Mountain
                    - name: US/Pacific
                      value: US/Pacific
                    - name: US/Pacific-New
                      value: US/Pacific-New
                    - name: US/Samoa
                      value: US/Samoa
                    - name: UTC
                      value: UTC
                    - name: Universal
                      value: Universal
                    - name: W-SU
                      value: W-SU
                    - name: WET
                      value: WET
                    - current: true
