  /editor/{type}/{object_id}/audits/{file_id}:
    get:
      summary: Download audit file
      description: Downloads the specified custom audit file associated with the scan or policy. The file ID can be found in the scan or policy details using the /editor/{type}/{object_id} endpoint.<div class="perms-callout">Requires Can Execute [32] scan template (policy) permissions. See [Permissions](doc:permissions).</div>
      operationId: editor-audits
      tags:
      - Editor
      parameters:
      - description: The type of template to retrieve (scan or policy).
        required: true
        name: type
        in: path
        schema:
          type: string
          default: scan
          enum:
          - scan
          - policy
      - description: The unique ID of the object.
        required: true
        name: object_id
        in: path
        schema:
          type: integer
          format: int32
      - description: The ID of the file to export.
