openapi: 3.2.0
info:
  title: Identity Exposure Attack type option API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Attack type option
  description: Security profile options relative to attack types (Indicator of Attacks)
paths:
  /api/profiles/{profileId}/attack-types/{attackTypeId}/attack-type-options:
    get:
      summary: Get all the attack type options related to a profile and attack type
      description: 'Required license type: ioaPreview, ioa'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the get /attack-type-options response
                type: array
                items:
                  description: A attack-type-option instance
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - codename
                  - profileId
                  - attackTypeId
                  - directoryId
                  - value
                  - valueType
                  - staged
                  properties:
                    id:
                      type: number
                      description: ' Unique numeric identifier of the option'
                    codename:
                      type: string
                      description: Unique string identifier of the option
                    profileId:
                      type: number
                      description: Identifier of the profile the option belongs to
                    attackTypeId:
                      type: number
                      description: Identifier of the attack-type the option belongs to
                    directoryId:
                      type:
                      - number
                      - 'null'
                      default: null
                      description: Identifier of the directory on which the option applies, if null it applies on all of them
                    value:
                      type: string
                      description: JSON-stringified value of the option
                    valueType:
                      type: string
                      enum:
                      - string
                      - regex
                      - float
                      - integer
                      - boolean
                      - date
                      - object
                      - array/string
                      - array/regex
                      - array/integer
                      - array/boolean
                      - array/select
                      - array/object
                      - array/cron
                      description: Type of the option value
                    name:
                      type:
                      - string
                      - 'null'
                      default: null
                      description: Localized name of the option
                    description:
                      type:
                      - string
                      - 'null'
                      default: null
                      description: Localized description of the option
                    translations:
                      type: array
                      items:
                        type: string
                    staged:
                      type: boolean
                      description: Whether the option is still in draft
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Attack type option
      x-tenablead-required-product-license-type:
      - ioaPreview
      - ioa
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: profileId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: attackTypeId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: staged
        in: query
        schema:
          type: string
          enum:
          - '0'
          - '1'
        required: false
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiProfilesByProfileIdAttackTypesByAttackTypeIdAttackTypeOptions
      x-operation-id-source: derived
    post:
      summary: Create attack type options related to a profile and attack type
      description: 'Required license type: ioaPreview, ioa'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the get /profile/:profileId/attack-types/:attackTypeId/attack-type-options response
                type: array
                items:
                  description: A attack-type-option instance
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - codename
                  - profileId
                  - attackTypeId
                  - directoryId
                  - value
                  - valueType
                  - staged
                  properties:
                    id:
                      type: number
                      description: ' Unique numeric identifier of the option'
                    codename:
                      type: string
                      description: Unique string identifier of the option
                    profileId:
                      type: number
                      description: Identifier of the profile the option belongs to
                    attackTypeId:
                      type: number
                      description: Identifier of the attack-type the option belongs to
                    directoryId:
                      type:
                      - number
                      - 'null'
                      default: null
                      description: Identifier of the directory on which the option applies, if null it applies on all of them
                    value:
                      type: string
                      description: JSON-stringified value of the option
                    valueType:
                      type: string
                      enum:
                      - string
                      - regex
                      - float
                      - integer
                      - boolean
                      - date
                      - object
                      - array/string
                      - array/regex
                      - array/integer
                      - array/boolean
                      - array/select
                      - array/object
                      - array/cron
                      description: Type of the option value
                    name:
                      type:
                      - string
                      - 'null'
                      default: null
                      description: Localized name of the option
                    description:
                      type:
                      - string
                      - 'null'
                      default: null
                      description: Localized description of the option
                    translations:
                      type: array
                      items:
                        type: string
                    staged:
                      type: boolean
                      description: Whether the option is still in draft
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Attack type option
      x-tenablead-required-product-license-type:
      - ioaPreview
      - ioa
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: profileId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: attackTypeId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Validates the POST /profiles/:profileId/attack-types/:attackTypeId/attack-type-options request
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - codename
                - value
                - valueType
                properties:
                  codename:
                    type: string
                  directoryId:
                    type:
                    - number
                    - 'null'
                    default: null
                  value:
                    type: string
                  valueType:
                    type: string
                    enum:
                    - string
                    - regex
                    - float
                    - integer
                    - boolean
                    - date
                    - object
                    - array/string
                    - array/regex
                    - array/integer
                    - array/boolean
                    - array/select
                    - array/object
                    - array/cron
      operationId: postApiProfilesByProfileIdAttackTypesByAttackTypeIdAttackTypeOptions
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKey:
      name: x-api-key
      description: The user's API key
      in: header
      type: apiKey
x-readme:
  explorer-enabled: true
  proxy-enabled: true
