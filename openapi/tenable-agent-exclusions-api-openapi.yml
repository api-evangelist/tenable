openapi: 3.2.0
info:
  title: Tenable Platform & Settings Agent Exclusions API
  version: 1.0.0
servers:
- url: https://cloud.tenable.com
tags:
- name: Agent Exclusions
  x-displayName: Agent Exclusions
paths:
  /scanners/null/agents/exclusions:
    post:
      summary: Create agent exclusion
      description: 'Creates a new agent exclusion.

        Requires the Scan Manager [40] user role. See Roles.'
      operationId: agent-exclusions-create
      tags:
      - Agent Exclusions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the exclusion.
                description:
                  type: string
                  description: The description of the exclusion.
                schedule:
                  $ref: '#/components/schemas/agent-exclusions_schedule'
              required:
              - name
              - schedule
      responses:
        '200':
          description: Returned if the exclusion was created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent-exclusions_exclusion'
              examples:
                response:
                  value:
                    description: Router scan exclusion
                    name: Routers
                    uuid: 152de080-fb23-4351-8ab0-6a1fb8624039
                    creation_date: 1543541807
                    last_modification_date: 1543541807
                    id: 124234
                    core_updates_blocked: true
                    schedule:
                      starttime: '2018-12-31 19:35:00'
                      endtime: '2019-12-31 19:35:00'
                      enabled: true
                      rrules:
                        freq: DAILY
                        interval: 2
                      timezone: US/Pacific
        '400':
          description: Returned if an argument is missing or invalid.
        '401':
          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent-exclusions_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: Invalid credentials.
        '403':
          description: Returned if you do not have permission to create an exclusion.
        '429':
          description: Returned if you attempt to send too many requests in a specific period of time. For more information, see [Rate Limiting](doc:rate-limiting).
          content:
            text/html:
              examples:
                response:
                  value: "<html>\n\n<head>\n    <title>429 Too Many Requests</title>\n</head>\n\n<body bgcolor=\"white\">\n    <center>\n        <h1>429 Too Many Requests</h1>\n    </center>\n    <hr>\n    <center>nginx</center>\n</body>\n\n</html>"
        '500':
          description: Returned if an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent-exclusions_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
      security:
      - agent-exclusions_cloud: []
    get:
      summary: List agent exclusions
      description: 'Returns the list of current agent exclusions.

        Requires the Scan Manager [40] user role. See Roles.'
      operationId: agent-exclusions-list
      tags:
      - Agent Exclusions
      responses:
        '200':
          description: Returned if the list of exclusions was retrieved successfully.
          content:
            application/json:
              schema:
                description: An object containing an array of exclusion objects.
                properties:
                  exclusions:
                    $ref: '#/components/schemas/agent-exclusions_exclusions'
              examples:
                response:
                  value:
                    exclusions:
                    - description: Router scan exclusion
                      name: Routers
                      uuid: 152de080-fb23-4351-8ab0-6a1fb8624039
                      creation_date: 1543541807
                      last_modification_date: 1543541807
                      id: 124234
                      core_updates_blocked: true
                      schedule:
                        starttime: '2018-12-31 19:35:00'
                        endtime: '2019-12-31 19:35:00'
                        enabled: true
                        rrules:
                          freq: DAILY
                          interval: 8
                          byweekday: SU,MO
                          bymonthday: 9
                        timezone: US/Pacific
                    - description: Workstation scan exclusion
                      name: Workstation
                      uuid: 128de090-fb21-4451-8ab0-6b1fb8624123
                      creation_date: 2543541809
                      last_modification_date: 2543541809
                      id: 222456
                      core_updates_blocked: true
                      schedule:
                        starttime: '2018-12-31 19:35:00'
                        endtime: '2019-12-31 19:35:00'
                        enabled: true
                        rrules:
                          freq: DAILY
                          interval: 8
                          byweekday: TU
                          bymonthday: 11
                        timezone: US/Central
        '401':
          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent-exclusions_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: Invalid credentials.
        '403':
          description: Returned if you do not have permission to view the exclusions.
        '429':
          description: Returned if you attempt to send too many requests in a specific period of time. For more information, see [Rate Limiting](doc:rate-limiting).
          content:
            text/html:
              examples:
                response:
                  value: "<html>\n\n<head>\n    <title>429 Too Many Requests</title>\n</head>\n\n<body bgcolor=\"white\">\n    <center>\n        <h1>429 Too Many Requests</h1>\n    </center>\n    <hr>\n    <center>nginx</center>\n</body>\n\n</html>"
        '500':
          description: Returned if an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent-exclusions_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
      security:
      - agent-exclusions_cloud: []
  /scanners/null/agents/exclusions/{exclusion_id}:
    get:
      summary: Get agent exclusion details
      description: 'Returns details for the specified agent exclusion.

        Requires the Scan Manager [40] user role. See Roles.'
      operationId: agent-exclusions-details
      tags:
      - Agent Exclusions
      parameters:
      - description: The ID of the exclusion.
        required: true
        name: exclusion_id
        in: path
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Returned if the specified exclusion's details were retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/agent-exclusions_exclusion'
              examples:
                response:
                  value:
                    description: Router scan exclusion
                    name: Routers
                    uuid: 152de080-fb23-4351-8ab0-6a1fb8624039
