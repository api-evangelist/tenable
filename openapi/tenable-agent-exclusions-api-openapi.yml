              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
      security:
      - agent-exclusions_cloud: []
    put:
      summary: Update agent exclusion
      description: 'Updates an agent exclusion.

        Requires the Scan Manager [40] user role. See Roles.'
      operationId: agent-exclusions-edit
      tags:
      - Agent Exclusions
      parameters:
      - description: The ID of the exclusion to edit.
        required: true
        name: exclusion_id
        in: path
        schema:
          type: integer
          format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the exclusion.
                description:
                  type: string
                  description: The description of the exclusion.
                schedule:
