openapi: 3.2.0
info:
  title: Identity Exposure Topology API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Topology
  description: A graph to represent the trust relationships between different Active Directories
paths:
  /api/profiles/{profileId}/topology:
    get:
      summary: Get a representation of the AD topology
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the get /profiles/{profileId}/topology response
                type: object
                additionalProperties: false
                required:
                - infrastructures
                - trusts
                properties:
                  infrastructures:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - uid
                      - name
                      - known
                      - directories
                      properties:
                        uid:
                          type: string
                        name:
                          type: string
                        known:
                          type: boolean
                        directories:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            additionalProperties: false
                            required:
                            - uid
                            - name
                            - known
                            properties:
                              uid:
                                type: string
                              name:
                                type: string
                              known:
                                type: boolean
                              id:
                                type: integer
                  trusts:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - from
                      - to
                      - hazardLevel
                      - attributes
                      properties:
                        from:
                          type: string
                        to:
                          type: string
                        hazardLevel:
                          type: string
                          enum:
                          - regular
                          - dangerous
                          - unknown
                        attributes:
                          type: array
                          items:
                            type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Topology
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: profileId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiProfilesByProfileIdTopology
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKey:
      name: x-api-key
      description: The user's API key
      in: header
      type: apiKey
x-readme:
  explorer-enabled: true
  proxy-enabled: true
