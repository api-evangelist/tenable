                required:
                - id
                - address
                - criticityThreshold
                - directories
                - checkers
                - attackTypes
                - profiles
                - shouldNotifyOnInitialFullSecurityCheck
                - description
                - inputType
                properties:
                  id:
                    type: integer
                  address:
                    type: string
                  criticityThreshold:
                    type: integer
                  directories:
                    minItems: 1
                    type: array
                    items:
                      type: integer
                  description:
                    type:
                    - string
                    - 'null'
                  checkers:
                    type:
                    - array
                    - 'null'
                    minItems: 1
                    items:
                      type: integer
                  attackTypes:
                    type:
                    - array
                    - 'null'
                    minItems: 1
                    items:
                      type: integer
                  profiles:
                    type:
                    - array
                    - 'null'
                    minItems: 1
                    items:
                      type: integer
                  shouldNotifyOnInitialFullSecurityCheck:
                    type: boolean
                  inputType:
                    enum:
                    - deviances
                    - attacks
                    - healthChecks
                  healthCheckNames:
                    type:
                    - array
                    - 'null'
                    minItems: 1
                    items:
                      type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Email notifier
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Validates the post /email-notifiers response
              type: object
              properties:
                address:
                  type: string
                criticityThreshold:
