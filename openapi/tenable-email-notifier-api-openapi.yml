openapi: 3.2.0
info:
  title: Identity Exposure Email notifier API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Email notifier
  description: An email notification about new deviances
paths:
  /api/email-notifiers:
    get:
      summary: Retrieve all email-notifier instances
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the get /email-notifiers response
                type: array
                items:
                  description: email-notifier
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - address
                  - criticityThreshold
                  - directories
                  - checkers
                  - attackTypes
                  - profiles
                  - shouldNotifyOnInitialFullSecurityCheck
                  - description
                  - inputType
                  properties:
                    id:
                      type: integer
                    address:
                      type: string
                    criticityThreshold:
                      type: integer
                    directories:
                      minItems: 1
                      type: array
                      items:
                        type: integer
                    description:
                      type:
                      - string
                      - 'null'
                    checkers:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: integer
                    attackTypes:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: integer
                    profiles:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: integer
                    shouldNotifyOnInitialFullSecurityCheck:
                      type: boolean
                    inputType:
                      enum:
                      - deviances
                      - attacks
                      - healthChecks
                    healthCheckNames:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Email notifier
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiEmailNotifiers
      x-operation-id-source: derived
    post:
      summary: Create email-notifier instance
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the post /email-notifiers response
                type: array
                items:
                  description: email-notifier
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - address
                  - criticityThreshold
                  - directories
                  - checkers
                  - attackTypes
                  - profiles
                  - shouldNotifyOnInitialFullSecurityCheck
                  - description
                  - inputType
                  properties:
                    id:
                      type: integer
                    address:
                      type: string
                    criticityThreshold:
                      type: integer
                    directories:
                      minItems: 1
                      type: array
                      items:
                        type: integer
                    description:
                      type:
                      - string
                      - 'null'
                    checkers:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: integer
                    attackTypes:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: integer
                    profiles:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: integer
                    shouldNotifyOnInitialFullSecurityCheck:
                      type: boolean
                    inputType:
                      enum:
                      - deviances
                      - attacks
                      - healthChecks
                    healthCheckNames:
                      type:
                      - array
                      - 'null'
                      minItems: 1
                      items:
                        type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Email notifier
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Validates the post /email-notifiers response
              type: array
              minItems: 1
              items:
                allOf:
                - type: object
                  required:
                  - address
                  - criticityThreshold
                  - directories
                  - shouldNotifyOnInitialFullSecurityCheck
                  - inputType
                  properties:
                    address:
                      type: string
                    criticityThreshold:
                      type: integer
                    directories:
                      minItems: 1
                      type: array
                      items:
                        type: integer
                    description:
                      type: string
                    shouldNotifyOnInitialFullSecurityCheck:
                      type: boolean
                    inputType:
                      type: string
                      enum:
                      - deviances
                      - attacks
                      - healthChecks
                - description: List the properties that depend on the input type
                  type: object
                  oneOf:
                  - allOf:
                    - properties:
                        inputType:
                          enum:
                          - deviances
                    - required:
                      - checkers
                      - profiles
                      properties:
                        checkers:
                          type: array
                          minItems: 1
                          items:
                            type: integer
                        profiles:
                          type: array
                          minItems: 1
                          items:
                            type: integer
                  - allOf:
                    - not:
                        properties:
                          inputType:
                            enum:
                            - deviances
                    - oneOf:
                      - allOf:
                        - properties:
                            inputType:
                              enum:
                              - attacks
                        - required:
                          - attackTypes
                          - profiles
                          properties:
                            attackTypes:
                              type: array
                              minItems: 1
                              items:
                                type: integer
                            profiles:
                              type: array
                              minItems: 1
                              items:
                                type: integer
                      - allOf:
                        - not:
                            properties:
                              inputType:
                                enum:
                                - attacks
                        - {}
      operationId: postApiEmailNotifiers
      x-operation-id-source: derived
  /api/email-notifiers/{id}:
    get:
      summary: Get email-notifier instance by id
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
