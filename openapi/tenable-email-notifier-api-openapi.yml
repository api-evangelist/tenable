      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '204':
          description: ''
          content:
            application/json:
              schema:
                description: email-notifier
                additionalProperties: false
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
