                description:
                  type: string
                checkers:
                  type:
                  - array
                  - 'null'
                  minItems: 1
                  items:
                    type: integer
                attackTypes:
                  type:
                  - array
                  - 'null'
                  minItems: 1
                  items:
                    type: integer
                profiles:
                  type:
                  - array
                  - 'null'
                  minItems: 1
                  items:
