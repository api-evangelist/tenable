                    - 'null'
                    minItems: 1
                    items:
                      type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Email notifier
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiEmailNotifiersById
      x-operation-id-source: derived
    patch:
      summary: Update email-notifier instance
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
