components:
  schemas:
    Cloud_Connectors_aws_sub_account:
      required:
      - account_id
      - role_arn
      - external_id
      - trails
      type: object
      properties:
        account_id:
          type: string
          description: The AWS account ID.
        role_arn:
          type: string
          description: The Amazon Resource Name (ARN) of the role generated based on the associated account ID.
        external_id:
          description: The UUID of your Tenable Vulnerability Management instance used by AWS to identify it as a client application. You can obtain the UUID of your Tenable Vulnerability Management account using the [GET /users/{user_id}](ref:users-details) endpoint. The UUID corresponds to the `container_uuid` attribute of the response message for that endpoint.
          type: string
        trails:
          description: A list of AWS cloudtrails associated with the account.
          type: array
          items:
            $ref: '#/components/schemas/Cloud_Connectors_trail'
        incremental_mode:
          type: boolean
          description: Indicates whether a connector has completed the initial full import successfully. If the value is `true`, then the connector is in incremental mode where it imports assets based on events instead of enumerating all assets in the account every single time.
    Cloud_Connectors_trail:
      required:
      - arn
      type: object
      properties:
        arn:
          type: string
          description: The Amazon Resource Name (ARN) of the cloudtrail.
        name:
          type: string
          description: The name of the cloudtrail.
        region:
          $ref: '#/components/schemas/Cloud_Connectors_region'
        availability:
          description: "Indicates whether a cloudtrail is available to be used by a connector (logging is turned on in AWS, or it has at least one EventSelector with IncludeManagementEvents). Values include:\n - `success`—The cloudtrail is available.\n - `error`—The cloudtrail is not available."
          type: string
          enum:
          - success
          - error
    Cloud_Connectors_azure_status:
      type: object
      properties:
        last_event_seen:
          type: string
          description: An ISO timestamp indicating the last time the connector found new or changed records and successfully imported them.
        release_timestamp:
          description: An ISO timestamp indicating the last time the connector successfully completed an import (regardless of whether it found any changes).
          type: string
        message:
          type: string
          description: The extended import status message.
    Cloud_Connectors_Response-Connector:
      type: object
      properties:
        type:
          type: string
          description: The type of cloud connector. Types include `aws`, `aws_keyless`, `aws_fa`, `azure`, `azure_fa`, `gcp`, or `gcp_keyless`.
        human_type:
          type: string
          description: The human-readable connector type.
        data_type:
          type: string
          description: The data type imported by the connector. This value is always `assets`.
        name:
          type: string
          description: The name of the cloud connector. The name must be unique within a Tenable Vulnerability Management instance.
        status:
          type: string
          description: "The import status of the connector. Status values can include:\n - Completed—Tenable Vulnerability Management successfully used the connector to import assets (no imports scheduled)\n - Scheduled—Imports using the connector are scheduled for future dates\n - Saved—Tenable Vulnerability Management saved the connector configuration, but did not import assets at this time (no imports scheduled)\n - Error—Tenable Vulnerability Management failed to import assets using the connector"
        is_fa:
          type: boolean
          description: For AWS keyless connectors, indicates whether Frictionless Assessment is enabled or not.
        status_message:
          type: string
          description: Extended description of the connector status. If Frictionless Assessment is enabled, this property is set to `FA Enabled`. For information about connector error codes, see [Connectors](doc:io-connectors).
        schedule:
          $ref: '#/components/schemas/Cloud_Connectors_schedule'
        date_created:
          type: string
          description: An ISO timestamp indicating the date and time on which the connector was created, for example, `2018-12-31T13:51:17.243Z`.
        date_modified:
          type: string
          description: An ISO timestamp indicating the date and time on which the connector was last modified or new records were imported, for example, `2018-12-31T13:51:17.243Z`.
        id:
          type: string
          description: The UUID of the connector.
        container_uuid:
          type: string
          description: The UUID of the Tenable Vulnerability Management instance.
        expired:
          type: boolean
          description: Indicates whether the Vulnerability Management license for the Tenable Vulnerability Management instance associated with the connector is expired.
        incremental_mode:
          type: boolean
          description: Indicates whether a connector has completed the initial full import successfully. If the value is `true`, then the connector is in incremental mode where it imports assets based on on the service provider event stream instead of enumerating all assets in the account every single time.
        params:
          $ref: '#/components/schemas/Cloud_Connectors_response_params'
        last_sync_time:
          type: string
          description: An ISO timestamp indicating the date and time of the last successful import, for example, `2018-12-31T13:51:17.243Z`.
        network_uuid:
          type: string
          format: UUID
          description: The UUID of the [network](doc:manage-networks-tio) associated with the connector.
    Cloud_Connectors_region:
      type: object
      properties:
        name:
          type: string
          description: The AWS region code, for example, `us-east-1`. The value of `All` indicates that the cloudtrail is associated with all AWS available regions.
        friendly_name:
          description: The AWS region name, for example, `US East (N. Virginia)`. The value of `All` indicates that the cloudtrail is associated with all AWS available regions.
          type: string
    Cloud_Connectors_Request-ConnectorCreate:
