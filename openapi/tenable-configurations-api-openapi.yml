  /was/v2/configs/{config_id}/status/{tracking_id}:
    get:
      summary: Get scan configuration processing status
      description: "Tracks the current status of a scan configuration creation, update, or upsert process. When creating or updating a scan configuration, this endpoint can be used to determine the current status of the request. You can poll this endpoint using a sensible pause duration between each request until a `completed` or `failed` status is returned. \n\nThe `config_id` and `tracking_id` can be retrieved from the URI provided in the `Location` header of the `202 Accepted` response from the [POST /was/v2/configs](ref:was-v2-config-create) or [PUT /was/v2/configs/{config_id}](ref:was-v2-config-upsert) request used to create or update the scan configuration. <div class=\"perms-callout\">Requires the Scan Operator [24] user role or the `WAS.SCAN_WAS.MANAGE` custom role privilege. Additionally, requires the Can View [16] scan permission. See [Roles](doc:roles) and [Permissions](doc:permissions).</div>"
      operationId: was-v2-config-status
      tags:
      - Configurations
      parameters:
      - description: 'The UUID of the scan configuration.


          **Note:** The `config_id` can be retrieved from the URI provided in the `Location` header of the `202 Accepted` response from the [POST /was/v2/configs](ref:was-v2-config-create) or [PUT /was/v2/configs/{config_id}](ref:was-v2-config-upsert) request used to create or update the scan configuration.'
        in: path
        name: config_id
        required: true
        schema:
          type: string
          format: uuid
      - description: "The tracking UUID for the request you want to retrieve the status for. \n\n**Note:** The `tracking_id` can be retrieved from the URI provided in the `Location` header of the `202 Accepted` response from the [POST /was/v2/configs](ref:was-v2-config-create) or [PUT /was/v2/configs/{config_id}](ref:was-v2-config-upsert) request used to create or update the scan configuration."
        in: path
        name: tracking_id
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Returned if the status for the scan configuration was found.
          content:
            application/json:
              schema:
                type: object
                required:
                - tracking_status
                properties:
                  tracking_status:
                    description: The status of the scan creation, update, or upsert process. Possible values are `processing`, `complete`, or `failed`.
                    type: string
                    enum:
                    - processing
