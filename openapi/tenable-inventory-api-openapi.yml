                      - not exists
                      sortable: true
                      filterable: true
                      description: '# Sources

                        ## The origin of a software


                        The source of a software is the place where it was created or obtained. It can be a software vendor, a repository, or a third-party website. The source of a software is important because it can affect its security and reliability. For example, software obtained from a reputable vendor is more likely to be secure than software obtained from an unknown source.


                        Here are some key points to understand about sources in the context of the cyber industry:

                        - **Software Vendors**: These are companies that develop and sell software. They are the primary source of software for most organizations.

                        - **Repositories**: These are online storage locations where software can be downloaded. Repositories can be public or private. Public repositories are open to anyone, while private repositories are only accessible to authorized users.

                        - **Third-Party Websites**: These are websites that offer software for download. They can be legitimate or malicious. Legitimate third-party websites offer software from reputable vendors, while malicious third-party websites offer software that is infected with malware.


                        It is important to be aware of the source of software before installing it. Software obtained from a reputable source is more likely to be secure and reliable.

                        '
                    - key: last_seen
                      readable_name: Last Seen
                      control:
                        type: DATE
                        multiple_allowed: false
                        regex:
                          hint: timestamp
                          expression: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                      operators:
                      - '='
                      - '>'
                      - <
                      - between
                      - exists
                      - not exists
                      - older than
                      - newer than
                      - within last
                      sortable: true
                      filterable: true
                      description: '# Last Seen

                        ## The date and time when a software was last seen on a device


                        Last seen is a property that indicates the date and time when a software was last seen on a device. This information can be used to track the movement of software across devices and to identify devices that may have been compromised.


                        Here are some key points to understand about last seen in the context of the cyber industry:

                        - **Last seen is a valuable indicator of device compromise**. If a software is seen on a device that it is not typically installed on, it may be a sign that the device has been compromised.

                        - **Last seen can be used to track the movement of software across devices**. This information can be used to identify devices that may have been compromised or to track the spread of malware.

                        - **Last seen can be used to identify devices that are not being used**. This information can be used to save money on energy costs or to identify devices that may be vulnerable to attack.

                        '
                    - key: first_seen
                      readable_name: First Seen
                      control:
                        type: DATE
                        multiple_allowed: false
                        regex:
                          hint: timestamp
                          expression: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                      operators:
                      - '='
                      - '>'
                      - <
                      - between
                      - exists
                      - not exists
                      - older than
                      - newer than
                      - within last
                      sortable: true
                      filterable: true
                      description: '# First Seen

                        ## The date when the software was first seen by Tenable


                        The first seen date is the date when the software was first seen by Tenable. This date is important because it can be used to track the age of the software and to identify any potential vulnerabilities that may have been discovered since the software was first released.


                        Here are some key points to understand about first seen dates in the context of the cyber industry:

                        - **First Seen Dates Can Be Used to Track the Age of Software**: The first seen date can be used to track the age of software. This information can be helpful in identifying potential vulnerabilities that may have been discovered since the software was first released.

                        - **First Seen Dates Can Be Used to Identify Potential Vulnerabilities**: The first seen date can also be used to identify potential vulnerabilities that may have been discovered since the software was first released. This information can be helpful in prioritizing security updates and patches.

                        - **First Seen Dates Can Be Used to Track the Spread of Malware**: First seen dates can also be used to track the spread of malware. This information can be helpful in identifying potential threats and in developing mitigation strategies.

                        '
                    - key: category_names
                      readable_name: Category
                      control:
                        type: STRING
                        multiple_allowed: true
                        regex:
                          hint: Browser, Web Server, etc.,
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Software Category\n## A way to classify software\nSoftware categories are used to group software based on their functionality, purpose, or target audience. This categorization helps in organizing and managing software assets, understanding their risks, and applying appropriate security controls. \n\nHere are some common software categories:\n- **Operating Systems**:  Examples include Windows, macOS, Linux, Android, and iOS.\n- **Applications**: Software designed for specific tasks, such as productivity suites (Microsoft Office, Google Workspace), web browsers (Chrome, Firefox, Safari), and communication tools (Slack, Microsoft Teams).\n- **Databases**: Systems for storing, managing, and retrieving data. Examples include MySQL, PostgreSQL, MongoDB, and Microsoft SQL Server.\n- **Security Software**: Designed to protect systems and data from threats. Examples include antivirus software, firewalls, intrusion detection systems, and security information and event management (SIEM) systems.\n- **Cloud-Based Software**: Hosted and accessed over the internet. Examples include Software as a Service (SaaS) applications like Salesforce, Dropbox, and Office 365. \n"
        '400':
