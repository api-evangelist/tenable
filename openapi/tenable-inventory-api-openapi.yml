components:
  schemas:
    Inventory_Request-Search-Assets:
      description: An object containing a query and/or filters for a Tenable Exposure Management asset search.
      type: object
      properties:
        query:
          type: object
          description: Filter the search results by query. A query consists of search mode and query text.
          properties:
            mode:
              description: 'The mode to use for the query. You can choose either `simple` or `advanced`.

                * `simple`—A simple query enables you to search for assets by asset name or asset ID.

                * `advanced`—An advanced query enables you to build a specific query to search for assets.'
              type: string
              default: simple
              enum:
              - simple
              - advanced
            text:
              description: "For simple searches, either an asset name or an asset ID. For advanced searches, a query string. Advanced users can use the query builder in the user interface to create a query string.\n\nFor example, some common advanced queries are:\n\n* Cloud assets with critical severity findings—`Assets HAS sources = \"CLOUD\" WITH Weakness HAS severity = \"Critical\"` \n* Cloud assets with critical severity findings and AES score above 700—`Assets HAS sources = \"CLOUD\" AND aes >= 700 WITH Weakness HAS severity = \"Critical\"` \n* Cloud assets exposing secrets and AES score above 700—`Assets HAS sources = \"CLOUD\" AND aes >= 700 WITH Weakness HAS detection_name contains \"exposing secrets\"` \n* Account assets with critical weaknesses—`Assets as Account with weakness has severity_level >= 3` \n* Assets discovered but not scanned for weaknesses—`Assets as Device has is_licensed = false and last_observed_at > \"1988-01-01\"`"
              type: string
              example: Microsoft
          required:
          - mode
          - text
        filters:
          description: "A set of asset properties used to filter the search results. \n\nUse the [List asset properties](ref:inventory-asset-properties-list) endpoint to view available asset properties that can be used as filters."
          type: array
          items:
            type: object
            required:
            - operator
            - property
            - value
            properties:
              property:
                description: 'The asset property to filter on.


                  Use the [List asset properties](ref:inventory-asset-properties-list) endpoint to retrieve a list of valid asset properties for filtering. For example, you might filter by `created_at`, `sources`, or `fqdns`.'
                type: string
              operator:
                type: string
                description: "The comparison operator to apply to the filter. \n\nFor example: `=`, `!=`, `match`, etc. Use the [List asset properties](ref:inventory-asset-properties-list) endpoint to retrieve supported comparison operators for the selected filter."
                enum:
                - '='
                - '!='
                - <=
                - between
                - match
                - '>='
                - <
                - '>'
                - contains
                - not contains
                - exists
                - not exists
                - older than
                - newer than
                - within last
              value:
                description: "The value to use for comparison in the filter. \n\nUse the [List asset properties](ref:inventory-asset-properties-list) endpoint to retrieve the supported values for the selected filter."
                type: array
                items:
                  type: string
