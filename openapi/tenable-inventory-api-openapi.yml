  /api/v1/t1/inventory/findings/properties:
    get:
      summary: List finding properties
      description: "Returns a list of finding properties that can be used for filters on endpoints that support them. For example, the properties that are returned by this endpoint can be used as filters for the [Export findings](ref:inventory-export-findings) endpoint.\n\n  In addition to the finding properties, the results list includes the logical operators you can use with the finding properties along with the supported values.\n\n**Caution:** This endpoint is available for use but is currently in beta. The response structure is subject to change as we continue to enhance the data model. <div class=\"perms-callout\">Requires the Basic [16] user role or the `ASSET_INVENTORY.CYBER_ASSET_MANAGEMENT.READ` and `AD.TOGGLE_AD.USE` custom role privileges. See [Roles](doc:roles).</div>"
      operationId: inventory-finding-properties-list
      tags:
      - Inventory
      responses:
        '200':
          description: Returned if the list of finding properties was retrieved successfully.
          content:
            application/json:
              schema:
                description: A list of finding properties.
                type: object
                properties:
                  properties:
                    type: array
                    items:
                      $ref: '#/components/schemas/Inventory_Properties-Object'
              examples:
                response:
                  value:
                    data:
                    - key: finding_id
                      readable_name: Finding ID
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: 01234567-abcd-ef01-2345-6789abcdef01
                          expression: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}(,[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12})*'
                      operators:
                      - '='
                      - '!='
                      sortable: true
                      filterable: true
                      description: '# Finding ID

                        ## A unique identifier for a security issue

                        Each security issue identified by Tenable Exposure Management is assigned a unique Finding ID. This ID helps to track and manage individual findings throughout their lifecycle.


                        Here''s why Finding IDs are important:

                        - **Unique Identification:** Each finding receives a distinct ID, preventing confusion when dealing with multiple security issues.

                        - **Tracking and Management:** The ID helps track a finding''s status, remediation efforts, and history over time.

                        - **Reporting and Analysis:** Finding IDs enable efficient reporting and analysis of security issues, allowing you to identify trends and patterns.

                        - **Integration:** Finding IDs can be integrated with other security tools and systems for streamlined workflows.

                        '
                    - key: state
                      readable_name: State
                      control:
                        type: STRING
                        multiple_allowed: true
                        selection:
                        - name: Active
                          value: ACTIVE
                          deprecated: false
                        - name: Resurfaced
                          value: RESURFACED
                          deprecated: false
                        - name: Fixed
                          value: FIXED
                          deprecated: false
                      operators:
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# State \n\n## Current status of a security issue\n\nThe state of a finding reflects the current status of a security issue identified within your IT environment. It helps you track the progress of remediation efforts and provides insights into the overall security posture.\n\nHere are the different states for findings in Exposure Management:\n\n- **Active** — The finding is new or has not yet been addressed. It requires further investigation and potential remediation.\n- **Resurfaced**—The finding was fixed but got back.\n- **Fixed**—The issue identified in the finding has been successfully resolved.\n"
                    - key: last_updated
                      readable_name: Last Updated
                      control:
                        type: DATE
                        multiple_allowed: false
                        regex:
                          hint: timestamp
                          expression: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                      operators:
                      - '='
                      - '>'
                      - <
                      - between
                      - exists
                      - not exists
                      - older than
                      - newer than
                      - within last
                      sortable: true
                      filterable: true
                      description: "# Last Updated \n\n## Date of the last technical finding update\n\nThe \"Last Updated\" attribute for a finding in Exposure Management refers to the most recent time and date when the technical details of a specific security finding were updated. This update could be triggered by various events, such as:\n\n- **New scan data**: When a new vulnerability scan is conducted, and new information about existing findings is discovered, the \"Last Updated\" timestamp is updated to reflect the latest scan date.\n- **Vulnerability database updates**:  Exposure Management relies on vulnerability databases to identify and assess security issues. When these databases are updated with new information about vulnerabilities, the \"Last Updated\" timestamp for related findings is updated accordingly.\n- **Changes in asset configuration**: If the configuration of an asset associated with a finding is modified, it might impact the status or severity of the finding. In such cases, the \"Last Updated\" timestamp is updated to reflect the time of the configuration change.\n- **Manual verification or updates**: Security teams might manually verify or update the details of a finding based on their investigations or remediation efforts. These actions would also update the \"Last Updated\" timestamp.\n"
                    - key: first_observed_at
                      readable_name: First Seen
                      control:
                        type: DATE
                        multiple_allowed: false
                        regex:
                          hint: timestamp
                          expression: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                      operators:
                      - '='
                      - '>'
                      - <
                      - between
                      - exists
                      - not exists
                      - older than
                      - newer than
                      - within last
                      sortable: true
                      filterable: true
                      description: "# First Seen\n## Date of the first apparition of the asset\nThe date on which Exposure Management first identified and added an asset to its inventory. This information is valuable for understanding the age of assets, identifying potential shadow IT, and tracking the history of devices on the network. \n"
                    - key: last_observed_at
                      readable_name: Last Seen
                      control:
                        type: DATE
                        multiple_allowed: false
                        regex:
                          hint: timestamp
                          expression: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                      operators:
                      - '='
                      - '>'
                      - <
                      - between
                      - exists
                      - not exists
                      - older than
                      - newer than
                      - within last
                      sortable: true
                      filterable: true
                      description: "# Last Seen\n## Date of the last scan\nThe \"Last Seen\" attribute in Exposure Management refers to the most recent date and time when a specific asset or resource was detected as active or online within your monitored environment. \n\nHere's a breakdown of its significance:\n\n- **Asset Visibility:** It helps you understand which devices are currently active within your network.\n- **Security Posture:** Assets that haven't been seen recently might indicate potential issues like offline devices or undiscovered assets.\n- **Vulnerability Management:**  Knowing when an asset was last seen helps prioritize vulnerability scanning and remediation efforts. \n"
                    - key: port
                      readable_name: Port
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Port\n## A communication endpoint\nIn computer networking, a port is a communication endpoint. At the software level, within an operating system, a port is a logical construct that identifies a specific process or service. Ports are associated with IP addresses and use port numbers to differentiate between different applications or services running on a single device.\n\nHere are some key points to understand about ports:\n\n- **Purpose**: Ports allow different applications to send and receive data without interfering with each other.\n- **Numbering**: Ports are identified by numbers, ranging from 0 to 65,535.\n- **Well-known Ports**: Some ports (0-1023) are reserved for specific protocols or services, like port 80 for HTTP (web traffic) and port 443 for HTTPS (secure web traffic).\n- **Scanning and Security**: Attackers often scan systems for open and potentially vulnerable ports to exploit.\n- **Firewalls**: Firewalls can be configured to block or allow traffic on specific ports, enhancing network security. \n"
                    - key: protocol
                      readable_name: Protocol
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: '# Protocol

                        ## A set of rules for communication

                        In computing, a protocol refers to a set of established rules, procedures, and conventions that govern the format and transmission of data between two or more communicating entities, typically devices or software applications, over a network.


                        Here are some key points to understand about protocols in the context of the cyber industry:

                        - **Purpose**: Protocols ensure interoperability and seamless communication between different systems, regardless of their underlying hardware or software.

                        - **Structure**: They define data formats, addressing schemes, error handling mechanisms, and the sequence of messages exchanged during communication.

                        - **Examples**: Common protocols include TCP/IP (for internet communication), HTTP/HTTPS (for web browsing), DNS (for domain name resolution), and FTP (for file transfer).

                        - **Security**: Some protocols incorporate security features like encryption and authentication to protect data confidentiality and integrity during transmission.

                        - **Vulnerabilities**: Like any software, protocols can have vulnerabilities that attackers may exploit. Using outdated or insecure protocols can expose systems to risks.

                        '
                    - key: finding_attributes
                      readable_name: Finding Attributes
                      control:
                        type: OBJECT
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: false
                      filterable: false
                      description: "# Finding Attributes\n## Characteristics of a security finding\nFinding attributes are specific pieces of information or characteristics associated with a security finding. These attributes provide context, details, and insights about the finding, helping security teams understand its nature, severity, and potential impact.\n\nHere are some key points to understand about finding attributes in the context of Exposure Management:\n\n- **Provide Context**: Attributes like the affected asset, vulnerability details, and discovery source offer valuable context for understanding the finding.\n- **Facilitate Prioritization**: Attributes like severity, exploit availability, and asset criticality help prioritize remediation efforts based on risk.\n- **Enable Filtering and Reporting**: Attributes allow security teams to filter, sort, and group findings for analysis, reporting, and remediation tracking.\n- **Examples of Attributes**: Common finding attributes include severity, CVE ID, CVSS score, affected asset, first seen date, last seen date, remediation status, and more. \n"
                    - key: detection_id
                      readable_name: Detection ID
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: CVE-2023-45678
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Detection ID \n\n## A unique identifier for a security issue found on an asset.\n\nIt acts as a fingerprint for a specific instance of a vulnerability or misconfiguration detected on a device or application. This ID helps in tracking, managing, and remediating security issues effectively.\n\nHere's why Detection IDs are important:\n\n- **Unique Identification:** Each security issue gets a distinct ID, avoiding confusion when dealing with multiple findings.\n- **Tracking and Management:**  Exposure Management uses Detection IDs to monitor the status of vulnerabilities over time.\n- **Remediation and Reporting:**  Security teams use these IDs to prioritize and address the most critical risks. Detection IDs are also valuable for reporting and compliance purposes. \n"
                    - key: finding_name
                      readable_name: Finding Name
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: '# Finding Name

                        ## The name assigned to a specific security event or incident.

                        In Exposure Management, a Finding Name refers to the specific identifier or label given to a security finding or alert generated by a vulnerability scan or other security monitoring tools. It helps to distinguish and categorize different types of security events based on their characteristics and potential impact.


                        Here are some key points to understand about Finding Names in Exposure Management:


                        - **Unique Identification**: Each Finding Name represents a distinct security issue or vulnerability that has been identified.

                        - **Categorization and Classification**: Finding Names often follow a standardized format or taxonomy, allowing security teams to group and prioritize similar findings.

                        - **Severity Levels**: Finding Names may be associated with severity levels (e.g., Critical, High, Medium, Low) to indicate the potential impact of the identified issue.

                        - **Remediation Guidance**: Finding Names are typically linked to relevant information, such as descriptions, remediation steps, and best practices, to assist security teams in addressing the identified vulnerabilities.

                        '
                    - key: solution
                      readable_name: Solution
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Solution \n\n## A query language to find assets\n\nIt's a powerful query language within Exposure Management that enables security and IT professionals to search for and identify specific assets or groups of assets within their organization's IT environment. \n\nHere's a breakdown of how it works:\n\n- **Targeted Asset Discovery:**  Instead of manually sifting through extensive asset inventories, you can construct precise queries to pinpoint the exact assets you need to analyze.\n- **Flexible Search Criteria:** You can use a wide range of criteria, including asset attributes (e.g., operating system, IP address, installed software), security posture (e.g., vulnerabilities, misconfigurations), and business context (e.g., asset owner, criticality).\n- **Efficient Risk Management:** By quickly identifying assets with specific vulnerabilities or security gaps, organizations can prioritize remediation efforts and reduce their overall cyber risk. \n"
                    - key: severity
                      readable_name: Severity
                      control:
                        type: STRING
                        multiple_allowed: true
                        selection:
                        - name: Info
                          value: Info
                          deprecated: false
                        - name: Low
                          value: Low
                          deprecated: false
                        - name: Medium
                          value: Medium
                          deprecated: false
                        - name: High
                          value: High
                          deprecated: false
                        - name: Critical
                          value: Critical
                          deprecated: false
                      operators:
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Severity \n## How bad is this finding ?\nThe severity of a finding, often referred to as vulnerability severity, is a classification that indicates the level of potential risk posed by a security vulnerability. It helps prioritize remediation efforts by highlighting the most critical vulnerabilities that require immediate attention.\n\nHere's a breakdown of common severity levels and their implications:\n\n- **Critical**:  Critically severe vulnerabilities pose an immediate and significant risk to your organization. They often allow for remote code execution, complete system compromise, or data breaches.\n- **High**: High-severity vulnerabilities have a high likelihood of exploitation and could lead to significant damage or disruption.\n- **Medium**: Medium-severity vulnerabilities may not be easily exploitable but still represent a potential security risk. They might require specific conditions or user interaction to be exploited.\n- **Low**: Low-severity vulnerabilities pose a minimal risk to your organization. They might only result in minor inconveniences or limited impact.\n- **Informational**: Informational findings highlight potential security issues that do not directly pose a threat but could be leveraged in future attacks. \n"
                    - key: vpr_score
                      readable_name: VPR Score
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^(?:\d+\.?)*\d$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# VPR Score\n## Score to prioritize remediation actions\nVPR Score stands for Vulnerability Prioritization Rating Score. It's a numerical value assigned to vulnerabilities to help you prioritize remediation actions based on the severity of the vulnerability and its potential impact on your organization. \n\nHere's a breakdown of VPR Score:\n\n- **Range:** VPR Scores range from 0 to 10, with 10 being the most critical.\n- **Factors:**  VPR Score considers factors like the vulnerability's exploit maturity, how easily it can be exploited, whether it's actively being exploited in the wild, and the potential impact on your organization's assets.\n- **Prioritization:**  A high VPR Score indicates a vulnerability that requires immediate attention, while a lower score suggests it can be addressed with lower priority.\n- **Example Query:** `HAS AS Vulnerability VPR >= 9` would show all vulnerabilities with a VPR Score of 9 or higher. \n"
                    - key: cves
                      readable_name: Cves
                      control:
                        type: ARRAY
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      - size =
                      - size >=
                      - size >
                      - size <=
                      - size <
                      - size !=
                      sortable: true
                      filterable: true
                      description: "# CVE \n\n## Known vulnerabilities and exposures for a finding\n\nA CVE (Common Vulnerabilities and Exposures) for a finding refers to a specific vulnerability or weakness identified in a software component or system configuration that has been publicly disclosed and assigned a unique CVE identifier. \n\nHere's a breakdown:\n\n- **Public Database**: CVEs are listed in a public database (maintained by MITRE) that provides detailed information about each vulnerability, including its description, severity, affected software versions, and potential impact.\n- **Standardized Identification**: Using CVE IDs helps in standardizing how vulnerabilities are identified and tracked across different security tools and organizations.\n- **Remediation Guidance**: CVE entries often include links to vendor patches, workarounds, or mitigation strategies that can be used to address the vulnerability.\n- **Contextual Awareness**: When a CVE is associated with a finding, it provides valuable context, enabling security teams to understand the specific vulnerability, its potential impact, and the urgency of remediation. \n"
                    - key: asset_id
                      readable_name: Asset Id
                      control:
                        type: STRING
                        multiple_allowed: true
                        regex:
                          hint: 01234567-abcd-ef01-2345-6789abcdef01
                          expression: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}(,[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12})*'
                      operators:
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Asset ID \n## Unique identifier of the asset on which the finding was discovered\nEach asset in Exposure Management is assigned a unique identifier. When a vulnerability or misconfiguration, referred to as a \"finding,\" is discovered on an asset, the \"Asset ID \" associates that finding with the specific asset it affects. This ID helps in pinpointing the affected asset and understanding its security posture.\n\nHere's why the \"Asset ID \" is important:\n\n- **Remediation**: It guides security teams directly to the asset requiring attention for vulnerability patching or configuration fixes.\n- **Risk Assessment**: By knowing which assets have findings, organizations can assess the potential impact on their business operations.\n- **Asset-Centric View**: It enables a consolidated view of all findings associated with a particular asset, providing a comprehensive understanding of its security status.\n- **Prioritization**:  Understanding which assets have the most findings can help prioritize remediation efforts based on criticality and potential impact. \n"
                    - key: asset_name
                      readable_name: Asset Name
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: hostname
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Asset Name \n\n## Name of the asset where the finding is discovered.\n\nThis field, within a finding, displays the name of the asset where the vulnerability or security issue has been identified. It helps to pinpoint the affected device or system. \n\nHere's why it's important:\n\n- **Targeted Remediation:** Knowing the asset name allows security teams to prioritize and focus their remediation efforts on the specific device or system that requires attention.\n- **Impact Assessment:** By identifying the affected asset, organizations can assess the potential impact of the finding on their business operations, data, and reputation.\n- **Asset Inventory:** The asset name helps in maintaining an accurate and up-to-date inventory of all assets within an organization's IT environment.\n- **Incident Response:** During security incidents, knowing the affected asset is crucial for rapid isolation, containment, and remediation.\n- **Risk Management:**  Understanding which assets are affected by findings contributes to a comprehensive risk management strategy, enabling organizations to allocate resources effectively. \n"
                    - key: asset_class
                      readable_name: Asset Class
                      control:
                        type: STRING
                        multiple_allowed: true
                        selection:
                        - name: Account
                          value: ACCOUNT
                          deprecated: false
                        - name: Web Application
                          value: APPLICATION
                          deprecated: false
                        - name: Container
                          value: CONTAINER
                          deprecated: false
                        - name: Other Resource
                          value: GENERAL
                          deprecated: false
                        - name: Device
                          value: DEVICE
                          deprecated: false
                        - name: Group
                          value: GROUP
                          deprecated: false
                        - name: Infrastructure As Code
                          value: IAC
                          deprecated: true
                        - name: Storage
                          value: STORAGE
                          deprecated: false
                        - name: Person
                          value: IDENTITY
                          deprecated: true
                        - name: Resource
                          value: RESOURCE
                          deprecated: false
                        - name: Role
                          value: ROLE
                          deprecated: false
                      operators:
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Asset Class \n\n## Type of asset where the finding is discovered\n\nThe \"Asset Class \" refers to the specific category or type of asset within your IT environment where a security finding or vulnerability has been identified. \n\nHere's a breakdown:\n\n- **Context:** When Exposure Management scans your environment for vulnerabilities, it categorizes the findings based on the type of asset affected.\n- **Examples:** Common asset classes include \"Device,\" \"Web Application,\" \"Cloud Instance,\" \"Code Repository,\" or \"Container Image.\"\n- **Purpose:** This classification helps you understand which parts of your infrastructure are most vulnerable and prioritize remediation efforts accordingly.\n- **Filtering:** You can use the \"Asset Class \" filter in Cyber Asset Management to focus on vulnerabilities affecting specific asset types. For example: `HAS AS = \"Device\"` would show findings related to devices. \n"
                    - key: apa_total_steps_count
                      readable_name: Total Number of Attack Techniques
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Total Number of Attack Techniques \n## The number of attack techniques that can be used to exploit a vulnerability\nThis metric, found in Cyber Asset Management, represents the count of distinct attack techniques associated with a vulnerability. It provides insights into the various methods attackers could employ to exploit a specific weakness. \n\nHere's a breakdown:\n\n- **Higher numbers generally indicate a greater potential risk**, as more avenues exist for exploitation.\n- **It's crucial to prioritize vulnerabilities** with higher attack technique counts for remediation.\n- **This metric helps security teams understand the breadth of potential attack vectors** and allocate resources accordingly. \n"
                    - key: apa_low_steps_count
                      readable_name: Number of Low Attack Techniques
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Number of Low Attack Techniques \n## Number of low techniques to potentially exploit a vulnerability\nThis metric, found in the Exposure Management application, counts the number of low-level techniques an attacker might use to exploit a specific vulnerability. \n\nHere's a breakdown:\n- **Low Attack Techniques:** These represent the easiest methods for attackers to exploit a vulnerability. They often require minimal technical skills or resources.\n- **Finding Exploitable Vulnerabilities:**  Exposure Management helps identify vulnerabilities with a low number of attack techniques, allowing you to prioritize patching or mitigation efforts on the most easily exploitable weaknesses in your systems. \n"
                    - key: apa_medium_steps_count
                      readable_name: Number of Medium Attack Techniques
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Number of Medium Attack Techniques \n\n## Number of MITRE ATT&CK techniques with a difficulty rating of \"Medium\" used to exploit a vulnerability.\n\nThis metric, found in Exposure Management, reflects the number of MITRE ATT&CK techniques classified as \"Medium\" in terms of difficulty that could be employed by an attacker to exploit a specific vulnerability present on an asset. \n\nHere's a breakdown:\n\n- **MITRE ATT&CK:** A globally recognized framework that categorizes and describes adversary tactics and techniques based on real-world observations.\n- **Techniques:** Specific procedures or methods used by attackers to achieve their objectives within a cyberattack.\n- **Difficulty Rating:**  ATT&CK techniques are assigned difficulty ratings (e.g., \"Easy,\" \"Medium,\" \"Hard\") based on factors like the complexity of execution and the resources required.\n- **Exploitation:** The act of taking advantage of a vulnerability to gain unauthorized access or control over a system or data. \n"
                    - key: apa_high_steps_count
                      readable_name: Number of High Attack Techniques
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Number of High Attack Techniques \n## Number of MITRE ATT&CK techniques classified as \"high\" for an asset.\nThis metric, found in Exposure Management, reflects the number of MITRE ATT&CK techniques, categorized as \"high\", associated with a specific asset. It helps to understand the potential attack surface of an asset based on known vulnerabilities and their exploitation techniques. \n\nHere's a breakdown:\n- **MITRE ATT&CK:** A globally recognized framework that describes adversary tactics and techniques based on real-world observations.\n- **Techniques:** Specific procedures or methods used by attackers to achieve their objectives within a tactic.\n- **\"High\" Classification:** Indicates techniques that are frequently used, easily exploited, or have a significant impact.\n- **Asset:** Any device, application, or system within your IT environment. \n"
                    - key: apa_critical_steps_count
                      readable_name: Number of Critical Attack Techniques
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Number of Critical Attack Techniques \n## Number of MITRE ATT&CK techniques classified as \"Critical\" for an asset.\nThis metric, found in Cyber Asset Management, reflects how susceptible an asset is to attacks. It leverages the MITRE ATT&CK framework, a knowledge base of adversary tactics and techniques based on real-world observations.  Each technique is assigned a severity score, and this metric specifically counts the techniques classified as \"Critical\" that apply to a given asset. The higher the count, the more vulnerable the asset is to potentially devastating attacks. \n\nHere's a breakdown:\n- **MITRE ATT&CK:** A globally accessible knowledge base of adversary tactics and techniques based on real-world observations.\n- **Critical Severity:**  Indicates techniques that have a high potential for impact and are frequently exploited by attackers.\n- **Asset Vulnerability:** A higher number of critical attack techniques associated with an asset indicates a greater susceptibility to serious cyberattacks. \n"
                    - key: sensor_type
                      readable_name: Source
                      control:
                        type: STRING
                        multiple_allowed: true
                        selection:
                        - name: Accurics
                          value: ACCURICS
                          deprecated: true
                        - name: Inventory
                          value: INVENTORY
                          deprecated: true
                        - name: Rapid7 InsightVM
                          value: RAPID_7
                          deprecated: true
                        - name: Tenable Security Center
                          value: SECURITY_CENTER
                          deprecated: false
                        - name: Carbon Black
                          value: CARBON_BLACK
                          deprecated: true
                        - name: Tenable Vulnerability Database
                          value: TVDB
                          deprecated: true
                        - name: AWS Connector
                          value: AWS
                          deprecated: true
                        - name: Tenable OT Security
                          value: OT
                          deprecated: false
                        - name: Tenable Container Security
                          value: CONSEC
                          deprecated: false
                        - name: Tenable Web Application Scanning
                          value: WAS
                          deprecated: false
                        - name: Tenable Attack Surface Management
                          value: ASM
                          deprecated: false
                        - name: Tenable Vulnerability Management
                          value: NESSUS
                          deprecated: false
                        - name: Tenable Cloud Security
                          value: CLOUD_SCAN
                          deprecated: false
                        - name: Tenable Identity Exposure
                          value: TIE
                          deprecated: false
                      operators:
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Source\n## Where data is coming from\nSource refers to the origin or provider of the data being used in a particular context. In Exposure Management, the source typically refers to the origin of the security data that is being used to assess and manage cyber risk.\n\nHere are some key points to understand about sources in the context of Exposure Management:\n\n- **Data Collection**: Exposure Management platforms gather data from various sources to provide a comprehensive view of an organization's security posture.\n- **Integration**:  Exposure Management solutions often integrate with a wide range of third-party security tools and platforms to collect data from different sources.\n- **Data Enrichment**: Data from different sources can be combined and enriched to provide more context and insights. For example, vulnerability data can be combined with asset information to identify which systems are most critical and vulnerable.\n- **Contextual Understanding**: Understanding the source of data is crucial for interpreting the results of security assessments and making informed decisions about risk mitigation. \n"
