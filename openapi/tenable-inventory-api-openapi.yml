                      description: '# Number Of High Weaknesses

                        ## The number of high weaknesses for an asset


                        The number of high weaknesses for an asset is a measure of the number of vulnerabilities that have been identified on the asset that are considered to be high risk. This information can be used to prioritize which assets should be patched first, as well as to track the progress of vulnerability remediation efforts.


                        Here are some key points to understand about the number of high weaknesses for an asset:

                        - **High-Risk Vulnerabilities**: These are vulnerabilities that are considered to be the most serious and pose the greatest risk to an asset. They should be patched as soon as possible.

                        - **Vulnerability Remediation**: The process of fixing vulnerabilities on an asset. This can be done by applying software updates, patches, or other security measures.

                        - **Vulnerability Management**: The process of identifying, assessing, and remediating vulnerabilities on assets. This is an important part of cyber risk management.

                        '
                    - key: medium_weakness_count
                      readable_name: Number Of Medium Weaknesses
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: '# Number Of Medium Weaknesses

                        ## The number of medium weaknesses found on an asset


                        This property indicates the number of medium weaknesses found on an asset. A weakness is a vulnerability that, when exploited, could lead to a security incident. The severity of a weakness is determined by its impact and exploitability. A medium weakness is one that has a moderate impact and is moderately exploitable.


                        The Number Of Medium Weaknesses property can be used to identify assets that are at a higher risk of being exploited. It can also be used to track the progress of remediation efforts. For example, if an asset has 10 medium weaknesses and 5 of them have been remediated, the Number Of Medium Weaknesses property would show 5.


                        This property is available for all asset types.

                        '
                    - key: low_weakness_count
                      readable_name: Number Of Low Weaknesses
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: '# Number Of Low Weaknesses

                        ## The number of low weaknesses for an asset


                        The number of low weaknesses for an asset is a measure of the number of vulnerabilities that have been identified on the asset that are considered to be low risk. This information can be used to prioritize which assets should be patched first, as well as to track the progress of vulnerability remediation efforts.


                        Here are some key points to understand about the number of low weaknesses for an asset:

                        - **Low-Risk Vulnerabilities**: These are vulnerabilities that are considered to be less likely to be exploited by attackers. They may be due to outdated software, misconfigurations, or other factors.

                        - **Vulnerability Remediation**: The process of fixing vulnerabilities by applying patches or other security updates.

                        - **Vulnerability Prioritization**: The process of determining which vulnerabilities should be fixed first. This is typically done by considering the risk of exploitation, the impact of an exploit, and the cost of remediation.


                        The number of low weaknesses for an asset can be calculated by running a vulnerability scan on the asset and then counting the number of vulnerabilities that are classified as low risk. This information can then be used to prioritize which assets should be patched first, as well as to track the progress of vulnerability remediation efforts.

                        '
                    - key: total_weakness_count
                      readable_name: Total Number of Weaknesses
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: '# Number Of Total Weaknesses

                        ## The number of weaknesses found on an asset


                        The number of total weaknesses is a property of an asset that indicates the number of weaknesses that have been found on the asset. This property can be used to identify assets that are at a higher risk of being exploited.


                        Here are some key points to understand about the number of total weaknesses:

                        - **Weaknesses**: A weakness is a vulnerability that can be exploited by an attacker. Weaknesses can be found in software, hardware, and configuration settings.

                        - **Exploitation**: The process of using a weakness to gain unauthorized access to a system or data.

                        - **Risk**: The likelihood that a weakness will be exploited and the potential impact of an exploitation.


                        The number of total weaknesses is a valuable metric for assessing the risk of an asset. Assets with a high number of weaknesses are more likely to be exploited and have a greater potential impact. This information can be used to prioritize remediation efforts and focus on the assets that pose the greatest risk.

                        '
                    - key: tag_count
                      readable_name: Associated Tags Count
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: '# Associated Tags Count

                        ## The number of tags associated with an asset


                        The associated tags count is a property that indicates the number of tags associated with an asset. This can be useful for identifying assets that are important or critical to the organization, as well as for tracking the use of tags.


                        Here are some key points to understand about associated tags count in the context of the cyber industry:

                        - **Tags**: Tags are labels that can be applied to assets to provide additional information about them. Tags can be used to categorize assets, track their use, and identify assets that are important or critical to the organization.

                        - **Associated Tags Count**: The associated tags count is a property that indicates the number of tags associated with an asset. This can be useful for identifying assets that are important or critical to the organization, as well as for tracking the use of tags.

                        - **Tagging**: The process of applying tags to assets is known as tagging. Tagging can be done manually or automatically.

                        - **Tag Management**: The process of managing tags is known as tag management. Tag management can be done manually or automatically.

                        '
                    - key: tag_ids
                      readable_name: Tag IDs
                      control:
                        type: STRING
                        multiple_allowed: true
                        regex:
                          hint: 01234567-abcd-ef01-2345-6789abcdef01
                          expression: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}(,[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12})*'
                      operators:
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: false
                      filterable: true
                      description: '# Tag IDs

                        ## A unique identifier for an asset


                        A tag ID is a unique identifier for an asset. It is used to track and manage assets, and to associate them with other data, such as vulnerabilities, risks, and compliance requirements. Tag IDs can be alphanumeric or numeric, and they must be unique within the organization.


                        Here are some key points to understand about tag IDs in the context of the cyber industry:

                        - **Tag IDs are used to track and manage assets**. They can be used to identify assets, to track their location, and to monitor their status.

                        - **Tag IDs can be associated with other data**. This data can include vulnerabilities, risks, and compliance requirements. This allows organizations to track the security posture of their assets and to identify potential risks.

                        - **Tag IDs must be unique**. This ensures that there is no confusion about which asset is being referred to.

                        '
                    - key: entitlement_count
                      readable_name: Accessible Resources
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: '# Entitlement Count

                        ## The number of entitlements associated with an asset


                        An entitlement is a permission or privilege that an asset has. Entitlements can be granted to assets at the individual, group, or organization level. The entitlement count is a measure of the number of entitlements associated with an asset.


                        The entitlement count can be used to assess the risk of an asset being compromised. A high entitlement count indicates that the asset has a lot of permissions, which makes it more likely to be exploited by an attacker. The entitlement count can also be used to track changes to an asset''s entitlements. This can help to identify unauthorized changes that could be indicative of a security incident.


                        The entitlement count is a valuable metric for assessing the risk of an asset and tracking changes to its entitlements. It can be used to identify assets that are at high risk of compromise and to monitor for unauthorized changes.

                        '
                    - key: apa_asset_critical_paths_count
                      readable_name: Number Of Critical Attack Paths
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: false
                      filterable: true
                      description: "# Number Of Critical Attack Paths\n## Number of attack paths with criticality higher than defined threshold\nThis metric, available in the context of attack path analysis, represents the count of potential attack paths leading to a specific asset where the overall criticality of the path exceeds a predefined threshold. \n\nHere's a breakdown:\n- **Attack Path:** A sequence of steps an attacker might take to move laterally within a network, exploiting vulnerabilities to reach a target asset.\n- **Criticality:**  A measure of the potential impact or severity if an attack path is successfully exploited. Factors considered might include the sensitivity of the target asset, the vulnerabilities along the path, and the potential business impact.\n- **Threshold:** A predefined level of criticality above which an attack path is deemed critical. This threshold is typically set based on an organization's risk tolerance and security policies. \n"
                    - key: apa_asset_high_paths_count
                      readable_name: Number Of High Attack Paths
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: false
                      filterable: true
                      description: "# Number Of High Attack Paths\n## Number of attack paths with a high or critical AES\nThis metric, available in the context of an asset, represents the count of attack paths classified as either \"High\" or \"Critical\" based on their Asset Exposure Score (AES). An attack path outlines the potential steps a malicious actor could take to exploit vulnerabilities and compromise an asset. \n\nHere's a breakdown:\n- **Attack Path:** A sequence of steps an attacker might take to reach a specific target within a network.\n- **Asset Exposure Score (AES):** A score calculated by Cyber Asset Management, reflecting the severity of exposure an asset faces due to potential attack paths. A higher AES indicates a more significant risk.\n- **High/Critical AES:**  Attack paths categorized as \"High\" or \"Critical\" based on their AES, signifying a greater likelihood and potential impact of a successful attack. \n"
                    - key: apa_assets_medium_paths_count
                      readable_name: Number Of Medium Attack Paths
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: false
                      filterable: true
                      description: "# Number Of Medium Attack Paths\n## Number of attack paths with a Medium rating for a given asset.\nThis metric, available in Cyber Asset Management, represents the count of potential routes an attacker could take to compromise a specific asset, where each path is assigned a \"Medium\" severity level. \n\nHere's a breakdown:\n- **Attack Path:** A sequence of steps an attacker might take to reach a critical asset within a network.\n- **Medium Rating:** Indicates a moderate level of risk associated with the attack path. This means the path might not be trivial to exploit but is still feasible for attackers with moderate skills and resources. \n- **Asset:**  Refers to any valuable resource within your IT environment, such as a server, database, or application.\n\nUnderstanding the number of medium-rated attack paths helps organizations prioritize remediation efforts by focusing on assets with a significant number of potential attack vectors. \n"
                    - key: apa_asset_low_paths_count
                      readable_name: Number Of Low Attack Paths
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: false
                      filterable: true
                      description: "# Number Of Low Attack Paths\n## Number of easy ways to compromise an asset\nIt represents the number of attack paths leading to an asset that are classified as \"Low\" in terms of difficulty or complexity. An attack path is a sequence of steps an attacker might take to exploit vulnerabilities and gain unauthorized access to a system or data. \n\nHere's a breakdown:\n- **Asset:** Refers to any valuable resource within your IT environment, such as a server, database, application, or network device.\n- **Attack Path:** A chain of interconnected vulnerabilities and misconfigurations that an attacker can exploit to achieve their objective.\n- **Low Difficulty:** Indicates that the attack path is relatively easy to execute, requiring minimal skill or resources from the attacker.\n\nA high number of low attack paths for an asset signifies a higher risk, as it suggests multiple easy ways for attackers to compromise that asset. Cyber Asset Management helps you identify and prioritize these attack paths, enabling you to strengthen your security posture and reduce your overall risk. \n"
                    - key: apa_asset_total_paths_count
                      readable_name: Total Number of Attack Paths
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: false
                      filterable: true
                      description: "# Total Number of Attack Paths\n## All attack paths leading to a specific asset\nThis metric, found in Cyber Asset Management, represents the total count of potential routes an attacker could exploit to gain unauthorized access to a particular asset within your IT environment. \n\nHere's a breakdown:\n\n- **Asset:**  Refers to any valuable resource within your organization's IT infrastructure, such as a server, database, application, or network device.\n- **Attack Path:** Represents a sequence of steps an attacker might take to move laterally through your network, exploiting vulnerabilities to reach their target asset. \n- **Importance:** A high number of attack paths for an asset indicates increased risk exposure. It suggests multiple avenues for compromise, demanding attention to security posture. \n"
                    - key: apa_critical_steps_count
                      readable_name: Number Of Critical Attack Techniques
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: false
                      filterable: true
                      description: "# Number Of Critical Attack Techniques\n## Number of MITRE ATT&CK techniques classified as \"Critical\" for an asset.\nThis metric, available in Cyber Asset Management, reflects how many MITRE ATT&CK techniques are deemed \"Critical\" for a specific asset. \n\nHere's a breakdown:\n- **MITRE ATT&CK**: A globally recognized framework that describes how adversaries attack and compromise systems. It categorizes these attacks into \"techniques.\"\n- **Critical**: A severity level within Cyber Asset Management, indicating a high potential impact on the asset's security.\n- **Asset**: Any device, application, user account, or other element within your IT environment.\n\nEssentially, this number helps you prioritize which assets are most vulnerable to potentially devastating attacks. \n"
                    - key: apa_high_steps_count
                      readable_name: Number Of High Attack Techniques
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: false
                      filterable: true
                      description: "# Number Of High Attack Techniques\n## Number of MITRE ATT&CK techniques classified as High for a given asset.\nThis metric, available in Cyber Asset Management, reflects the number of MITRE ATT&CK techniques, classified with a High severity level, that are applicable to a given asset. It provides insights into the potential attack paths that could be used against an asset based on its vulnerabilities. \nHere's a breakdown:\n- **MITRE ATT&CK**: A globally recognized framework that describes the tactics, techniques, and procedures (TTPs) used by adversaries in cyberattacks.\n- **Techniques**: Specific actions or methods used within an attack, categorized by MITRE ATT&CK into various tactics (e.g., initial access, lateral movement).\n- **High Severity**: Indicates techniques that pose a significant risk to an organization if successfully exploited.\nYou can use this metric in Cyber Asset Management to identify assets that are most susceptible to known attack techniques and prioritize remediation efforts accordingly. For example, you could use a query like this:\n```\nHAS AS Device\n    AND Number Of High Attack Techniques > 5\n```\nThis query would return a list of devices that have more than five associated MITRE ATT&CK techniques classified as High. \n"
                    - key: apa_medium_steps_count
                      readable_name: Number Of Medium Attack Techniques
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: false
                      filterable: true
                      description: "# Number Of Medium Attack Techniques\n## Number of MITRE ATT&CK techniques classified as \"Medium\" impacting an asset.\nThis metric, found in Cyber Asset Management, provides insights into the potential attack paths that could be used against a specific asset based on its vulnerabilities. Here's a breakdown:\n\n- **MITRE ATT&CK Framework:** A globally recognized knowledge base of adversary tactics and techniques based on real-world observations. It helps organizations understand how attackers operate and provides a common language for cybersecurity discussions.\n- **Attack Techniques:** Specific procedures or methods used by attackers to achieve their objectives within a broader attack strategy.\n- **Medium Classification:** Indicates the potential severity of an attack technique. In this context, \"Medium\" suggests techniques that could pose a moderate risk to the asset if exploited.\n- **Asset-Specific Context:** The number displayed represents the sum of all MITRE ATT&CK techniques classified as \"Medium\" associated with the vulnerabilities identified on that particular asset. \n"
                    - key: assets_apa_low_step_count
                      readable_name: Number Of Low Attack Techniques
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: false
                      filterable: true
                      description: "# Number Of Low Attack Techniques\n## Number of low techniques to exploit a vulnerability\nThis metric, available in Cyber Asset Management, represents the number of techniques with a low attack complexity that can be used to exploit a vulnerability. It provides insights into the ease with which an attacker could potentially exploit a given weakness. \n\nHere's a breakdown:\n- **Low Attack Complexity**: Refers to techniques that are relatively easy for attackers to execute, often requiring minimal resources, skills, or time.\n- **Exploitation**: The act of taking advantage of a vulnerability to gain unauthorized access, control, or data from a system or network.\n- **Contextual Awareness**: Understanding the number of low attack techniques associated with assets helps prioritize remediation efforts based on the potential ease of exploitation. \n"
                    - key: apa_total_steps_count
                      readable_name: Total Number of Attack Techniques
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: false
                      filterable: true
                      description: "# Total Number of Attack Techniques\n## The sum of all attack techniques that can exploit the vulnerabilities of an asset.\nThis metric, viewable from the asset details page, provides a measurement of the potential attack surface associated with a particular asset. It considers the known vulnerabilities present on the asset and maps them to the corresponding attack techniques that could be used to exploit those vulnerabilities. \n\nHere's a breakdown:\n\n- **Asset Focus:** The metric specifically focuses on individual assets within your IT environment.\n- **Vulnerability Assessment:** It relies on vulnerability assessment data to identify weaknesses present on the asset.\n- **Attack Technique Mapping:**  Each vulnerability is associated with specific attack techniques that adversaries could leverage.\n- **Cumulative Count:** The metric sums up all the unique attack techniques linked to the vulnerabilities found on the asset.\n- **Risk Indicator:** A higher number of attack techniques suggests a broader attack surface and potentially higher risk associated with that asset. \n"
