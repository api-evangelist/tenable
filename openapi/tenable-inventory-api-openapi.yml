  /api/v1/t1/inventory/software/properties:
    get:
      summary: List software properties
      description: "Returns a list of software properties that can be used for filters on endpoints that support them. For example, the properties that are returned by this endpoint can be used as filters for the [Search software](ref:inventory-software-search) endpoint.\n\n  In addition to the software properties, the results list includes the logical operators you can use with the tag properties along with the supported values.\n\n**Caution:** This endpoint is available for use but is currently in beta. The response structure is subject to change as we continue to enhance the data model. <div class=\"perms-callout\">Requires the Basic [16] user role or the `ASSET_INVENTORY.CYBER_ASSET_MANAGEMENT.READ` and `AD.TOGGLE_AD.USE` custom role privileges. See [Roles](doc:roles).</div>"
      operationId: inventory-software-properties-list
      tags:
      - Inventory
      responses:
        '200':
          description: Returned if the list of software properties was retrieved successfully.
          content:
            application/json:
              schema:
                description: A list of software properties.
                type: object
                properties:
                  properties:
                    type: array
                    items:
                      $ref: '#/components/schemas/Inventory_Properties-Object'
              examples:
                response:
                  value:
                    data:
                    - key: cpe
                      readable_name: Common Platform Enumeration
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: cpe:2.3:o:microsoft:windows_7:-:sp2:*:*:*:*:*:*
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: '# Common Platform Enumeration

                        ## A software inventory technique


                        Common Platform Enumeration (CPE) is a software inventory technique that identifies the software installed on a device. CPE uses a standardized format to identify software, which makes it easier to track and manage software assets.


                        Here are some key points to understand about CPE:

                        - **CPE is a standard format for identifying software**. The CPE format consists of a vendor name, product name, version, and edition. This makes it easy to identify software and track changes over time.

                        - **CPE can be used to identify both installed and uninstalled software**. This makes it a valuable tool for software inventory and asset management.

                        - **CPE can be used to generate reports on software usage**. This information can be used to make decisions about software licensing and usage.


                        ## Example:

                        ```

                        CPE:2.3:Microsoft:Windows_Server:2012_R2:SP1

                        ```


                        This CPE identifies Microsoft Windows Server 2012 R2 Service Pack 1.

                        '
                    - key: publisher
                      readable_name: Publisher (Original)
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: tenable
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
