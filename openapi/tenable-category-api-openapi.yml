openapi: 3.2.0
info:
  title: Identity Exposure Category API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Category
  description: A checker's category
paths:
  /api/categories:
    get:
      summary: Retrieve all category instances
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the get /category response
                type: array
                items:
                  description: Category
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - name
                  properties:
                    id:
                      type: number
                    name:
                      type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Category
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiCategories
      x-operation-id-source: derived
  /api/categories/{id}:
    get:
      summary: Get category instance by id
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Category
                type: object
                additionalProperties: false
                required:
                - id
                - name
                properties:
                  id:
                    type: number
                  name:
                    type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Category
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiCategoriesById
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKey:
      name: x-api-key
      description: The user's API key
      in: header
      type: apiKey
x-readme:
  explorer-enabled: true
  proxy-enabled: true
