components:
  schemas:
    Filter:
      type: object
      properties:
        name:
          type: string
          description: The field name to be used in request query strings when applying the filter.
        readable_name:
          type: string
          description: The filter's display label.
        operators:
          description: Strings which represent the comparison operations which can be used for the filter.
          type: array
          items:
            type: string
        control:
          type: object
          properties:
            type:
              type: string
              description: The type of UI control which represents the filter.
            regex:
              type: string
              description: A regex which can be used by a user interface to validate input.
            readable_regex:
              type: string
              description: Provides a human-readable "hint" which describes what the filter string should look like.
            max_length:
              type: integer
              description: The max length of the filter.
    filters_ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: The HTTP status code of the error.
        error:
          type: string
          description: The standard HTTP error name.
        message:
          type: string
          description: A brief message about the cause of the error.
    wildcard_fields:
      description: Array of strings which represent each field which supports "wildcard" search. Wildcard search is a mechanism where multiple fields of a record are filtered against one specific filter string. If any one of the supported fields' values matches against the filter string, then the record matches the wildcard filter. Note that for a record to be returned, it must pass the wildcard filter (if there is one) AND the set of standard filters.
      type: array
      items:
        type: string
    Filters:
      type: array
      description: A list of filters available for the record type.
      items:
        $ref: '#/components/schemas/Filter'
    ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: The HTTP status code of the error.
        error:
          type: string
          description: The standard HTTP error name.
        message:
          type: string
          description: A brief message about the cause of the error.
    filters_wildcard_fields:
      description: Array of strings which represent each field which supports "wildcard" search. Wildcard search is a mechanism where multiple fields of a record are filtered against one specific filter string. If any one of the supported fields' values matches against the filter string, then the record matches the wildcard filter. Note that for a record to be returned, it must pass the wildcard filter (if there is one) AND the set of standard filters.
      type: array
      items:
        type: string
    filters_sort:
      type: object
      description: The sorting parameters supported for data returned by the endpoint.
      properties:
        max_sort_fields:
          type: integer
          description: Maximum number of fields that may be specified for sorting. If this is parameter is not present, any number of fields may be used.
        sortable_fields:
          description: Fields by which the returned list of records may be sorted.
          type: array
          items:
            type: string
    filters_filter:
      type: object
      properties:
        name:
          type: string
          description: The field name to be used in request query strings when applying the filter.
        readable_name:
          type: string
          description: The filter's display label.
        operators:
          description: The comparison operators that can be applied to the filter.
          type: array
          items:
            type: string
        control:
          type: object
          properties:
            readable_regex:
              type: string
              description: Provides a human-readable "hint" which describes what the filter string should look like.
            type:
              type: string
              description: The type of UI control which represents the filter.
            regex:
              type: string
              description: A regex which can be used by a user interface to validate input.
        group_name:
          type: string
          description: Always set to `NULL`. Legacy attribute associated with deprecated functionality.
    filters_response-report-filters:
      type: object
      properties:
        name:
          type: string
          description: The field name to be used in request query strings when applying the filter.
        operators:
          description: The comparison operators that can be applied to the filter.
          type: array
          items:
            type: string
        type:
          description: Specifies the datatype of the values that can be used for the filter.
          type: string
        allowedValues:
          description: Some filters only allow a specific set of values. For these filters, the list of supported values is returned in this field.
          type: array
          items:
            type: string
    filters:
      type: array
      description: A list of filters available for the record type.
      items:
        $ref: '#/components/schemas/filter'
    filters_filters:
      type: array
      description: A list of filters available for the record type.
      items:
        $ref: '#/components/schemas/filters_filter'
    ErrorResponse_2:
      type: object
      required:
      - reasons
      description: Tenable Web App Scanning error response.
      properties:
        reasons:
          type: array
          description: A list of reasons for the Tenable Web App Scanning error.
          items:
            type: object
            description: A reason for the Tenable Web App Scanning error, including a code and an extended description.
            minItems: 1
            required:
            - code
            - reason
            properties:
              code:
                type: string
                description: "The Tenable Web App Scanning error code. Error code values include:\n - `NOT_FOUND`—Returned if Tenable Web App Scanning could not find the resource you specified.\n - `INVALID_ID_FORMAT`—Returned if you specify a resource ID in an invalid format.\n - `INVALID_PARAMETER`—Returned if you specify an invalid URL parameter.\n- `INVALID_JSON_BODY`—Returned if you specify invalid JSON in request payload.\n - `DUPLICATE_ENTITY`—Returned if you attempt to create a duplicate resource.\n - `NOT_ALLOWED`—Returned if Tenable Web App Scanning encounters a stateful conflict, for example, if you attempt to start a scan that is already in progress.\n - `OPERATION_FORBIDDEN`—Returned if you do not have sufficient permissions to access a resource or complete a task."
              reason:
                type: string
                description: The extended description of the cause of the Tenable Web App Scanning error.
    filter:
      type: object
      properties:
        name:
          type: string
          description: The field name to be used in request query strings when applying the filter.
        readable_name:
          type: string
          description: The filter's display label.
        operators:
          description: Strings which represent the comparison operations which can be used for the filter.
          type: array
          items:
            type: string
        control:
          type: object
          properties:
            readable_regex:
              type: string
              description: Provides a human-readable "hint" which describes what the filter string should look like.
            type:
              type: string
              description: The type of UI control which represents the filter.
            regex:
              type: string
              description: A regex which can be used by a user interface to validate input.
            max_length:
              type: integer
              description: The max length of the filter.
        group_name:
          type: string
          description: Always set to `NULL`. Legacy attribute associated with deprecated functionality.
