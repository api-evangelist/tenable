                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
      security:
      - Access_Control_Permissions_cloud: []
  /api/v3/access-control/permissions/users/me:
    get:
      summary: Get current user permissions
      description: 'Returns the permissions assigned to the current user.


        **Note:** The subjects in the response are redacted to return only the current user and the user groups the current user belongs to. The `permissions_available` array is always empty for this endpoint.<div class="perms-callout">Requires the Basic [16] user role. See [Roles](doc:roles).</div>'
      tags:
      - Access Control (Permissions)
      operationId: io-v3-access-control-permissions-current-user-list
      responses:
        '200':
          description: Returned if the permissions for the current user were retrieved successfully.
