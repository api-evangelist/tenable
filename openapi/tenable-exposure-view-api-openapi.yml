openapi: 3.0.0
info:
  version: 1.0.0
  title: Downloads About Exposure View API
  description: 'The Downloads API enables customers to access and download installation and update files for available Tenable products. You can use the API endpoints to list product pages, list downloads available for a specific product, and to download a file. The endpoints can also be used to determine and download the latest version of a file to facilitate the automation of an installation.


    **Note:** The Tenable Downloads API uses a different server URL than the Tenable Vulnerability Management API:


    `https://www.tenable.com/downloads/api/v2/pages`.


    ### Authentication


    Like the Downloads website, certain files require authentication to download. When files have a `"requires_auth": true` attribute on the product list page, the Downloads API uses bearer token authentication and requires a valid token in the Authorization header to download the file:

    ```

    Authorization: Bearer AbCdEf123456

    ```


    To access or reset your authentication token, navigate to the [Authentication Token](https://www.tenable.com/downloads/api-docs) page.


    Examples of product downloads that **do not** require authentication include Nessus and Nessus Agents.'
servers:
- url: https://www.tenable.com/downloads/api/v2
security:
- Bearer: []
tags:
- name: Exposure View
  description: The Tenable Exposure View API enables users to search Tenable Exposure view for their organization's cards or retrieve the details for a specified card. For more information about Exposure View, see [Exposure View](https://docs.tenable.com/exposure-management/Content/exposure-management/exposure-view/exposure-view.htm) in the _Tenable Exposure Management User Guide_.
  x-displayName: Exposure View
paths:
  /api/v1/t1/exposure-view/cards:
    get:
      summary: Search cards
      description: "Returns a list of exposure view cards based on your search criteria. \n\n**Caution:** This endpoint is available for use but is currently in beta. The response structure is subject to change as we continue to enhance the data model. <div class=\"perms-callout\">Requires the Basic [16] user role or the `TONE_UI.TONE_EXPOSURE_CARD.READ`, `LUMIN_EXPOSURE_VIEW.EXPOSURE_CARD.READ`, and `AD.TOGGLE_AD.USE` custom role privileges. See [Roles](doc:roles).</div>"
      operationId: exposure-view-cards-search
      tags:
      - Exposure View
      parameters:
      - name: is_global_card
        description: "Indicates whether or not to return Tenable-provided global cards or user-created custom cards. \n\nIf `true`, only Tenable-provided global cards are returned. If `false`, only user-created custom cards are returned. If this parameter is omitted, Tenable Exposure Management returns all cards."
        explode: true
        in: query
        required: false
        schema:
          type: boolean
        style: form
      - name: text_query
        description: Filters the results by card name.
        explode: true
        in: query
        required: false
        schema:
          type: string
        style: form
      - name: sorting_order
        description: The order to sort the results by, either ascending (`asc`) or descending (`desc`).
        explode: true
        in: query
        required: false
        schema:
          default: asc
          enum:
          - asc
          - desc
          type: string
        style: form
      - name: limit
        description: The number of card records to retrieve. The maximum value is `25`. If this parameter is omitted, Tenable Exposure Management uses the default value of `25`.
        explode: true
        in: query
        required: false
        schema:
          default: 25
          maximum: 25
          minimum: 1
          type: integer
        style: form
      - description: The starting record to retrieve. If this parameter is omitted, Tenable Exposure Management uses the default value of `0`.
        explode: true
        in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          type: integer
        style: form
