  /api/v1/t1/exposure-view/cards/{card_id}:
    get:
      summary: Get card details
      description: "Retrieves details for the specified exposure view card. By default, the response includes SLA efficiency and trend data for the past 30 days. You can modify the time frame using optional parameters. \n\n**Caution:** This endpoint is available for use but is currently in beta. The response structure is subject to change as we continue to enhance the data model. <div class=\"perms-callout\">Requires the Basic [16] user role or the `TONE_UI.TONE_EXPOSURE_CARD.READ`, `LUMIN_EXPOSURE_VIEW.EXPOSURE_CARD.READ` and `AD.TOGGLE_AD.USE` custom role privileges. See [Roles](doc:roles).</div>"
      operationId: exposure-view-card-details
      tags:
      - Exposure View
      parameters:
      - name: card_id
        description: The unique ID of the card to retrieve details for.
        explode: false
        in: path
        required: true
        schema:
          type: string
        style: simple
      - name: trend_start_date
        description: "The start date for trend data. Use this parameter in combination with the `trend_end_date` parameter to define the time frame for the trend data. \n\nThe date must be specified as a UTC timestamp in ISO 8601 format (e.g., `2025-06-28T00:00:00.000Z`)."
        explode: true
        in: query
        required: false
        schema:
          description: Start date for trend data in ISO 8601 format, UTC timezone
          format: date-time
          type: string
        style: form
      - name: trend_end_date
        description: "The end date for trend data. Use this parameter in combination with the `trend_start_date` parameter to define the time frame for the trend data. \n\nThe date must be specified as a UTC timestamp in ISO 8601 format (e.g., `2025-06-28T00:00:00.000Z`)."
        explode: true
        in: query
        required: false
        schema:
          description: End date for trend data in ISO 8601 format, UTC timezone
          format: date-time
          type: string
        style: form
      - name: sla_efficiency_start_date
        description: "The start date for SLA efficiency data. Use this parameter in combination with the `sla_efficiency_end_date` parameter to define the time frame for the SLA efficiency. \n\nThe date must be specified as a UTC timestamp in ISO 8601 format (e.g., `2025-06-28T00:00:00.000Z`)."
        explode: true
        in: query
        required: false
        schema:
          description: Start date for SLA efficiency data in ISO 8601 format, UTC timezone
          format: date-time
          type: string
        style: form
      - name: sla_efficiency_end_date
        description: "The end date for SLA efficiency data. Use this parameter in combination with the `sla_efficiency_start_date` parameter to define the time frame for the SLA efficiency. \n\nThe date must be specified as a UTC timestamp in ISO 8601 format (e.g., `2025-06-28T00:00:00.000Z`)."
        explode: true
        in: query
        required: false
        schema:
          description: End date for SLA efficiency data in ISO 8601 format, UTC timezone
          format: date-time
          type: string
        style: form
      - name: sla_breakdown_filter
        description: Filter SLA breakdown data by `REMEDIATED`, `NON_REMEDIATED`, or `ANY`.
        explode: true
        in: query
        required: false
        schema:
          default: ANY
          enum:
          - ANY
          - REMEDIATED
          - NON_REMEDIATED
          type: string
        style: form
      - name: include_trend_events
        description: Indicates whether or not to include trend events.
        explode: true
        in: query
        required: false
        schema:
          default: false
          type: boolean
        style: form
