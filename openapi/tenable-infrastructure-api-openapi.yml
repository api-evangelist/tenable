openapi: 3.2.0
info:
  title: Identity Exposure Infrastructure API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Infrastructure
  description: A groupment of directories
paths:
  /api/infrastructures:
    get:
      summary: Retrieve all infrastructure instances
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the GET /infrastructures response
                type: array
                items:
                  description: Infrastructure
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - name
                  - directories
                  - login
                  properties:
                    id:
                      type: integer
                      description: Unique numeric identifier of the infrastructure
                    name:
                      type: string
                      description: User-defined name of the infrastructure
                    login:
                      type: string
                      description: Username of the AD service account that Tenable.ad should use to connect to the infrastructure's directories
                    directories:
                      type: array
                      items:
                        type: number
                      description: Identifiers of the directories linked to the infrastructure
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Infrastructure
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiInfrastructures
      x-operation-id-source: derived
    post:
      summary: Create infrastructure instance
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the POST /infrastructures response
                type: array
                minItems: 1
                items:
                  description: Infrastructure
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - name
                  - directories
                  - login
                  properties:
                    id:
                      type: integer
                      description: Unique numeric identifier of the infrastructure
                    name:
                      type: string
                      description: User-defined name of the infrastructure
                    login:
                      type: string
                      description: Username of the AD service account that Tenable.ad should use to connect to the infrastructure's directories
                    directories:
                      type: array
                      items:
                        type: number
                      description: Identifiers of the directories linked to the infrastructure
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Infrastructure
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Validates the POST /infrastructures request
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                required:
                - name
                - login
                - password
                properties:
                  name:
                    type: string
                  login:
                    type: string
                  password:
                    type: string
                    x-secret: true
      operationId: postApiInfrastructures
      x-operation-id-source: derived
  /api/infrastructures/{id}:
    get:
      summary: Get infrastructure instance by id
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Infrastructure
                type: object
                additionalProperties: false
                required:
                - id
                - name
                - directories
                - login
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  login:
                    type: string
                  directories:
                    type: array
                    items:
                      type: number
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Infrastructure
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiInfrastructuresById
      x-operation-id-source: derived
    patch:
      summary: Update infrastructure instance
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Infrastructure
                type: object
                additionalProperties: false
                required:
                - id
                - name
                - login
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  login:
                    type: string
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Infrastructure
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Validates the PATCH /infrastructures/:id request
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                login:
                  type: string
                password:
                  type: string
                  x-secret: true
      operationId: patchApiInfrastructuresById
      x-operation-id-source: derived
    delete:
      summary: Delete infrastructure instance
      description: 'Required license type: ioa, ioaPreview, ioe'
      responses:
        '204':
          description: ''
          content:
            application/json:
              schema:
                description: Infrastructure
                additionalProperties: false
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Infrastructure
      x-tenablead-required-product-license-type:
      - ioa
      - ioaPreview
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: deleteApiInfrastructuresById
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKey:
      name: x-api-key
      description: The user's API key
      in: header
      type: apiKey
x-readme:
  explorer-enabled: true
  proxy-enabled: true
