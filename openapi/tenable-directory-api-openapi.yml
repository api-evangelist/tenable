                  name:
                    type: string
                  ip:
                    type: string
                  type:
                    type: string
                    enum:
                    - ADDS
                  ldapPort:
                    type: integer
                  globalCatalogPort:
                    type: integer
                  smbPort:
                    type: integer
                  dns:
                    type: string
                  sensitiveDataCollectionIsEnabled:
                    type: boolean
                  relayId:
                    oneOf:
                    - type:
                      - integer
                      - 'null'
      operationId: postApiDirectories
      x-operation-id-source: derived
