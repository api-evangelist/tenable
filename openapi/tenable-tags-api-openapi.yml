  /tags/values:
    post:
      summary: Create tag value
      description: Creates a tag value. The tag category can be specified by UUID or name. If Tenable Vulnerability Management cannot find a category you specify by name, the system creates a new category with the specified name. To automatically apply the tag to assets, specify the rules using the `filters` property.<div class="perms-callout">Requires the Scan Manager [40] user role. See [Roles](doc:roles).</div>
      operationId: tags-create-tag-value
      tags:
      - Tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category_name:
                  type: string
                  description: "The name of the tag category to associate with the new value.\n\nSpecify the name of a new category if you want to add both a <i>new</i> category and tag value.\n\nSpecify the name of an <i>existing</i> category if you want to add the tag value to the existing category.\n\nThe `category_name` can result in the following responses:\n\n - If the `category_name` you specify exists, and the tag value you specify already exists for that category, Tenable Vulnerability Management returns a 400 response code instead of adding the tag.\n\n - If the `category_name` you specify exists, but the tag value you specify does not yet exist for that category, Tenable Vulnerability Management adds the tag value to the existing category.\n\n - If the `category_name` you specify does not exist, Tenable Vulnerability Management creates a new tag category and adds the new tag value to that category.\n\nThis parameter is required if `category_uuid` is not present in the request message."
                category_uuid:
                  type: string
                  description: 'The unique identifier (UUID) of the tag category to associate with the new value. For more information on determining this value, see [Determine Tag Identifiers](doc:determine-tag-identifiers-tio).


                    Use this parameter only if you want to add the tag value to an existing category. If the UUID you specify does not exist, Tenable Vulnerability Management does not create a new catgory. Instead, it returns a 400 (Bad Request) response code.


                    This parameter is required if category_name is not present in the request message.'
                category_description:
                  type: string
                  description: The description for the new tag category that Tenable Vulnerability Management creates if the category specified by name does not exist. Otherwise, Tenable Vulnerability Management ignores the description.
                value:
                  type: string
                  description: The new tag value. Note that tag values cannot exceed 50 characters in length and must not contain commas.
                description:
                  type: string
                  description: The new tag value description.
                access_control:
                  $ref: '#/components/schemas/tags_AccessControl'
                filters:
                  type: object
                  description: The filters (conditional sets of rules) for automatically applying the tag to assets. For more information, see [Apply Dynamic Tags](doc:apply-dynamic-tags).
                  properties:
                    asset:
                      type: object
                      description: "The object containing conditional sets of rules for applying the tags. \n\n**Note:** Tenable Vulnerability Management supports a maximum of 40 rules per tag. This limit means that you can specify a maximum of 40 `and` or `or` conditions for a single tag value. Additionally, Tenable Vulnerability Management supports a maximum of 1,024 values in a comma-delimited string per individual tag rule. Note that the request body is limited to 1 MB. For more information about asset tags and their limitations, see [Manage Asset Tags](doc:manage-asset-tags-tio)."
                      properties:
                        and:
                          $ref: '#/components/schemas/tags_andConditions'
                        or:
                          $ref: '#/components/schemas/tags_orConditions'
              required:
              - value
            example:
              category_name: Location
              value: San Diego
              description: San Diego - WFH
              access_control:
                current_user_permissions:
                - ALL
                - CAN_EDIT
                - CAN_SET_PERMISSIONS
