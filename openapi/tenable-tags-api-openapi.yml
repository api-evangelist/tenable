components:
  responses:
    tags_400ListErrorResponse:
      description: "Returned if your request specifies invalid or malformed query parameters. Tenable Vulnerability Management can encounter the following error conditions:\n - `invalidvalue`—The query parameter format is incorrect, for example, uses an invalid operator as in this example: `f=name:invalid_operator:some_value`.\n- `unknownproperty`—The query parameter format is correct, but it references a field that does not exist, for example `sort=non_existing_property:desc`."
      content:
        application/json:
          examples:
            response:
              value:
                errors:
                - property: filter
                  rule: invalidvalue
                  message: '''Filter'' does not have a valid value'
                error: '''Filter'' does not have a valid value'
  schemas:
    tags_rule:
      type: object
      description: A rule for applying the tag to assets by matching asset properties or other tags. Includes a field or tag name, an operator, and a value.
      properties:
        property:
          type: string
          description: The asset attribute or tag to match. To find supported asset attributes, use the [List asset tag filters](ref:tags-list-asset-filters) endpoint.
        operator:
          type: string
          description: The operator to apply to the matched value, for example, equals, does not equal, or contains. To find supported operators for the associated asset attribute, use the [List asset tag filters](ref:tags-list-asset-filters) endpoint.
        value:
          description: "The asset attribute value or tag to match. For example, `192.0.2.57`. \n\nSelect **single string value** when you have a single input value, for example, a single IP address. Select **multiple string values** to use an array of strings when you have multiple input values, for example, when you have multiple IP addresses."
          oneOf:
          - title: Single String Value
            type: string
          - title: Multiple String Values
            type: array
            items:
              type: string
    tags_Response-List-Tag-Exclusions:
      type: object
      properties:
        value_uuid:
          description: 'The unique identifier (UUID) of the tag value.


            **Note:** A tag UUID is technically assigned to the tag value only (the second half of the category:value pair), but the API commands use this value to represent the whole `category:value` pair.'
          type: string
          format: uuid
        container_uuid:
          type: string
          format: uuid
          description: The unique identifier (UUID) of the customer container.
        asset_uuid:
          type: string
          format: uuid
          description: The unique identifier (UUID) of the asset for which the dynamic tag is excluded.
        ipv4:
          description: A list of IPv4 addresses associated with the asset.
          type: array
          items:
            type: string
        sources:
          type: array
          description: A list of sources that identified the asset.
          items:
            type: string
    Inventory_Request-Search-Tags:
      description: An object containing a query and/or filters to search for tags.
      type: object
      properties:
        query:
          type: object
          description: The search mode and query text.
          properties:
            mode:
              description: The mode to use for the query. Currently, the tag search only supports the `simple` mode.
              type: string
              default: simple
              enum:
              - simple
            text:
              description: 'The tag category or tag value to search for. This parameter value can be left empty to search all tags, for example `"text": ""`'
              type: string
              example: Microsoft
          required:
          - mode
          - text
        filters:
          description: "A set of tag properties used to filter the search results. \n\nUse the [List tag properties](ref:inventory-tag-properties-list) endpoint to view available tag properties that can be used as filters."
          type: array
          items:
            type: object
            required:
            - operator
            - property
            - value
            properties:
              property:
                description: "The tag property to filter on.\n\n Use the [List tag properties](ref:inventory-tag-properties-list) endpoint to retrieve a list of valid tag properties for filtering. For example, you might filter by `tag_data_source`, `last_updated`, or `tag_created_by_id`."
                type: string
              operator:
                type: string
                description: "The comparison operator to apply to the filter.\n\n For example: `=`, `!=`, `match`, etc. Use the [List tag properties](ref:inventory-tag-properties-list) endpoint to retrieve supported comparison operators for the selected filter."
                enum:
                - '='
                - '!='
                - <=
                - between
                - match
                - '>='
                - <
                - '>'
                - contains
                - not contains
                - exists
                - not exists
                - older than
                - newer than
                - within last
              value:
                description: "The value to use for comparison in the filter.\n\n Use the [List tag properties](ref:inventory-software-properties-list) endpoint to retrieve the supported values for the selected filter."
                type: array
                items:
                  type: string
    tags_filter:
      type: object
      description: A filter definition. Includes the field to be matched, the operators that you can use with the filter, and the rules for matching the values (`control` field), for example, a list of valid values.
      properties:
        name:
          type: string
          description: The name of the asset attribute or tag.
        readable_name:
          type: string
          description: The asset attribute name displayed in the user interface.
        control:
          type: object
          properties:
            readable_regex:
              type: string
              description: Provides a human-readable "hint" to guide users creating tag rules in the user interface.
            type:
              type: string
              description: The type of UI control that represents the filter in the user interface.
            regex:
              type: string
              description: A regular expression that Tenable Vulnerability Management user interface uses to validate input.
        operators:
          description: The comparison operators that can be used for the filter. To find supported operators, use the [GET /tags/assets/filters](ref:tags-list-asset-filters) endpoint.
          type: array
          items:
            type: string
    Inventory_Control:
      type: object
      properties:
        type:
          description: Indicates the data type of the property's value.
          type: string
          enum:
          - STRING
          - NUMBER
          - DATE
          - BOOLEAN
          - ARRAY
          - OBJECT
        multiple_allowed:
          description: Indicates whether or not the property can have multiple values.
          type: boolean
        selection:
          description: A list of possible values for the property if the property if multiple values are allowed.
          type: array
          items:
            type: object
            properties:
              name:
                description: The human-readable name of the value.
                type: string
              value:
                description: One possible value for the property.
                type: string
              deprecated:
                description: Indicates whether or not the value is deprecated.
                type: boolean
              third_party:
                description: Indicates whether or not the value is sourced from a third party.
                type: boolean
        regex:
          type: object
          properties:
            hint:
