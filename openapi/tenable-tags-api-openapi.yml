        name: ft
        in: query
        schema:
          type: string
      - description: "A comma-separated list of fields to include in the wildcard search. Provides the same functionality as a `match` condition in the `f` in parameter. For example, `f=value:match:Chi` returns the same results as `wf=value&w=Chi`. Wildcard fields include:  \n* category\\_name  \n* value  \n* description  \nUse the `w` parameter to specify the search value."
