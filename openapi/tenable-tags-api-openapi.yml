  /api/v1/t1/tags/properties:
    get:
      summary: List tag properties
      description: "Returns a list of tag properties that can be used for filters on endpoints that support them. For example, the properties that are returned by this endpoint can be used as filters for the [Search tags](ref:inventory-tag-search) endpoint.\n\n  In addition to the tag properties, the results list includes the logical operators you can use with the tag properties along with the supported values.\n\n**Caution:** This endpoint is available for use but is currently in beta. The response structure is subject to change as we continue to enhance the data model. <div class=\"perms-callout\">Requires the Basic [16] user role or the `ASSET_INVENTORY.CYBER_ASSET_MANAGEMENT.READ` and `AD.TOGGLE_AD.USE` custom role privileges. See [Roles](doc:roles).</div>"
      operationId: inventory-tag-properties-list
      tags:
      - Tags
      responses:
        '200':
          description: Returned if the list of tag properties was retrieved successfully.
          content:
            application/json:
              schema:
                description: A list of tag properties.
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Inventory_Properties-Object'
              examples:
                response:
                  value:
                    data:
                    - key: tag_id
                      readable_name: Tag ID
                      control:
                        type: STRING
                        multiple_allowed: true
                        regex:
                          hint: 01234567-abcd-ef01-2345-6789abcdef01
                          expression: '[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12}(,[0-9a-f]{8}-([0-9a-f]{4}-){3}[0-9a-f]{12})*'
                      operators:
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Tag ID \n\n## A way to group assets\n\nIn Tenable Exposure Management, a Tag ID is a unique identifier associated with a Tag. Tags are user-defined labels or markers applied to assets to categorize and organize them based on specific criteria, such as function, location, department, or risk level. \n\nHere's how Tag IDs are used:\n\n- **Grouping and Filtering:** Tag IDs enable you to easily group and filter assets based on shared characteristics. For example, you could use a Tag ID for \"High Risk\" to quickly identify all assets tagged with that specific risk level.\n- **Automation and Reporting:** Tag IDs can be used in automated workflows and reporting to streamline asset management tasks. You can generate reports on assets with specific Tag IDs to gain insights into their security posture or compliance status.\n- **Dynamic Grouping:** Tags and their associated IDs provide a flexible way to group assets dynamically. As asset attributes or risk profiles change, you can easily update their tags to reflect their current status. \n"
                    - key: tag_data_source
                      readable_name: Tag Data Source
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Tag Data Source \n## Where the tag information comes from\nTag data sources represent the origin or method by which tags are applied to assets within Tenable Exposure Management. Understanding the source of your tags is crucial for managing and interpreting tag information effectively.\n\nHere's a breakdown of tag data sources:\n\n- **Manual**: Tags added manually by users through the Tenable Exposure Management interface. This allows for flexible and customized tagging based on specific needs.\n- **Integration**: Tags automatically applied based on data fetched from integrated external systems. This ensures consistency and reduces manual effort.\n- **Rule**: Tags dynamically assigned based on predefined rules and conditions within Tenable Exposure Management. This enables automated tagging based on asset attributes or behaviors.\n- **Bulk**: Tags applied in bulk to multiple assets simultaneously, often using CSV imports or API calls. This streamlines tagging for large numbers of assets. \n"
                    - key: last_updated
                      readable_name: Last Updated
                      control:
                        type: DATE
                        multiple_allowed: false
                        regex:
                          hint: timestamp
                          expression: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                      operators:
                      - '='
                      - '>'
                      - <
                      - between
                      - exists
                      - not exists
                      - older than
                      - newer than
                      - within last
                      sortable: true
                      filterable: true
                      description: "# Last Updated \n\n## Date of the last tag modification\n\nThe \"Last Updated\" field in Tenable Exposure Management refers to the date and time when a specific tag associated with an asset was last modified. This timestamp helps track the recency of tag-related changes and provides insights into the asset's tagging history.\n\nHere's a breakdown of its significance:\n\n- **Tracking Tag Changes**: It allows administrators to see when a particular tag was added, removed, or modified for an asset.\n- **Auditing and Compliance**: Helps in maintaining an audit trail of tag-related activities, which can be crucial for compliance reporting.\n- **Asset Management**: Provides context about the asset's categorization and management over time. \n- **Filtering and Reporting**: Enables users to filter assets based on the last updated date of specific tags, aiding in identifying recently tagged or untagged assets. \n"
                    - key: tag_name
                      readable_name: Tag Name
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Tag Name \n## A label assigned to assets for categorization\nTag Name allows users to categorize and group assets based on specific criteria, such as department, location, sensitivity of data stored, or compliance requirements.\n\nHere are some key points to understand about Tag Name in the context of Cyber Asset Management:\n\n- **Organization and Filtering**: Tag Name enables efficient organization and filtering of assets within Tenable Exposure Management, making it easier to locate and manage specific groups of assets.\n- **Contextual Information**: Tags provide valuable contextual information about assets, aiding in risk assessment, vulnerability management, and incident response efforts.\n- **Automation and Reporting**: Tags can be used to automate tasks, such as applying security policies or generating reports based on specific asset groups.\n- **Flexibility and Customization**: Tenable Exposure Management allows users to create and assign custom tags based on their organization's specific needs and terminology.\n- **Improved Asset Visibility**: By using meaningful Tag Names, organizations can gain a clearer understanding of their asset inventory and potential security risks.\n"
                    - key: tag_description
                      readable_name: Tag Description
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Tag Description \n\n## A text used to categorize Assets\n\nA tag description provides additional context and information about a specific tag used for categorizing and organizing assets within Tenable Exposure Management. It helps users understand the purpose and meaning of the tag, making it easier to search, filter, and manage assets effectively.\n\nHere are some key points to understand about tag descriptions:\n\n- **Clarity and Conciseness**: Tag descriptions should be clear, concise, and easy to understand, providing a brief explanation of the tag's purpose.\n- **Relevance**: The description should accurately reflect the tag's intended use and the types of assets it's associated with.\n- **Contextual Information**: It can include details about the tag's scope, criteria for applying the tag, or any specific conventions used.\n- **Examples**: Providing examples of assets or asset attributes that would typically receive the tag can be helpful for users. \n"
                    - key: product
                      readable_name: Product
                      control:
                        type: STRING
                        multiple_allowed: true
                        selection:
                        - name: TENABLE_AI
                          value: TENABLE_AI
                          deprecated: false
                        - name: TENABLE_IO
                          value: TENABLE_IO
                          deprecated: false
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Product \n## A way to group assets by software\nIn Tenable Exposure Management, a Tag is a way to categorize and group assets based on shared characteristics. One type of tag is a \"Product,\" which allows you to associate assets with specific software products installed on them. \n\nHere's how it works:\n\n- **Tagging Assets:** When you discover assets in your environment, Cyber Asset Management automatically identifies the software installed on them. You can then create \"Product\" tags and assign them to assets based on the detected software.\n- **Grouping and Filtering:** Once tagged, you can easily group and filter assets based on the software products they have in common. For example, you can create a group of all assets with a specific version of a software product to identify potential vulnerabilities.\n- **Streamlining Management:** By using \"Product\" tags, you can streamline asset management tasks, such as vulnerability remediation, patch management, and software inventory. \n"
                    - key: tag_type
                      readable_name: Tag Type
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Tag Type \n\n## A label category for assets\n\nA tag type is a user-defined category or classification that helps organize and group tags within Cyber Asset Management. It provides a structured way to manage and apply tags to assets, making it easier to search, filter, and analyze asset data based on specific criteria.\n\nHere are some key points to understand about tag types:\n\n- **Organization**: Tag types bring order to your tags, preventing a chaotic and unmanageable collection.\n- **Standardization**: They enforce consistency in tagging, ensuring that similar assets are tagged uniformly.\n- **Filtering and Reporting**: Tag types simplify asset searching and filtering, allowing you to quickly locate assets with specific tags.\n- **Automation**: Tag types can be used to automate tagging processes, such as automatically applying tags based on asset attributes or events.\n- **Examples**: Common tag types include \"Environment\" (e.g., Production, Development, Testing), \"Location\" (e.g., New York, London, Tokyo), \"Department\" (e.g., Finance, Marketing, IT), and \"Compliance\" (e.g., PCI DSS, HIPAA, GDPR).\n"
                    - key: tag_category_id
                      readable_name: Tag Category ID
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Tag Category ID \n\n## A unique identifier for a group of tags.\n\nIn Tenable Exposure Management, tags are used to categorize and organize assets based on various criteria, such as function, location, or sensitivity. To manage tags effectively, they are grouped into categories. Each tag category is assigned a unique ID, known as the Tag Category ID. This ID helps in filtering and searching for assets based on specific tag categories.\n\nHere's a breakdown:\n\n- **Tag:** A label assigned to assets to categorize them based on specific criteria.\n- **Tag Category:** A group of related tags that share a common theme or purpose.\n- **Tag Category ID:** A unique identifier assigned to each tag category for efficient management and filtering. \n"
                    - key: tag_category_name
                      readable_name: Tag Category Name
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Tag Category Name \n\n## A way to organize tags\n\nIn Cyber Asset Management, a tag category serves as a container or grouping mechanism for individual tags. It helps in organizing and managing tags effectively, making it easier to apply and search for assets based on specific criteria. \n\nHere's a breakdown:\n\n- **Organization:** Tag categories bring structure to your tags, preventing a chaotic list of unrelated terms.\n- **Filtering and Searching:** They streamline the process of finding assets with specific characteristics. For instance, a \"Compliance\" category might contain tags like \"GDPR,\" \"HIPAA,\" or \"PCI DSS.\"\n- **Standardization:**  Tag categories promote consistency in tagging practices across your organization. \n"
                    - key: tag_category_description
                      readable_name: Tag Category Description
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Tag Category Description \n\n## A way to group tags in Cyber Asset Management\nTag Category Description allows users to provide a more detailed explanation or context for a specific tag category. This description helps users understand the purpose and usage of tags within that category, ensuring consistency and clarity in tag organization.\n\nHere's how Tag Category Description enhances tag management:\n\n- **Context and Purpose:** Provides a clear understanding of what the tag category represents and how it should be used.\n- **Consistency and Standardization:**  Promotes uniformity in tag naming conventions and usage across the organization.\n- **Improved Searchability:** Enables users to easily find and apply relevant tags by providing descriptive information about each category.\n- **Enhanced Reporting and Analysis:** Allows for more meaningful reporting and analysis by grouping tags into logical categories. \n"
                    - key: tag_created_by_id
                      readable_name: Tag Created By ID
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Tag Created By ID \n## The Entra ID of the user who created the tag in Tenable Exposure Management\nThis ID is a unique identifier associated with a user in your Entra ID.  It helps track who created specific tags within Cyber Asset Management, providing an audit trail for tag management. This information can be useful for:\n- **Accountability**: Knowing who created a tag can be helpful for accountability purposes, especially if a tag is used incorrectly or needs to be modified.\n- **Troubleshooting**: If there are any issues with a tag, knowing who created it can help in troubleshooting and resolving the problem.\n- **Tag Management**: Understanding tag usage patterns based on the creator can provide insights into how tags are being used and managed within the organization. \n"
                    - key: tag_updated_by_id
                      readable_name: Tag Updated By ID
                      control:
                        type: STRING
                        multiple_allowed: false
                        regex:
                          hint: ''
                          expression: .*
                      operators:
                      - contains
                      - not contains
                      - '='
                      - '!='
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Tag Updated By ID \n## The Entra ID of the user who last updated the tag\nThis attribute identifies the specific user in your organization's Entra ID system who made the most recent changes to a particular tag within the Tenable Exposure Management application. \n\nHere's a breakdown:\n\n- **Entra ID Integration:** Tenable Exposure Management integrates with your organization's Entra ID system to manage user accounts and permissions.\n- **Tracking Tag Modifications:**  Every time a tag is created, modified, or deleted, the system records the Entra ID of the user responsible for the action.\n- **Auditing and Accountability:** This information is crucial for auditing purposes, allowing administrators to track who made what changes to tags over time. It helps ensure accountability and facilitates investigations in case of unauthorized or accidental modifications. \n"
                    - key: tag_created_at
                      readable_name: Tag Created At
                      control:
                        type: DATE
                        multiple_allowed: false
                        regex:
                          hint: timestamp
                          expression: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
                      operators:
                      - '='
                      - '>'
                      - <
                      - between
                      - exists
                      - not exists
                      - older than
                      - newer than
                      - within last
                      sortable: true
                      filterable: true
                      description: "# Tag Created At \n## Date and time a tag was created\nThis field represents the specific date and time when a particular tag was created within the Tenable Exposure Management application. It provides a timestamp indicating the moment the tag was initially defined and added to the system. \n\nHere's why this information is valuable:\n- **Tracking Tag Usage:**  Understand when tags were introduced, potentially correlating them with specific projects, initiatives, or changes in asset management practices.\n- **Identifying Stale Tags:**  Tags created long ago but rarely used might indicate outdated categorization or an opportunity for cleanup.\n- **Auditing and Reporting:**  Provide an audit trail of tag creation, aiding in compliance efforts or investigations related to asset classification. \n"
                    - key: asset_count
                      readable_name: Asset Count
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Asset Count \n\n## Number of assets associated with a specific tag.\n\nThis metric provides a count of assets grouped by tags within your IT environment. Tags are user-defined labels assigned to assets for categorization and easier management. \n\nHere's a breakdown:\n\n- **Asset**: Any resource or component within your IT infrastructure, such as devices, users, or applications.\n- **Tag**: A descriptive label assigned to assets, allowing for logical grouping and filtering.\n- **Count**: The total number of assets associated with a particular tag.\n\nFor example, you might have a tag named \"Production\" assigned to all assets critical for your production environment. The \"Asset Count\" metric for the \"Production\" tag would then display the total number of assets crucial for your production operations. This information is valuable for understanding the scale and distribution of assets based on your defined classifications. \n"
                    - key: critical_weakness_count
                      readable_name: Critical Weakness Count
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Critical Weakness Count \n\n## Number of critical weaknesses for a given tag.\n\nThis metric, viewable in the **Explore** view of **Cyber Asset Management**, counts the number of critical weaknesses associated with assets grouped by a specific tag.  The higher the count, the greater the potential risk posed by those assets. Here's a breakdown:\n\n- **Critical Weakness:** A security vulnerability classified as highly severe, potentially allowing attackers to gain unauthorized access, disrupt operations, or steal data.\n- **Tag:** A label assigned to assets in Tenable Exposure Management for categorization and easier management. Tags help group assets with similar characteristics or purposes.\n- **Explore View:** A feature in Tenable Exposure Management that provides insights into asset vulnerabilities and overall security posture. It allows users to analyze data, identify trends, and prioritize remediation efforts. \n"
                    - key: high_weakness_count
                      readable_name: High Weakness Count
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# High Weakness Count \n\n## A way to filter assets with a specific tag and a high number of weaknesses.\n\nThis filter allows users to identify and focus on assets that have a specific tag applied to them and also exhibit a high number of identified weaknesses. This is useful for prioritizing remediation efforts on assets that may pose a higher risk due to the combination of their tag and weakness count.\n\nHere's a breakdown:\n\n- **Tag:** Tags are user-defined labels or categories assigned to assets in Tenable Exposure Management for better organization, grouping, and filtering.\n- **Weakness Count:** This refers to the total number of vulnerabilities or security weaknesses discovered on an asset through vulnerability assessments.\n- **High Weakness Count:**  This implies a threshold set by the user to define what constitutes a \"high\" number of weaknesses. This threshold can vary based on organizational risk tolerance and security policies.\n- **Example:** A user could use this filter to find all assets tagged as \"Critical Servers\" that have a weakness count greater than 50 (`HAS Tag = Critical Servers AND HAS Weakness Count > 50`). \n"
                    - key: medium_weakness_count
                      readable_name: Medium Weakness Count
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Medium Weakness Count \n## Number of vulnerabilities with medium severity for a specific tag.\nThis metric, available in Tenable Exposure Management, represents the aggregation of vulnerabilities classified as having a \"Medium\" severity level associated with assets grouped by a specific tag. In essence, it helps to quickly understand the concentration of potential security gaps within a particular category or grouping of assets defined by the tag. \n\nHere's a breakdown:\n\n- **Tag:** A user-defined label or category assigned to assets in Tenable Exposure Management for organizational and reporting purposes. \n- **Medium Severity:** A classification of vulnerabilities that present a moderate risk to your environment. These vulnerabilities might not be actively exploited but still require attention and remediation.\n- **Count:** The total number of vulnerabilities matching the specified criteria (medium severity and associated with the chosen tag). \n"
                    - key: low_weakness_count
                      readable_name: Low Weakness Count
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Low Weakness Count \n\n## A tag with less than 10 weaknesses\n\nThis filter allows users to identify and focus on assets tagged with specific tags that have a relatively low number of identified weaknesses. This can be useful for prioritizing remediation efforts on assets that may be considered lower risk due to their lower weakness count.\n\nHere's how it works:\n\n- **HAS Tag**: This part of the filter specifies that the asset must have at least one tag associated with it.\n- **AS Weakness Count**: This part of the filter focuses on the number of weaknesses associated with the specified tag.\n- **< 10**: This part of the filter sets a threshold, indicating that only assets with fewer than 10 weaknesses associated with the specified tag will be included in the results. \n"
                    - key: info_weakness_count
                      readable_name: Info Weakness Count
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Info Weakness Count \n## Number of informational weaknesses for a defined tag.\nThis metric, available in the context of Tenable Exposure Management, provides insights into the number of informational weaknesses associated with assets grouped by a specific tag. In essence, it helps you understand how many informational vulnerabilities exist within a defined subset of your IT environment.\n\nHere's a breakdown:\n\n- **Informational Weakness:** A type of vulnerability that doesn't directly lead to system compromise but highlights potential security risks or misconfigurations that could be exploited if combined with other vulnerabilities.\n- **Tag:**  A label assigned to assets in Tenable Exposure Management, allowing for logical grouping and categorization based on criteria like department, location, or asset type.\n- **Use Case:** This metric helps prioritize remediation efforts by identifying tags associated with a high number of informational weaknesses, indicating areas needing attention to improve overall security posture. \n"
                    - key: total_weakness_count
                      readable_name: Total Weakness Count
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# Total Weakness Count \n\n## Number of weaknesses for a given tag\n\nThis metric represents the sum of weaknesses associated with assets grouped under a specific tag within Tenable Exposure Management. Tags are user-defined labels that help categorize and manage assets based on criteria such as department, location, or risk level. \n\nHere's a breakdown:\n\n- **Asset Grouping:** Tags allow you to create logical groups of assets based on shared characteristics.\n- **Weakness Association:**  Tenable Exposure Management identifies and associates vulnerabilities, misconfigurations, and other security weaknesses with individual assets.\n- **Aggregation:** The \"Total Weakness Count \" metric adds up all the weaknesses found across all assets assigned to a particular tag. \n- **Risk Insight:** This metric provides a consolidated view of risk exposure for a group of assets, enabling targeted remediation efforts. \n"
                    - key: aes_average
                      readable_name: AES Average
                      control:
                        type: NUMBER
                        multiple_allowed: false
                        regex:
                          hint: number >= 0
                          expression: ^\d+$
                      operators:
                      - '='
                      - '>='
                      - '>'
                      - <=
                      - <
                      - exists
                      - not exists
                      sortable: true
                      filterable: true
                      description: "# AES Average\n## The average of all Asset Exposure Scores\nThe average AES represents the average level of cyber risk across all assets within an organization, providing a high-level view of the overall security posture.\n\nHere's a breakdown:\n- **Calculation**:  The AES Average is determined by summing the AES values of all assets and dividing by the total number of assets.\n- **Range**: AES values typically range from 0 to 100, with higher scores indicating greater exposure and potential risk.\n- **Context**:  A high average AES suggests that the organization faces a significant overall cyber risk, while a low average indicates a relatively lower risk posture.\n- **Use in Tenable Exposure Management**: You can use the AES Average to track changes in your organization's overall security posture over time and identify trends in asset exposure. For example, a sudden increase in the average AES might indicate a new vulnerability or a successful attack. \n"
        '400':
          description: Returned if your request specified invalid parameters or if your request was improperly formatted.
        '401':
          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory_ErrorResponse'
              examples:
                response:
                  value:
                    error: Unauthorized
                    message: Invalid credentials.
        '403':
          description: Returned if you do not have permission to view the list of tag properties.
        '429':
          description: Returned if you attempt to send too many requests in a specific period of time. For more information, see [Rate Limiting](doc:rate-limiting).
          content:
            text/html:
              examples:
                response:
                  value: "<html>\n\n<head>\n    <title>429 Too Many Requests</title>\n</head>\n\n<body bgcolor=\"white\">\n    <center>\n        <h1>429 Too Many Requests</h1>\n    </center>\n    <hr>\n    <center>nginx</center>\n</body>\n\n</html>"
        '500':
          description: Returned if an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Inventory_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
      security:
      - Inventory_cloud: []
