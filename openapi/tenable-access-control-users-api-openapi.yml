components:
  schemas:
    Access_Control_Users_ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: The HTTP status code of the error.
        error:
          type: integer
          description: The standard HTTP error name.
        message:
          type: string
          description: A brief message about the cause of the error.
    Access_Control_Users_keys:
      type: object
      properties:
        accessKey:
          type: string
          description: The access key for the user account in Tenable Vulnerability Management. Use this key in combination with the user's secret key to submit authorized API requests to Tenable Vulnerability Management.
        secretKey:
          type: string
          description: The secret key for the user account in Tenable Vulnerability Management. Use this key in combination with the user's access key to submit authorized API requests to Tenable Vulnerability Management.
    Access_Control_Users_authorizations_update:
      type: object
      description: An object specifying the authorization settings to apply to the user. Set each property to `true` to grant the authorization or `false` to revoke it.
      properties:
        api_permitted:
          type: boolean
          description: Specifies whether API key authentication is authorized for the user.
        password_permitted:
          type: boolean
          description: Specifies whether username and password login is authorized for the user.
        saml_permitted:
          type: boolean
          description: Specifies whether SSO with SAML is authorized for the user.
        mfa_enrollment_required:
          type: boolean
          description: Specifies whether two-factor authentication enrollment is required for the user.
      required:
      - api_permitted
      - password_permitted
      - saml_permitted
    Access_Control_Users_users:
      type: array
      description: An array of user objects.
      items:
        $ref: '#/components/schemas/Access_Control_Users_user-object'
    Access_Control_Users_Object-User-Role:
      type: object
      properties:
        container_uuid:
          description: The UUID of the container in which the user's account is located.
          type: string
          format: uuid
        user_uuid:
          description: The UUID of the user.
          type: string
          format: uuid
        role_uuids:
          description: The UUID of the role assigned to the user.
          type: array
          items:
            type: string
    Access_Control_Users_ErrorResponse-Error:
      type: object
      properties:
        error:
          type: string
          description: A brief description of the error.
    Access_Control_Users_authorizations:
      type: object
      properties:
        account_uuid:
          type: string
          description: The UUID of the container.
          format: uuid
        user_uuid:
          type: string
          description: The UUID of the user.
          format: uuid
        api_permitted:
          type: boolean
          description: Indicates whether API access is authorized for the user.
        password_permitted:
          type: boolean
          description: Indicates whether user name and password login is authorized for the user.
        saml_permitted:
          type: boolean
          description: Indicates whether SSO with SAML is authorized for the user.
    Access_Control_Users_user-object:
      type: object
      properties:
        uuid:
          type: string
          description: The UUID of the user.
        id:
          type: integer
          description: The unique ID of the user.
        user_name:
          type: string
          description: The username for the user.
        username:
          type: string
          description: The username for the user.
        email:
          type: string
          description: The email address of the user. If this attribute is empty, Tenable Vulnerability Management uses the `username` value as the user's email address.
        name:
          type: string
          description: The name of the user (for example, first and last name).
        type:
          type: string
          description: The type of user. The only supported type is `local`.
        permissions:
          type: integer
          description: The user permissions as described in [Permissions](doc:permissions).
          format: int32
        rbac_roles:
          type: array
          description: The role-based access control (RBAC) roles assigned to the user. This property is only present in the response when the `withRoles` query parameter is set to `true`. For more information, see [Roles](doc:roles).
          items:
            type: object
            properties:
              name:
                type: string
                description: The name of the role assigned to the user.
              uuid:
                type: string
                format: uuid
                description: The unique identifier (UUID) of the role assigned to the user.
        ui_permitted:
          type: boolean
          description: Indicates whether the user is permitted to log in to the Tenable Vulnerability Management user interface.
        ui_saml_only:
          type: boolean
          description: Indicates whether the user is restricted to SAML-based authentication for user interface access (`true`) or can use other authentication methods (`false`).
        api_permitted:
          type: boolean
          description: Indicates whether the user is permitted to authenticate using API keys.
        last_login_attempt:
          type: integer
          description: A timestamp in Unix milliseconds indicating the last time the user failed to log in to the Tenable Vulnerability Management user interface. This attribute is only present if the user has attempted unsuccessfully to log in at least once.
        login_fail_count:
          type: integer
          description: "The number of failed login attempts since the user last successfully logged in to the Tenable Vulnerability Management user interface. \n\nIf this attribute is greater than 5, Tenable Vulnerability Management locks the user account (that is, updates the `lockout` attribute for the user to `1`.)\n\nYou can reset this count to `0` by [changing the user's password](ref:users-password) or [generating the user's API keys](ref:users-keys)."
        login_fail_total:
          type: integer
          description: The total number of failed login attempts for the user.
        last_apikey_access:
          type: integer
          description: A timestamp in Unix milliseconds indicating the last time the user authenticated using API keys. This property is only present if the user has made at least one API key-authenticated request.
        enabled:
          type: boolean
          description: Specifies whether the user account is enabled (`true`) or disabled (`false`).
        undeletable:
          type: boolean
          description: Specifies whether the user account is undeletable (`true`) or deletable (`false`).
        two_factor:
          description: An object containing the user's two-factor authentication settings. This property is only present if the user has two-factor authentication configured.
          $ref: '#/components/schemas/Access_Control_Users_TwoFactor'
        group_uuids:
          type: array
          description: The unique identifiers (UUIDs) of the user groups to which the user belongs.
          items:
            type: string
            format: uuid
        lockout:
          type: integer
          description: 'Specifies whether the user can log into the Tenable Vulnerability Management user interface (`0`) or is locked out (`1`).


            Tenable Vulnerability Management automatically updates this attribute to `1` if the `login_fail_count` attribute for the user is greater than 5. To unlock a user account, reset the user''s password using the [PUT /users/{user_id}/chpasswd](ref:users-password) endpoint.


            **Note:** A user can be locked out of the user interface but still submit API requests if they are assigned the appropriate authorizations (`api_permitted`). To prevent a user from submitting API requests, limit authorizations using the [PUT /users/{user_id}/authorizations](ref:users-update-auths) endpoint, or disable the user entirely using the [PUT /users/{user_id}/enabled](ref:users-enabled) endpoint.'
        container_uuid:
          type: string
          description: The UUID of the Tenable Vulnerability Management instance to which the user belongs.
        lastlogin:
          type: integer
          description: A timestamp in Unix milliseconds indicating the last time the user successfully logged in to the Tenable Vulnerability Management user interface. This attribute is only present if the user has logged in successfully at least once.
        preferences:
          type: object
          description: An object containing the user's saved UI preferences for the Tenable Vulnerability Management interface, such as enabled features and column visibility settings. The properties of this object vary based on the user's configuration.
          additionalProperties:
            type: string
        uuid_id:
          type: string
          description: The UUID for the user.
    Access_Control_Users_TwoFactor:
      type: object
      properties:
        sms_phone:
          type: string
          description: The phone number used for two-factor authentication. The phone number begins with the `+` character and the country code. This field is required when sms_enabled is set to `true`.
        sms_enabled:
          type: integer
          description: Indicates whether two-factor authentication is enabled (`1`) or disabled (`0`).
        email_enabled:
          type: integer
          description: Indicates whether backup notification for two-factor authentication is enabled (`1`) or disabled (`0`). If enabled, Tenable Vulnerability Management sends the two-factor verification code via e-mail, as well as via the default SMS message.
  securitySchemes:
    Bearer:
      type: apiKey
      in: header
      name: Authorization
      description: 'Example: Bearer {{token}}'
