openapi: 3.2.0
info:
  title: Identity Exposure Event API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Event
  description: A change in the Active Directory
paths:
  /api/directories/{directoryId}/events/{id}:
    get:
      summary: Get event instance by id
      description: 'Required license type: ioe, ioaPreview, ioa'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: An event instance
                type: object
                additionalProperties: false
                required:
                - id
                - adObjectId
                - directoryId
                - date
                - type
                properties:
                  id:
                    format: int64
                  adObjectId:
                    type: number
                  directoryId:
                    type: number
                  type:
                    type:
                    - string
                    - 'null'
                  date:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Event
      x-tenablead-required-product-license-type:
      - ioe
      - ioaPreview
      - ioa
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: directoryId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiDirectoriesByDirectoryIdEventsById
      x-operation-id-source: derived
  /api/infrastructures/{infrastructureId}/directories/{directoryId}/events/{id}:
    get:
      summary: Get event instance by id
      description: 'Required license type: ioe, ioaPreview, ioa'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: An event instance
                type: object
                additionalProperties: false
                required:
                - id
                - adObjectId
                - directoryId
                - date
                - type
                properties:
                  id:
                    format: int64
                  adObjectId:
                    type: number
                  directoryId:
                    type: number
                  type:
                    type:
                    - string
                    - 'null'
                  date:
                    type: string
                    format: date-time
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Event
      x-tenablead-required-product-license-type:
      - ioe
      - ioaPreview
      - ioa
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: infrastructureId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: directoryId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiInfrastructuresByInfrastructureIdDirectoriesByDirectoryIdEventsById
      x-operation-id-source: derived
  /api/events/search:
    post:
      summary: Search events instances
      description: 'Required license type: ioe, ioaPreview, ioa'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the POST /infrastructures/{infraId}/directories/{dirId}/events response
                type: array
                items:
                  description: An event instance
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - adObjectId
                  - directoryId
                  - date
                  - type
                  properties:
                    id:
                      format: int64
                    adObjectId:
                      type: number
                    directoryId:
                      type: number
                    type:
                      type:
                      - string
                      - 'null'
                    date:
                      type: string
                      format: date-time
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Event
      x-tenablead-required-product-license-type:
      - ioe
      - ioaPreview
      - ioa
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - expression
              - profileId
              - directoryIds
              - dateStart
              - dateEnd
              properties:
                expression:
                  type: object
                order:
                  type: object
                  properties:
                    column:
                      type: string
                      enum:
                      - id
                    direction:
                      type: string
                      enum:
                      - asc
                      - desc
                profileId:
                  type: integer
                directoryIds:
                  type: array
                  minItems: 1
                  items:
                    type: integer
                dateStart:
                  type: string
                  format: date-time
                dateEnd:
                  type: string
                  format: date-time
      operationId: postApiEventsSearch
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKey:
      name: x-api-key
      description: The user's API key
      in: header
      type: apiKey
x-readme:
  explorer-enabled: true
  proxy-enabled: true
