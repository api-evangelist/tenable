openapi: 3.2.0
info:
  title: Identity Exposure Checker option API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Checker option
  description: Security profile options relative to checkers (Indicator of Exposure)
paths:
  /api/profiles/{profileId}/checkers/{checkerId}/checker-options:
    get:
      summary: Get all the checker options related to a profile and checker
      description: 'Required license type: ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the get /checker-options response
                type: array
                items:
                  description: A checker-option instance
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - codename
                  - profileId
                  - checkerId
                  - directoryId
                  - value
                  - valueType
                  - staged
                  properties:
                    id:
                      type: number
                      description: ' Unique numeric identifier of the option'
                    codename:
                      type: string
                      description: Unique string identifier of the option
                    profileId:
                      type: number
                      description: Identifier of the profile the option belongs to
                    checkerId:
                      type: number
                      description: Identifier of the checker the option belongs to
                    directoryId:
                      type:
                      - number
                      - 'null'
                      description: Identifier of the directory on which the option applies, if null it applies on all of them
                    value:
                      type: string
                      description: JSON-stringified value of the option
                    valueType:
                      type: string
                      enum:
                      - string
                      - regex
                      - float
                      - integer
                      - boolean
                      - date
                      - object
                      - array/string
                      - array/regex
                      - array/integer
                      - array/boolean
                      - array/select
                      - array/object
                      - array/cron
                      description: Type of the option value
                    name:
                      type:
                      - string
                      - 'null'
                      default: null
                      description: Localized name of the option
                    description:
                      type:
                      - string
                      - 'null'
                      default: null
                      description: Localized description of the option
                    translations:
                      type: array
                      items:
                        type: string
                    staged:
                      type: boolean
                      description: Whether the option is still in draft
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Checker option
      x-tenablead-required-product-license-type:
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: profileId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: checkerId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: staged
        in: query
        schema:
          type: string
          enum:
          - '0'
          - '1'
        required: false
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiProfilesByProfileIdCheckersByCheckerIdCheckerOptions
      x-operation-id-source: derived
    post:
      summary: Create checker options related to a profile and checker
      description: 'Required license type: ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the get /profiles/:profileId/checkers/:checkerId/checker-options response
                type: array
                items:
                  description: A checker-option instance
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - codename
                  - profileId
                  - checkerId
                  - directoryId
                  - value
                  - valueType
                  - staged
                  properties:
                    id:
                      type: number
                      description: ' Unique numeric identifier of the option'
                    codename:
                      type: string
                      description: Unique string identifier of the option
                    profileId:
                      type: number
                      description: Identifier of the profile the option belongs to
                    checkerId:
                      type: number
                      description: Identifier of the checker the option belongs to
                    directoryId:
                      type:
                      - number
                      - 'null'
                      description: Identifier of the directory on which the option applies, if null it applies on all of them
                    value:
                      type: string
                      description: JSON-stringified value of the option
                    valueType:
                      type: string
                      enum:
                      - string
                      - regex
                      - float
                      - integer
                      - boolean
                      - date
                      - object
                      - array/string
                      - array/regex
                      - array/integer
                      - array/boolean
                      - array/select
                      - array/object
                      - array/cron
                      description: Type of the option value
                    name:
                      type:
                      - string
                      - 'null'
                      default: null
                      description: Localized name of the option
                    description:
                      type:
                      - string
                      - 'null'
                      default: null
                      description: Localized description of the option
                    translations:
                      type: array
                      items:
                        type: string
                    staged:
                      type: boolean
                      description: Whether the option is still in draft
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Checker option
      x-tenablead-required-product-license-type:
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: profileId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: checkerId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Validates the POST /profiles/:profileId/checkers/:checkerId/checker-options request
              type: array
              items:
                type: object
                additionalProperties: false
                required:
                - codename
                - value
                - valueType
                properties:
                  codename:
                    type: string
                  directoryId:
                    type:
                    - number
                    - 'null'
                    default: null
                  value:
                    type: string
                  valueType:
                    type: string
                    enum:
                    - string
                    - regex
                    - float
                    - integer
                    - boolean
                    - date
                    - object
                    - array/string
                    - array/regex
                    - array/integer
                    - array/boolean
                    - array/select
                    - array/object
                    - array/cron
      operationId: postApiProfilesByProfileIdCheckersByCheckerIdCheckerOptions
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKey:
      name: x-api-key
      description: The user's API key
      in: header
      type: apiKey
x-readme:
  explorer-enabled: true
  proxy-enabled: true
