  /workbenches/assets:
    get:
      summary: List assets
      description: "Retrieves a list of assets. The list can be modified using filters. The list returned is limited to 5,000. To retrieve more than 5,000 assets, use the [Export assets v2](ref:export-assets-v2) endpoint.\n\n **Note:** This endpoint is not intended for large or frequent exports of vulnerability or assets data. If you experience errors, reduce the volume, [rate](doc:rate-limiting), or [concurrency](doc:concurrency-limiting) of your requests or narrow your filters. Contact support if you continue to experience errors. Additionally, Tenable recommends the [POST /vulns/export](ref:exports-vulns-request-export) endpoint for large or frequent exports of vulnerability data, and the [POST /assets/v2/export](ref:export-assets-v2) endpoint for large or frequent exports of assets data.\n\nFor information and best practices for retrieving vulnerability and assets data from Tenable Vulnerability Management, see [Retrieve Vulnerability Data from Vulnerability Management](doc:retrieve-vulnerability-data-from-tenableio) and [Retrieve Asset Data from Vulnerability Management](doc:retrieve-asset-data-from-tenableio).<div class=\"perms-callout\">Requires the Basic [16] user role. See [Roles](doc:roles).</div>"
      operationId: workbenches-assets
      tags:
      - Workbenches
      parameters:
      - description: The number of days of data prior to and including today that should be returned.
        name: date_range
        in: query
        schema:
          type: integer
          format: int32
      - description: The name of the filter to apply to the exported scan report. You can find available filters by using the [GET /filters/workbenches/assets](ref:io-filters-assets-list) endpoint. If you specify the name of the filter, you must specify the operator as the filter.0.quality parameter and the value as the filter.0.value parameter. To use multiple filters, increment the `<INDEX>` portion of `filter.<INDEX>.filter`, for example, `filter.0.filter`. For more information about the format of this parameter, see [Workbench Filters](doc:workbench-filters).
        required: false
        name: filter.0.filter
        in: query
        schema:
          type: string
        example: plugin.name
      - description: The operator of the filter to apply to the exported scan report. You can find the operators for the filter using the [GET /filters/workbenches/assets](ref:io-filters-assets-list) endpoint. For more information about the format of this parameter, see [Workbench Filters](doc:workbench-filters).
        required: false
        name: filter.0.quality
        in: query
        schema:
          type: string
        example: match
      - description: "The value of the filter to apply to the exported scan report. You can find valid values for the filter in the 'control' attribute of the objects returned by the [GET /filters/workbenches/assets](ref:io-filters-assets-list) endpoint. For more information about the format of this parameter, see [Workbench Filters](doc:workbench-filters).\n\n **Note:** The value is case sensitive when used with the `match` (contains) or `nmatch` (does not contain) operators."
        required: false
        name: filter.0.value
        in: query
        schema:
          type: string
        example: RHEL
      - description: For multiple filters, specifies whether to use the AND or the OR logical operator. The default is AND. For more information about this parameter, see [Workbench Filters](doc:workbench-filters).
        required: false
        name: filter.search_type
        in: query
        schema:
          type: string
          enum:
          - ''
          - and
          - or
      - description: Specifies whether to return all asset fields or only the default fields. When this parameter is present in the request (for example, `all_fields=full`), the system returns the full set of asset attributes. When this parameter is absent, the system returns only the default fields. The schema for this endpoint defines the default fields only. For a definition of the full fields, see [Common Asset Attributes](doc:common-asset-attributes).
        required: false
        name: all_fields
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Returned if the list of assets was retrieved successfully.
          content:
