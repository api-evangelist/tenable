    workbenches_workbenches-tag-object:
      type: object
      properties:
        tag_uuid:
          type: string
          description: The unique identifier of the tag.
        tag_key:
          type: string
          description: The tag key, representing the category portion of a category:value tag pair.
        tag_value:
          type: string
          description: The tag value, representing the value portion of a category:value tag pair.
        added_by:
          type: string
          description: The unique identifier of the user who assigned the tag to the asset.
        added_at:
          type: string
          description: A timestamp in ISO 8601 format indicating the date and time the tag was assigned to the asset.
        source:
          type: string
          description: "Indicates the tag type. Tag types include:\n - static—A user manually applied the tag to an asset. You can use the Tenable Vulnerability Management API to create and assign static tags to assets.\n - dynamic—Tenable Vulnerability Management automatically applies the tag based on asset attribute rules. \n\nFor more information, see [Apply Dynamic Tags](doc:apply-dynamic-tags)."
    workbenches_workbenches-vulnerability-info:
      type: object
      properties:
        count:
          type: integer
          format: int32
          description: A count of the vulnerability occurrences.
        vuln_count:
          type: integer
          format: int32
          description: ''
        description:
          type: string
          description: The description of the vulnerability.
        synopsis:
          type: string
          description: A brief summary of the vulnerability.
        solution:
          type: string
          description: Information on how to fix the vulnerability.
        discovery:
          type: object
          properties:
            seen_first:
              type: string
              description: The Unix timestamp of the scan that first detected the vulnerability on an asset.
            seen_last:
              type: string
              description: The Unix timestamp of the scan that most recently detected the vulnerability on an asset.
        severity:
          type: integer
          description: The severity level of the vulnerability.
        plugin_details:
          type: object
          properties:
            family:
              type: string
              description: The plugin family.
            modification_date:
              type: string
              description: The ISO timestamp when Tenable last updated the plugin definition.
            name:
              type: string
              description: The name of the plugin.
            publication_date:
              type: string
              description: The ISO timestamp when Tenable first published the plugin definition.
            type:
              type: string
              description: The type of scan that uses the plugin, either a network scan (`remote`) or a credentialed scan (`local`).
            version:
              type: string
              description: The plugin version.
            severity:
              type: integer
              format: int32
              description: The severity level of the plugin.
        reference_information:
          type: array
          description: ''
          items:
            type: object
            properties:
              name:
                type: string
                description: "The source of the reference information about the vulnerability. Possible values include:\n - bid—Bugtraq (Symantec Connect)\n - cert—CERT/CC Vulnerability Notes Database\n - cve—NIST National Vulnerability Database (NVD)\n - edb-id—The Exploit Database\n - iava—information assurance vulnerability alert\n - osvdb—Open Sourced Vulnerability Database"
              url:
                type: string
                description: The URL of the source site, if available.
              values:
                type: array
                description: The unique identifier(s) for the vulnerability at the source.
                items:
                  type: string
        risk_information:
          type: object
          properties:
            risk_factor:
              type: string
              description: 'The risk factor of the vulnerability associated with the plugin. The risk factor is determined based on the calculation of the CVSS score, possible values are: <ul><li>`Low`—The vulnerability has a CVSS score between 0.1 and 3.9</li><li>`Medium`—The vulnerability has a CVSS score between 4.0 and 6.9</li><li>`High`—The vulnerability has a CVSS score between 7.0 and 9.9</li><li>`Critical`—The vulnerability has a CVSS score of 10.0</li></ul>.'
            cvss_vector:
              type: string
              description: The raw CVSSv2 metrics for the vulnerability. For more information, see CVSSv2 documentation.
            cvss_base_score:
              type: string
              description: The CVSSv2 base score (intrinsic and fundamental characteristics of a vulnerability that are constant over time and user environments).
            cvss_temporal_vector:
              type: string
              description: The raw CVSSv2 temporal metrics for the vulnerability.
            cvss_temporal_score:
              type: string
              description: The CVSSv2 temporal score (characteristics of a vulnerability that change over time but not among user environments).
            cvss3_vector:
              type: string
              description: The raw CVSSv3 metrics for the vulnerability. For more information, see CVSSv3 documentation.
            cvss3_base_score:
              type: string
              description: The CVSSv3 base score (intrinsic and fundamental characteristics of a vulnerability that are constant over time and user environments).
            cvss3_temporal_vector:
              type: string
              description: CVSSv3 temporal metrics for the vulnerability.
            cvss3_temporal_score:
              type: string
              description: The CVSSv3 temporal score (characteristics of a vulnerability that change over time but not among user environments).
            stig_severity:
              type: string
              description: Security Technical Implementation Guide (STIG) severity code for the vulnerability.
        see_also:
          type: array
          description: Links to external websites that contain helpful information about the vulnerability.
          items:
            type: string
        vulnerability_information:
          type: object
          properties:
            vulnerability_publication_date:
              type: string
              description: The ISO timestamp for the first publication date of the plugin.
            exploited_by_malware:
              type: boolean
              description: The vulnerability discovered by this plugin is known to be exploited by malware.
            patch_publication_date:
              type: string
              description: The ISO timestamp for date on which the vendor published a patch for the vulnerability.
            exploit_available:
              type: boolean
              description: A value specifying whether a public exploit exists for the vulnerability.
            exploitability_ease:
              type: string
              description: Description of how easy it is to exploit the issue.
            asset_inventory:
              type: string
              description: ''
            default_account:
              type: string
              description: ''
            exploited_by_nessus:
              type: boolean
              description: A value specifying whether Nessus exploited the vulnerability during the process of identification.
            in_the_news:
              type: boolean
              description: A value specifying whether this plugin has received media attention (for example, ShellShock, Meltdown).
            malware:
              type: string
              description: ''
            unsupported_by_vendor:
              type: boolean
              description: Software found by this plugin is unsupported by the software's vendor (for example, Windows 95 or Firefox 3).
            cpe:
              type: string
              description: The Common Platform Enumeration (CPE) number for the plugin.
            exploit_frameworks:
              type: array
              description: A list of exploit frameworks that have identified the vulnerability.
              items:
                $ref: '#/components/schemas/workbenches_exploit_framework'
        vpr:
          type: object
          description: Information about the Vulnerability Priority Rating (VPR) for the vulnerability.
          properties:
            score:
              type: number
              format: float
              description: The Vulnerability Priority Rating (VPR) for the vulnerability. If a plugin is designed to detect multiple vulnerabilities, the VPR represents the highest value calculated for a vulnerability associated with the plugin. For more information, see <a href="https://docs.tenable.com/vulnerability-management/Content/Analysis/RiskMetrics.htm" target="_blank">Severity vs. VPR</a> in the <i>Tenable Vulnerability Management User Guide</i>.
            drivers:
              type: object
              description: The key drivers Tenable uses to calculate a vulnerability's VPR. For more information, see <[Vulnerability Priority Rating Drivers](doc:vpr-drivers-tio).
              properties: {}
            updated:
              type: string
              description: The ISO timestamp when Tenable Vulnerability Management last imported the VPR for this vulnerability. Tenable Vulnerability Management imports a VPR value the first time you scan a vulnerability on your network. Then, Tenable Vulnerability Management automatically re-imports new and updated VPR values daily.
    workbenches_workbenches-assets-with-vulns:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
            description: The unique identifier of the asset.
          severities:
            type: array
            description: A count of vulnerabilities by severity.
            items:
              $ref: '#/components/schemas/workbenches_workbenches-severity-object'
          total:
            type: integer
            description: The total number of vulnerabilities detected on the asset.
          fqdn:
            description: A list of fully qualified domain names (FQDNs) associated with the asset.
            type: array
            items:
              type: string
          ipv4:
            description: A list of IPv4 addresses associated with the asset.
            type: array
            items:
              type: string
          ipv6:
            description: A list of IPv6 addresses associated with the asset.
            type: array
            items:
              type: string
          last_seen:
            type: string
            description: The ISO timestamp of the scan that most recently detected the asset.
          netbios_name:
            type: array
            description: A list of NetBIOS names associated with the asset.
            items:
              type: string
          agent_name:
            type: array
            description: A list of Tenable agents that scanned and identified the asset.
            items:
              type: string
    workbenches_workbenches-activity-source:
      type: object
      properties:
        name:
          type: string
          description: "The name of the entity that reported the asset details. Sources can include sensors, connectors, and API imports. Source names can be customized by your organization (for example, you specify a name when you import asset records). If your organization does not customize source names, system-generated names include:\n - AWS—You obtained the asset data from an Amazon Web Services connector.\n - NESSUS_AGENT—You obtained the asset data obtained from a Nessus agent scan.\n - PVS—You obtained the asset data from a Nessus Network Monitor (NNM) scan.\n - NESSUS_SCAN—You obtained the asset data from a Nessus scan.\n - WAS—You obtained the asset data from a  Tenable Web App Scanning scan."
        firstSeen:
          type: string
          description: The ISO timestamp when the source first reported the asset.
        lastSeen:
          type: string
          description: The ISO timestamp when the source last reported the asset.
    workbenches_workbenches-severity-object:
      type: object
      properties:
        count:
          type: integer
          description: The number of vulnerabilities with the specified severity.
        level:
          type: integer
          description: "The code for the severity. Possible values include: \n - 0—The vulnerability has a CVSS score of 0, which corresponds to the \"info\" severity level.\n - 1—The vulnerability has a CVSS score between 0.1 and 3.9, which corresponds to the \"low\" severity level.\n - 2—The vulnerability has a CVSS score between 4.0 and 6.9, which corresponds to the \"medium\" severity level.\n - 3—The vulnerability has a CVSS score between 7.0 and 9.9, which corresponds to the \"high\" severity level.\n - 4—The vulnerability has a CVSS score of 10.0, which corresponds to the \"critical\" severity level."
        name:
          type: string
          description: The severity of the vulnerability as defined using the Common Vulnerability Scoring System (CVSS) base score. Possible values include `info` (CVSS score of 0), `low` (CVSS score between 0.1 and 3.9), `medium` (CVSS score between 4.0 and 6.9), `high` (CVSS score between 7.0 and 9.9), and `critical` (CVSS score of 10.0).
    workbenches_ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: The HTTP status code of the error.
        error:
          type: integer
          description: The standard HTTP error name.
        message:
          type: string
          description: A brief message about the cause of the error.
    workbenches_workbenches-source-object:
      type: object
      properties:
        name:
          type: string
          description: "The name of the entity that reported the asset details. Sources can include sensors, connectors, and API imports. Source names can be customized by your organization (for example, you specify a name when you import asset records). If your organization does not customize source names, system-generated names include:\n - AWS—You obtained the asset data from an Amazon Web Services connector.\n - NESSUS_AGENT—You obtained the asset data obtained from a Nessus agent scan.\n - PVS—You obtained the asset data from a Nessus Network Monitor (NNM) scan.\n - NESSUS_SCAN—You obtained the asset data from a Nessus scan.\n - WAS—You obtained the asset data from a  Tenable Web App Scanning scan."
        first_seen:
          type: string
          description: The ISO timestamp when the source first reported the asset.
        last_seen:
          type: string
          description: The ISO timestamp when the source last reported the asset.
