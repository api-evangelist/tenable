                        description: The transportation protocol (TCP or UDP) where this vulnerability was found.
                      assets:
                        type: array
                        description: A list of assets where this output was found.
                        items:
                          type: object
                          properties:
                            hostname:
                              type: string
                              description: The host name of the asset.
                            id:
                              type: string
                              description: The ID of the asset.
                            uuid:
                              type: string
                              description: The unique identifier of the asset. Use this value as the unique key for the asset.
                            netbios_name:
                              type: string
                              description: The NetBios name of the asset.
                            fqdn:
                              type: string
                              description: The FQDN of the asset.
                            ipv4:
                              type: string
                              description: The IPV4 of the asset.
                            first_seen:
                              type: string
                              format: date-time
                              description: Indicates when the asset was discovered by a scan.
                            last_seen:
                              type: string
                              format: date-time
                              description: Indicates when the asset was last observed by a scan.
                      severity:
                        type: integer
                        description: Integer [0-4] indicating how severe the vulnerability is, where 0 is info only.
