components:
  schemas:
    workbenches_workbenches-assets:
      type: array
      description: An array of asset objects.
      items:
        $ref: '#/components/schemas/workbenches_workbenches-asset'
    workbenches_exploit_framework:
      type: object
      description: Information about the vulnerability in a specific exploit framework.
      properties:
        name:
          type: string
          description: The name of the exploit framework.
        exploits:
          type: array
          description: A list of exploits associated with the vulnerability in the specified exploit framework.
          items:
            $ref: '#/components/schemas/workbenches_exploit'
    workbenches_exploit:
      type: object
      properties:
        name:
          type: string
          description: The name of the identified exploit.
        url:
          type: string
          description: The URL for the exploit in the framework.
    workbenches_AcrDriversObject:
      type: object
      description: Asset characteristic that factored into the Asset Criticality Rating (ACR) calculation. For more details see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the *Tenable Vulnerability Management User Guide*.
      properties:
        driver_name:
          type: string
          description: The ACR key driver. ACR key drivers reflect the global threat landscape associated with the asset's characteristics.
          enum:
          - device_type
          - device_capability
          - internet_exposure
        driver_value:
          type: array
          description: 'The ACR key driver''s value. For example, for the `device_type` key driver, values can include `hypervisor`, `printer`, etc. '
          items:
            type: string
    workbenches_workbenches-vulnerability:
      type: object
      properties:
        count:
          type: integer
          description: The number of times that a scan detected the vulnerability on an asset.
        plugin_family:
          type: string
          description: The plugin's family.
        plugin_id:
          type: integer
          description: The unique plugin ID.
        plugin_name:
          type: string
          description: The name of the plugin that detected the vulnerability.
        vulnerability_state:
          type: string
          description: "The current state of the reported plugin. Possible states include:\n - Active—The vulnerability is currently present on an asset.\n - New—The vulnerability is active on an asset, and was first detected within the last 14 days.\n - Fixed—A subsequent scan detected that the formerly-active vulnerability is no longer present on an asset.\n - Resurfaced—The vulnerability was previously marked as fixed on an asset, but a subsequent scan detected the vulnerability on the asset again."
        vpr_score:
          type: number
          format: float
          description: The Vulnerability Priority Rating (VPR) for the vulnerability. If a plugin is designed to detect multiple vulnerabilities, the VPR represents the highest value calculated for a vulnerability associated with the plugin. For more information, see <a href="https://docs.tenable.com/vulnerability-management/Content/Analysis/RiskMetrics.htm" target="_blank">Severity vs. VPR</a> in the <i>Tenable Vulnerability Management User Guide</i>.
        severity:
          type: integer
          description: "The severity level of the vulnerability, as defined using the Common Vulnerability Scoring System (CVSS) base score. Possible values include: \n - 0—The vulnerability has a CVSS score of 0, which corresponds to the \"info\" severity level.\n - 1—The vulnerability has a CVSS score between 0.1 and 3.9, which corresponds to the \"low\" severity level.\n - 2—The vulnerability has a CVSS score between 4.0 and 6.9, which corresponds to the \"medium\" severity level.\n - 3—The vulnerability has a CVSS score between 7.0 and 9.9, which corresponds to the \"high\" severity level.\n - 4—The vulnerability has a CVSS score of 10.0, which corresponds to the \"critical\" severity level."
          format: int32
        accepted_count:
          type: integer
          description: The number of times that a user in the user interface created an accept rule for this vulnerability. For more information, see <a href="https://docs.tenable.com/vulnerability-management/Content/Settings/Recast/AboutRecastRules.htm" target="_blank">Recast Rules</a> in the <i>Tenable Vulnerability Management User Guide</i>.
          format: int32
        recasted_count:
          type: integer
          description: The number of times that a user in the user interface created a recast rule for this vulnerability. For more information, see <a href="https://docs.tenable.com/vulnerability-management/Content/Settings/Recast/AboutRecastRules.htm" target="_blank">Recast Rules</a> in the <i>Tenable Vulnerability Management User Guide</i>.
          format: int32
        counts by severity:
          type: array
          description: The number of times that a scan detected the vulnerability on an asset, grouped by severity level.
          items:
            type: object
            properties:
              count:
                type: integer
                description: The number of times that a scan detected the vulnerability on an asset while the vulnerability was assigned the specified severity level.
                format: int32
              value:
                type: integer
                description: The severity level of the vulnerabilities in the group.
        cvss_base_score:
          type: number
          format: float
          description: The vulnerability's base CVSS v2.0 score. A vulnerability's base score is determined when the vulnerability is initially discovered and does not change over time.
        cvss3_base_score:
          type: number
          format: float
          description: The vulnerability's base CVSS v3.0 score. A vulnerability's base score is determined when the vulnerability is initially discovered and does not change over time.
    workbenches_workbenches-asset-details:
      type: object
      properties:
        time_end:
          type: string
          description: The scan end timestamp, in ISO-8601 format, when the asset was first detected.
        time_start:
          type: string
          description: The scan start timestamp, in ISO-8601 format, when the asset was first detected.
        id:
          type: string
          description: The unique identifier of the asset.
        uuid:
          type: string
          description: The unique identifier of the asset. Use this value as the unique key for the asset.
        operating_system:
          type: array
          description: A list of operating systems associated with the asset.
          items:
            type: string
        counts:
          type: object
          description: Counts of vulnerabilities on the asset, as well as counts of audit checks performed on the asset. For more information about this object, see [Common Asset Attributes](doc:common-asset-attributes).
          properties: {}
        has_agent:
          type: boolean
          description: A value specifying whether a Nessus agent scan detected the asset.
        created_at:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time the asset record was created.
        updated_at:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time the asset record was last updated.
        first_seen:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time a scan first identified the asset.
        last_seen:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time of the scan that most recently detected the asset.
        last_authenticated_scan_date:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time the last credentialed scan was performed on the asset.
        last_licensed_scan_date:
          type: string
          format: date-time
          description: A timestamp in ISO 8601 format indicating the date and time of the last scan that identified the asset as licensed. An asset is considered licensed if a scan has returned results from a non-discovery plugin within the past 90 days.
        last_scan_target:
          type: string
          description: The IPv4 address, IPv6 address, or FQDN that the scanner last used to evaluate the asset.
        sources:
          type: array
          description: The sources of the scans that identified the asset.
          items:
            $ref: '#/components/schemas/workbenches_workbenches-source-object'
        tags:
          type: array
          description: A list of tags assigned to the asset.
          items:
            $ref: '#/components/schemas/workbenches_workbenches-tag-object'
        acr_score:
          type: number
          format: float
          maximum: 10
          minimum: 0
          description: 'The Asset Criticality Rating (ACR) for the asset. Tenable assigns an ACR to each asset on your network to represent the asset''s relative risk as an integer from 1 to 10. For more information, see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the *Tenable Vulnerability Management User Guide*.


            This attribute is only present if you have a Lumin license.'
        acr_drivers:
          type: array
          description: 'The key drivers that Tenable uses to calculate an asset''s Tenable-provided ACR. For more information, see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the *Tenable Vulnerability Management User Guide*.


            This attribute is only present if you have a Lumin license.'
          items:
            $ref: '#/components/schemas/workbenches_AcrDriversObject'
        exposure_score:
          type: number
          format: float
          maximum: 1000
          minimum: 0
          description: 'The Asset Exposure Score (AES) for the asset. For more information, see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the *Tenable Vulnerability Management User Guide*.


            This attribute is only present if you have a Lumin license.'
        scan_frequency:
          type: array
          description: 'Information about how often scans were run against the asset during specified time intervals. For more details, see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the *Tenable Vulnerability Management User Guide*.


            Note: This attribute is available only with a Tenable Lumin license.'
          items:
            $ref: '#/components/schemas/workbenches_AcrScanFrequencyObject'
        ipv4:
          type: array
          description: A list of IPv4 addresses associated with the asset.
          items:
            type: string
        ipv6:
          type: array
          description: A list of IPv6 addresses associated with the asset.
          items:
            type: string
        fqdn:
          type: array
          description: A list of fully qualified domain names (FQDNs) associated with the asset.
          items:
            type: string
        mac_address:
          type: array
          description: A list of MAC addresses associated with the asset.
          items:
            type: string
        netbios_name:
          type: array
          description: A list of NetBIOS names associated with the asset.
          items:
            type: string
        system_type:
          type: array
          description: A list of system types assigned to the asset as reported by Plugin ID 54615. Possible values include `router`, `general-purpose`, `scan-host`, and `embedded`.
          items:
            type: string
          enum:
          - router
          - general-purpose
          - scan-host
          - embedded
        tenable_uuid:
          type: array
          description: This identifier can originate from either an agent or a credentialed remote Nessus scan. If no agent is present on the asset, a UUID is assigned by Tenable Vulnerability Management during a credentialed scan when the [Create unique identifier on hosts scanned with credentials](https://docs.tenable.com/vulnerability-management/Content/Scans/AdvancedSettings.htm) option is enabled. Note that no UUID is set for an uncredentialed non-agent scans.
          items:
            type: string
        hostname:
          type: array
          description: A list of host names associated with the asset.
          items:
            type: string
        agent_name:
          type: array
          description: A list of Tenable agents that scanned and identified the asset.
          items:
            type: string
        bios_uuid:
          type: array
          description: A list of BIOS UUIDs associated with the asset.
          items:
            type: string
        aws_ec2_instance_id:
          type: array
          description: A list of Linux instance identifiers in Amazon Elastic Compute Cloud (Amazon EC2) associated with the asset. For more information, see the Amazon Elastic Compute Cloud documentation.
          items:
            type: string
        aws_ec2_instance_ami_id:
          type: array
          description: The unique identifier of the Linux AMI image in Amazon Elastic Compute Cloud (Amazon EC2) associated with the asset. For more information, see the Amazon Elastic Compute Cloud documentation.
          items:
            type: string
        aws_owner_id:
          type: array
          description: A list of canonical user identifier for the AWS account associated with the virtual machine instance. For example, `79a59df900b949e55d96a1e698fbacedfd6e09d98eacf8f8d5218e7cd47ef2be`. For more information, see AWS Account Identifiers in the AWS documentation.
          items:
            type: string
        aws_availability_zone:
          type: array
          description: A list of availability zones where Amazon Web Services hosts the virtual machine instance. For example, `us-east-1a`. Availability zones are subdivisions of AWS regions. For more information, see Regions and Availability Zones in the AWS documentation.
          items:
            type: string
        aws_region:
          type: array
          description: A list of regions where AWS hosts the virtual machine instance. For example, `us-east-1`. For more information, see Regions and Availability Zones in the AWS documentation.
          items:
            type: string
        aws_vpc_id:
          type: array
          description: A list of virtual public cloud identifiers that hosts the AWS virtual machine instance. For more information, see the Amazon Virtual Private Cloud User Guide.
          items:
            type: string
        aws_ec2_instance_group_name:
          type: array
          description: A list of virtual machine instance groups in AWS.
          items:
            type: string
        aws_ec2_instance_state_name:
          type: array
          description: A list of virtual machine instance states in AWS at the time of the scan. For more information on instance states, see the AWS documentation.
          items:
            type: string
        aws_ec2_instance_type:
          type: array
          description: A list of instance types in AWS EC2.
          items:
            type: string
        aws_subnet_id:
          type: array
          description: A list of unique identifiers of AWS subnets where the virtual machine instance was running at the time of the scan.
          items:
            type: string
        aws_ec2_product_code:
          type: array
          description: A list of product codes associated with the AMI used to launch the virtual machine instance in AWS EC2.
          items:
            type: string
        aws_ec2_name:
          type: array
          description: A list of virtual machine instance names in AWS EC2 associated with the asset.
          items:
            type: string
        azure_vm_id:
          type: array
          description: A list of unique identifiers of Microsoft Azure virtual machine instances. For more information, see "Accessing and Using Azure VM Unique ID" in the Microsoft Azure documentation.
          items:
            type: string
        azure_resource_id:
          type: array
          description: A list of unique identifiers of the resources in the Azure Resource Manager. For more information, see the Azure Resource Manager Documentation.
          items:
            type: string
        gcp_project_id:
          type: array
          description: A list of customized names of projects to which the virtual machine instance belongs in Google Cloud Platform (GCP). For more information, see "Creating and Managing Projects" in the GCP documentation.
          items:
            type: string
        gcp_zone:
          type: array
          description: A list of zones where the virtual machine instance runs in GCP. For more information, see "Regions and Zones" in the GCP documentation.
          items:
            type: string
        gcp_instance_id:
          type: array
          description: A list of unique identifiers of virtual machine instances in GCP.
          items:
            type: string
        ssh_fingerprint:
          type: array
          description: A list of SSH key fingerprints associated with the asset.
          items:
            type: string
        mcafee_epo_guid:
          type: array
          description: A list of unique identifiers assigned to the asset in McAfee ePolicy Orchestrator (ePO). For more information, see the McAfee documentation.
          items:
            type: string
        mcafee_epo_agent_guid:
          type: array
          description: A list of unique identifiers of the McAfee ePO agents that identified the asset. For more information, see the McAfee documentation.
          items:
            type: string
        qualys_asset_id:
          type: array
          description: A list of unique identifiers for the asset in Qualys. For more information, see the Qualys documentation.
          items:
            type: string
        qualys_host_id:
          type: array
          description: The Host ID of the asset in Qualys. For more information, see the Qualys documentation.
          items:
            type: string
        servicenow_sysid:
          type: array
          description: The unique record identifier of the asset in ServiceNow. For more information, see the ServiceNow documentation.
          items:
            type: string
        installed_software:
          type: array
          description: 'A list of Common Platform Enumeration (CPE) values that represent software applications a scan identified as present on an asset. This attribute supports the CPE 2.2 format. For more information, see the "Component Syntax" section of the [CPE Specification, Version 2.2](https://cpe.mitre.org/files/cpe-specification_2.2.pdf). For assets identified in Tenable scans, this attribute contains data only if a scan using [Nessus Plugin ID 45590](https://www.tenable.com/plugins/nessus/45590) has evaluated the asset.


            **Note:** If no scan detects an application within 30 days of the scan that originally detected the application, Tenable Vulnerability Management considers the detection of that application expired. As a result, the next time a scan evaluates the asset, Tenable Vulnerability Management removes the expired application from the installed_software attribute. This activity is logged as a `remove` type of `attribute_change` update in the asset activity log.'
          items:
            type: string
    workbenches_workbenches-asset-activity:
      type: object
      properties:
        type:
          type: string
          description: "Event type:\n - discovered—Asset created (for example, by a network scan or import).\n - seen—Asset observed by a network scan without any changes to its attributes.\n - tagging—Tag added to or removed from asset.\n - attribute_change—A scan identified new or changed attributes for the asset (for example, new software applications installed on the asset).\n - updated—Asset updated either manually by a user or automatically by a new scan."
        timestamp:
          type: integer
          description: The timestamp of the event. The timestamp is reported in ISO 8601 format in UTC time.
        scan_id:
          type: string
          description: The unique identifier of the scan that logged the event.
        schedule_id:
          type: string
          description: The ID of the scheduled scan associated with the event.
        source:
          type: string
          description: The entity that logged the event, for example, NESSUS_AGENT, NESSUS_AGENT, PVS, or WAS.
        details:
          type: object
          properties:
            assetId:
              type: string
              description: The unique identifier of the asset.
            containerId:
              type: string
              description: The unique identifier of your Tenable Vulnerability Management instance.
            createdAt:
              type: integer
              description: The timestamp of the asset creation. The timestamp is reported in ISO 8601 format in UTC time.
            updatedAt:
              type: integer
              description: The timestamp of the asset update time. The timestamp is reported in ISO 8601 format in UTC time.
            hasAgent:
              type: boolean
              description: Specifies whether the asset has an agent installed.
            hasPluginResults:
              type: boolean
              description: Specifies whether or not any plugin results match this asset.
            firstScanTime:
              type: integer
              description: The timestamp of the completion of the scan that discovered or observed the asset for the first time. The timestamp is reported in ISO 8601 format in UTC time.
            lastScanTime:
              type: integer
              description: The timestamp of the completion of the last asset scan. The timestamp is reported in ISO 8601 format in UTC time.
            lastAuthenticatedScanTime:
              type: integer
              description: The timestamp of the completion of the last authenticated scan of the asset. The timestamp is reported in ISO 8601 format in UTC time.
            lastLicensedScanTime:
              type: integer
              description: The timestamp of the scan completion time when asset was last scanned and matched license v1 requirements. The timestamp is reported in ISO 8601 format in UTC time.
            lastLicensedScanTimeV2:
              type: integer
              description: The timestamp of the scan completion time when asset was last scanned and matched license v2 requirements. The timestamp is reported in ISO 8601 format in UTC time.
            sources:
              description: An array of source objects representing the entity that logged the event.
              type: array
              items:
                $ref: '#/components/schemas/workbenches_workbenches-activity-source'
            terminatedAt:
              type: integer
              description: If terminated, the timestamp of asset termination. The timestamp is reported in ISO 8601 format in UTC time.
            terminatedBy:
              type: string
              description: The unique identifier of the user that terminated the asset.
            deletedAt:
              type: integer
              description: If deleted, the timestamp of asset deletion. The timestamp is reported in ISO 8601 format in UTC time.
            deletedBy:
              type: string
              description: The unique identifier of the user that deleted the asset.
            properties:
              type: object
              description: Additional asset attributes. For attribute definitions, see [Common Asset Attributes](doc:common-asset-attributes).
              properties: {}
        updates:
          type: array
          description: (attribute_change entries only) A list of updates to the asset's attributes.
          items:
            type: object
            properties:
              method:
                type: string
                description: "The update method. Possible values include: \n - add—A scan identified a new software application installed on the asset.\n - remove—Tenable Vulnerability Management identified the specified application as expired and removed it from the installed_software attribute of the asset. Tenable Vulnerability Management considers an application detection expired if no scan detects the application within 30 days of the scan that originally detected the application."
              property:
                type: string
                description: The name of the updated attribute.
              value:
                type: string
                description: The updated value of the attribute.
    workbenches_Error:
      type: object
      properties:
        error:
          type: string
          description: Standard HTTP error name, or a brief message about the cause of the error.
