  /workbenches/assets/{asset_uuid}:
    delete:
      summary: Delete asset
      description: 'Deletes the specified asset. When you delete an asset, Tenable Vulnerability Management deletes vulnerability data associated with the asset. Deleting an asset does not immediately subtract the asset from your licensed assets count. Deleted assets continue to be included in the count until they automatically age out as inactive.


        **Caution:** This endpoint is deprecated. Tenable recommends that customers use the [Bulk delete assets](ref:assets-bulk-delete) endpoint instead. Please update any existing integrations that your organization has. <div class="perms-callout">Requires the Scan Operator [24] user role. See [Roles](doc:roles).</div>'
      operationId: workbenches-assets-delete
      deprecated: true
      tags:
      - Workbenches
      parameters:
      - description: The unique identifier of the asset. You can find the UUID by examining the output of the [GET /workbenches/assets](ref:workbenches-assets) endpoint.
        required: true
        name: asset_uuid
        in: path
        schema:
          type: string
      responses:
        '202':
          description: Returned if Tenable Vulnerability Management successfully deletes the asset.
          content:
            application/json:
              schema: {}
              examples:
                response:
                  value: {}
        '401':
          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workbenches_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: Invalid credentials.
        '403':
          description: Returned if you do not have permission to delete the asset.
        '404':
          description: Returned if Tenable Vulnerability Management cannot find the specified asset.
        '429':
          description: Returned if you attempt to send too many requests in a specific period of time. For more information, see [Rate Limiting](doc:rate-limiting).
          content:
            text/html:
              examples:
                response:
                  value: "<html>\n\n<head>\n    <title>429 Too Many Requests</title>\n</head>\n\n<body bgcolor=\"white\">\n    <center>\n        <h1>429 Too Many Requests</h1>\n    </center>\n    <hr>\n    <center>nginx</center>\n</body>\n\n</html>"
        '500':
          description: Returned if an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workbenches_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
      security:
      - workbenches_cloud: []
  /workbenches/export:
    get:
      summary: Export workbench
      description: "Exports the specified workbench to a file. Once requested, the file can be downloaded using the [export download](ref:workbenches-export-download) method upon receiving a \"ready\" status from the [export status](ref:workbenches-export-status) method. For more information about workbench export files, see [Export File Formats](doc:export-file-formats).\n\n**Caution:** This endpoint is deprecated. Tenable recommends that customers use the [Create report](ref:vm-reports-create) endpoint instead. Please update any existing integrations that your organization has. \n\n**Note:** This endpoint is not intended for large or frequent exports of vulnerability or assets data. If you experience errors, reduce the volume, [rate](doc:rate-limiting), or [concurrency](doc:concurrency-limiting) of your requests or narrow your filters. Contact support if you continue to experience errors. Additionally, Tenable recommends the [POST /vulns/export](ref:exports-vulns-request-export) endpoint for large or frequent exports of vulnerability data, and the [POST /assets/v2/export](ref:export-assets-v2) endpoint for large or frequent exports of assets data.\n\nFor information and best practices for retrieving vulnerability and assets data from Tenable Vulnerability Management, see [Retrieve Vulnerability Data from Vulnerability Management](doc:retrieve-vulnerability-data-from-tenableio) and [Retrieve Asset Data from Vulnerability Management](doc:retrieve-asset-data-from-tenableio).<div class=\"perms-callout\">Requires the Basic [16] user role. See [Roles](doc:roles).</div>"
      operationId: workbenches-export-request
      deprecated: true
      tags:
      - Workbenches
      parameters:
      - description: 'The file format to use (Nessus, HTML, PDF, or CSV).


          **Note:** Tag-based filters are supported for the `CSV` file format type only.'
        required: true
        name: format
        in: query
        schema:
          type: string
          enum:
          - nessus
          - html
          - pdf
          - csv
      - description: The type of workbench report to be exported
        required: true
        name: report
        in: query
        schema:
          type: string
          enum:
          - vulnerabilities
      - description: The date (in unixtime) at which the exported results should begin to be included. Defaults to today.
        name: start_date
        in: query
        schema:
          type: integer
          format: int32
      - description: Semicolon-separated list of chapters to include for vulnerabilities/hosts reports (vuln\_by\_plugin, vuln\_by\_asset, vuln\_hosts\_summary) or a single chapter for Executive Summary (exec\_summary). Currently, only vuln\_by\_asset is supported for .nessus workbench exports.
        required: true
        name: chapter
        in: query
        schema:
          type: string
        example: vuln_by_asset
      - description: The number of days of data prior to and including start\_date that should be returned. If not specified, data for all dates is returned.
        name: date_range
        in: query
        schema:
          type: integer
          format: int32
      - description: The name of the filter to apply to the exported scan report. You can find available filters by using the [GET /filters/workbenches/assets](ref:io-filters-assets-list) endpoint. For more information about the format of this parameter, see [Workbench Filters](doc:workbench-filters).
        required: false
        name: filter.0.filter
        in: query
        schema:
          type: string
        example: plugin.name
      - description: The operator of the filter to apply to the exported scan report. You can find the operators for the filter using the [GET /filters/workbenches/assets](ref:io-filters-assets-list) endpoint. For more information about the format of this parameter, see [Workbench Filters](doc:workbench-filters).
        required: false
        name: filter.0.quality
        in: query
        schema:
          type: string
        example: match
      - description: The value of the filter to apply to the exported scan report. You can find valid values for the filter in the 'control' attribute of the objects returned by the [GET /filters/workbenches/assets](ref:io-filters-assets-list) endpoint. For more information about the format of this parameter, see [Workbench Filters](doc:workbench-filters).
        required: false
        name: filter.0.value
        in: query
        schema:
          type: string
        example: RHEL
      - description: For multiple filters, specifies whether to use the AND or the OR logical operator. The default is AND. For more information about this parameter, see [Workbench Filters](doc:workbench-filters).
        required: false
        name: filter.search_type
        in: query
        schema:
          type: string
          enum:
          - ''
          - and
          - or
      - description: When `true`, Tenable Vulnerability Management returns only a minimal subset of scan details for each result, excluding plugin attributes. In this case, only plugin\_output and vulnerability\_state fields are always returned; first\_found, last\_found and last\_fixed are also returned if possible.
        name: minimum_vuln_info
        in: query
        schema:
          type: boolean
          enum:
          - 'true'
          - 'false'
      - description: A plugin ID. Restricts the export data to vulnerabilities that only the specified plugin detects.
        name: plugin_id
        in: query
        schema:
          type: integer
          format: int32
      - description: The unique identifier of an asset. Restricts the export data to findings on the specified asset only.
        name: asset_id
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Returned if the export was queued successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  file:
                    type: integer
                    description: The ID of the generated file.
              examples:
                response:
                  value:
                    file: '1279345678'
        '400':
          description: Returned if you attempt to use a tag-based filter on a non-CSV file format.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workbenches_Error'
              examples:
                response:
                  value:
                    error: Request cannot contain a tag filter.
        '401':
          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workbenches_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: Invalid credentials.
        '403':
          description: Returned if you do not have permission to export the workbench.
        '429':
          description: Returned if you attempt to send too many requests in a specific period of time. For more information, see [Rate Limiting](doc:rate-limiting).
          content:
            text/html:
              examples:
                response:
                  value: "<html>\n\n<head>\n    <title>429 Too Many Requests</title>\n</head>\n\n<body bgcolor=\"white\">\n    <center>\n        <h1>429 Too Many Requests</h1>\n    </center>\n    <hr>\n    <center>nginx</center>\n</body>\n\n</html>"
        '500':
          description: Returned if an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/workbenches_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
      security:
      - workbenches_cloud: []
