          maximum: 1000
          minimum: 0
          description: "The Tenable-defined Asset Exposure Score (AES) assigned to the asset. This score, ranging from 1 to 1000, represents how exposed an asset is based on a weighted calculation of its [Vulnerability Priority Rating (VPR)](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm#VPR) and [Asset Criticality Rating (ACR)](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm#ACR). Higher values indicate greater exposure. Note that this property is returned as a string, but the value represents a floating-point number. \n\nFor more details, see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the _Tenable Vulnerability Management User Guide_. \n\n**Caution:** This is a legacy property. For new integrations, use the `ratings.aes.score` property to retrieve the AES value. Existing implementations should plan to migrate to `ratings.aes.score` to ensure future compatibility."
        ratings:
          $ref: '#/components/schemas/Export_Assets_ratings-object'
        tenable_agent_days_since_active:
          type: integer
          description: If `sources` includes `NESSUS_AGENT`, the time in days since the agent last observed the asset.
        resource_tags:
          type: array
          description: "An array of resource tags applicable to the asset. Resource tags are imported from a cloud provider like AWS, Azure, or GCP by a Cloud Discovery Connector and are used to identify cloud assets. \n\nFor more information about resource tags, see [Cloud Resources](https://docs.tenable.com/vulnerability-management/Content/Explore/Assets/exploreAssetsCloudResources.htm) and [Host Assets](https://docs.tenable.com/vulnerability-management/Content/Explore/Assets/ExploreAssetsHosts.htm) in the Tenable Vulnerability Management User Guide."
          items:
            $ref: '#/components/schemas/Export_Assets_resource_tags'
    Export_Assets_resource_tags:
      type: object
      properties:
        key:
          type: string
          description: The resource tag key.
        value:
          type: string
          description: The resource tag value.
    Export_Assets_tags:
      type: object
      properties:
        uuid:
          type: string
          description: The unique identifier of the tag.
        key:
          type: string
          description: The tag key, representing the category portion of a category:value tag pair.
        value:
          type: string
          description: The tag value, representing the value portion of a category:value tag pair.
        added_by:
          type: string
          description: The unique identifier of the user who assigned the tag to the asset.
        added_at:
          type: string
          description: A timestamp in ISO 8601 format indicating the date and time the tag was assigned to the asset.
    Export_Assets_azure:
      type: object
      properties:
        vm_id:
          type: string
          description: The unique identifier of the Microsoft Azure virtual machine instance. For more information, see "Accessing and Using Azure VM Unique ID" in the Microsoft Azure documentation.
        resource_id:
          type: string
          description: The unique identifier of the resource in the Azure Resource Manager. For more information, see the Azure Resource Manager Documentation.
    Export_Assets_ratings-object:
      type: object
      description: A list of metrics that provide a comprehensive view of asset exposure and prioritization. Currently, the available metrics include the Asset Criticality Rating (ACR), which measures the relative business importance of an asset, and the Asset Exposure Score (AES), which quantifies the risk exposure of an asset based on its vulnerabilities.
      properties:
        acr:
          description: "The Tenable-defined Asset Criticality Rating (ACR) assigned to the asset. This score, ranging from 1 to 10, reflects the relative importance of the asset to your organization, with higher values indicating more critical assets. In Lumin, the ACR is calculated using an algorithm based on the [asset profile](http://docs.tenable.com/vulnerability-management/Content/Explore/asset-types.htm). \n\nFor more details, see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the _Tenable Vulnerability Management User Guide_."
          type: object
          properties:
            score:
              description: The Asset Criticality Rating (ACR) value.
              type: number
              format: float
              maximum: 10
              minimum: 0
        aes:
          description: "The Tenable-defined Asset Exposure Score (AES) assigned to the asset. This score, ranging from 1 to 1000, represents how exposed an asset is based on a weighted calculation of its [Vulnerability Priority Rating (VPR)](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm#VPR) and [Asset Criticality Rating (ACR)](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm#ACR). Higher values indicate greater exposure. \n\nFor more details, see [Lumin Metrics](https://docs.tenable.com/vulnerability-management/Content/Lumin/LuminMetrics.htm) in the _Tenable Vulnerability Management User Guide_."
          type: object
          properties:
            score:
              description: The Asset Exposure Score (AES) value.
              type: number
              format: float
              maximum: 1000
              minimum: 0
    Export_Assets_open_ports:
      type: object
      properties:
        port:
          type: integer
          description: The open port number.
        protocol:
          type: string
          description: The communication protocol corresponding to the open port.
        service_names:
          type: array
          description: The names of the services associated with the open port.
          items:
            type: string
        first_seen:
          type: string
          description: The ISO timestamp when the source first detected the open port on the asset.
        last_seen:
          type: string
          description: The ISO timestamp when the source last detected the open port on the asset.
    Export_Assets_timestamps:
      type: object
      description: Timestamps associated with the asset.
      properties:
        created_at:
          type: string
          description: The date and time when Tenable Vulnerability Management created the asset record.
        updated_at:
          type: string
          description: The date and time when the asset record was last updated.
        deleted_at:
          type: string
          description: The date and time a user deleted the asset record. After deletion, the asset record is retained until it ages out of the license count.
        terminated_at:
          type: string
          description: The date and time the asset was terminated from a cloud platform (for example, Amazon Web Services [AWS]).
        first_seen:
          type: string
          description: The date and time when a scan first identified the asset.
        last_seen:
          type: string
          description: The date and time of the scan that most recently identified the asset.
    Export_Assets_network_interfaces:
      type: object
      properties:
        name:
          type: string
          description: The name of the interface.
        mac_addresses:
          type: array
          description: The MAC addresses of the interface.
          items:
            type: string
        ipv4s:
          type: array
          description: One or more IPv4 addresses belonging to the interface.
          items:
            type: string
        ipv6s:
          type: array
          description: One or more IPv6 addresses belonging to the interface.
          items:
            type: string
        fqdns:
          type: array
          description: One or more FQDN belonging to the interface.
          items:
            type: string
    Export_Assets_gcp:
      type: object
      properties:
        project_id:
          type: string
          description: The unique identifier of the virtual machine instance in Google Cloud Platform (GCP).
        zone:
          type: string
          description: The customized name of the project to which the virtual machine instance belongs in GCP. For more information see "Creating and Managing Projects" in the GCP documentation.
        instance_id:
          type: string
          description: The zone where the virtual machine instance runs in GCP. For more information, see "Regions and Zones" in the GCP documentation.
    Export_Assets_aws:
      type: object
      properties:
        ec2_instance_ami_id:
          type: string
          description: The unique identifier of the Linux AMI image in Amazon Elastic Compute Cloud (Amazon EC2). For more information, see the Amazon Elastic Compute Cloud documentation.
        ec2_instance_id:
          type: string
          description: The unique identifier of the Linux instance in Amazon EC2. For more information, see the Amazon Elastic Compute Cloud documentation.
        owner_id:
          type: string
          description: The canonical user identifier for the AWS account associated with the virtual machine instance. For example, `79a59df900b949e55d96a1e698fbacedfd6e09d98eacf8f8d5218e7cd47ef2be`. For more information, see AWS Account Identifiers in the AWS documentation.
        availability_zone:
          type: string
          description: The availability zone where Amazon Web Services hosts the virtual machine instance, for example, `us-east-1a``. Availability zones are subdivisions of AWS regions. For more information, see "Regions and Availability Zones" in the AWS documentation.
        region:
          type: string
          description: The region where AWS hosts the virtual machine instance, for example, `us-east-1`. For more information, see "Regions and Availability Zones" in the AWS documentation.
        vpc_id:
          type: string
          description: The unique identifier for the virtual public cloud that hosts the AWS virtual machine instance. For more information, see the Amazon Virtual Private Cloud User Guide.
        ec2_instance_group_name:
          type: string
          description: The unique identifier for the virtual public cloud that hosts the AWS virtual machine instance. For more information, see the Amazon Virtual Private Cloud User Guide.
        ec2_instance_state_name:
          type: string
          description: The state of the virtual machine instance in AWS at the time of the scan.
        ec2_instance_type:
          type: string
          description: The type of instance in AWS EC2.
        subnet_id:
          type: string
          description: The unique identifier of the AWS subnet where the virtual machine instance was running at the time of the scan.
        ec2_product_code:
          type: string
          description: The product code associated with the AMI used to launch the virtual machine instance in AWS EC2.
        ec2_name:
          type: string
          description: The name of the virtual machine instance in AWS EC2.
    Export_Assets_network:
      type: object
      properties:
        network_id:
          type: string
          description: The unique identifier of the network assigned to the scanners that identified the asset. The default network ID is `00000000-0000-0000-0000-000000000000`. For more information about network objects, see [Manage Networks](doc:manage-networks-tio).
        network_name:
          type: string
          description: The name of the network object associated with scanners that identified the asset. The default network name is `Default`. All other network names are user-defined. For more information about network objects, see [Manage Networks](doc:manage-networks-tio).
        bios_uuid:
          type: string
          description: The BIOS UUID associated with the asset.
        ipv4s:
          type: array
          description: A list of IPv4 addresses associated with the asset.
          items:
            type: string
        ipv6s:
          type: array
          description: A list of IPv6 addresses associated with the asset.
          items:
            type: string
        fqdns:
          type: array
          description: A list of fully qualified domain names (FQDNs) associated with the asset.
          items:
            type: string
        mac_addresses:
          type: array
          description: A list of MAC addresses associated with the asset.
          items:
            type: string
        netbios_names:
          type: array
          description: A list of NetBIOS names associated with the asset.
          items:
            type: string
        hostnames:
          type: array
          description: A list of host names associated with the asset.
          items:
            type: string
        ssh_fingerprints:
          type: array
          description: A list of SSH key fingerprints associated with the asset.
          items:
            type: string
        network_interfaces:
          type: array
          description: The network interfaces that scans identified on the asset.
          items:
            $ref: '#/components/schemas/Export_Assets_network_interfaces_v2'
        open_ports:
          type: array
          description: "An array of open ports and their services as reported by the info-level plugins. \n\nFor more information about open ports reported by info-level plugins, see [Relocate Open Port Findings](https://docs.tenable.com/vulnerability-management/Content/Settings/General/General.htm#Relocate-Open-Port-Findings) in the Tenable Vulnerability Management User Guide and the [Relocate Open Port Findings Quick Reference Guide](https://docs.tenable.com/quick-reference/relocate-open-port-findings/)."
          items:
            $ref: '#/components/schemas/Export_Assets_open_ports'
    Export_Assets_third-party-ids:
      type: object
      properties:
        mcafee_epo_guid:
          type: string
          description: The unique identifier of the asset in McAfee ePolicy Orchestrator (ePO). For more information, see the McAfee documentation.
        mcafee_epo_agent_guid:
          type: string
          description: The unique identifier of the McAfee ePO agent that identified the asset. For more information, see the McAfee documentation.
        servicenow_sysid:
          type: string
          description: A list of unique record identifiers for the asset in ServiceNow. For more information, see the ServiceNow documentation.
        bigfix_asset_id:
          type: string
          description: The unique identifiers of the asset in HCL BigFix. For more information, see the HCL BigFix documentation.
        qualys_asset_ids:
          type: array
          description: A list of unique identifiers for the asset in Qualys. For more information, see the Qualys documentation.
          items:
            type: string
        qualys_host_ids:
          type: array
          description: A list of host identifiers for the asset in Qualys. For more information, see the Qualys documentation.
          items:
            type: string
        symantec_ep_hardware_keys:
          type: array
          description: The hardware keys for the asset in Symantec Endpoint Protection.
          items:
            type: string
    Export_Assets_sources:
      type: object
      properties:
        name:
          type: string
          description: "The name of the entity that reported the asset details. Sources can include sensors, connectors, and API imports. Source names can be customized by your organization (for example, you specify a name when you import asset records). If your organization does not customize source names, the system-generated names include:\n - AWS—The asset data was obtained from an Amazon Web Services connector.\n - NESSUS_AGENT—The asset data was obtained from a Tenable Nessus Agent scan.\n - PVS—The asset data was obtained from a Tenable Nessus Network Monitor (NNM) scan.\n - NESSUS_SCAN—The asset data was obtained from a Tenable Nessus scan.\n - WAS—The asset data was obtained from a Web App Scanning scan."
        first_seen:
          type: string
          description: The ISO timestamp when the source first reported the asset.
        last_seen:
          type: string
          description: The ISO timestamp when the source last reported the asset.
    Export_Assets_response-asset-export-jobs:
      description: Information about the export job.
      type: object
      properties:
        uuid:
          type: string
          description: The unique identifier of the asset export request.
        status:
          type: string
          description: "The status of the export request. Possible values include:\n - QUEUED—Tenable Vulnerability Management has queued the export request until it completes other requests currently in process.\n - PROCESSING—Tenable Vulnerability Management has started processing the export request.\n - FINISHED—Tenable Vulnerability Management has completed processing the export request. The list of chunks is complete.\n - CANCELLED—An administrator has cancelled the export request.\n - ERROR—Tenable Vulnerability Management encountered an error while processing the export request. Tenable recommends that you retry the request. If the status persists on retry, contact Support."
        reason:
          type: string
          description: "A human-readable description explaining the reason the export failed. This property is only present when the export status is `ERROR`. Possible values include:\n - \"The export request timed out. Try again.\"\n - \"An unexpected error occurred while processing the export. Try again later.\"\n - \"The export could not be completed. If this issue persists, please contact support.\""
        total_chunks:
          type: integer
          description: The total number of chunks associated with the export job as a whole.
        filters:
          type: object
          description: The filters used in the asset export job request. For a list of possible filters, see the [POST /assets/export](ref:export-assets-v1) and [POST /assets/v2/export](ref:export-assets-v2) endpoints.
          properties: {}
        finished_chunks:
          type: integer
          description: The number of chunks that have been processed and are available for download.
        num_assets_per_chunk:
          type: integer
          description: The number of assets contained in each export chunk.
        created:
          type: integer
          format: int64
          description: The Unix timestamp when the asset export job was created.
    Export_Assets_ErrorResponse:
      type: object
      properties:
        statusCode:
          type: integer
          description: The HTTP status code of the error.
        error:
          type: integer
          description: The standard HTTP error name.
        message:
          type: string
          description: A brief message about the cause of the error.
    Export_Assets_custom_attributes:
      type: object
      properties:
        id:
          type: string
          description: Id of the attribute.
        value:
          type: string
          description: Value of the attribute.
  securitySchemes:
    Bearer:
      type: apiKey
      in: header
      name: Authorization
      description: 'Example: Bearer {{token}}'
