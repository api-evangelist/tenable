  /assets/export/{export_uuid}/chunks/{chunk_id}:
    get:
      summary: Download assets chunk
      description: 'Downloads a specific asset export chunk. Chunks are available for download for up to 24 hours after they have been created. Tenable Vulnerability Management returns a 404 message for expired chunks.


        **Note:** This endpoint can be used to download asset chunks generated by either the [Export assets v1](ref:export-assets-v1) endpoint or the [Export assets v2](ref:export-assets-v2) endpoint. However, the response model differs between the two versions. The two response models are provided in the response section below. <div class="perms-callout">Requires the Basic [16] user role or the `VM.VM_EXPLORE.VM_EXPLORE.EXPORT` custom role privilege. See [Roles](doc:roles).</div>'
      operationId: exports-assets-download-chunk
      tags:
      - Exports (Assets)
      parameters:
      - description: The unique identifier (UUID) of the export request for which you want to download a chunk.
        required: true
        name: export_uuid
        in: path
        schema:
          type: string
      - description: The specific chunk number to retrieve from the export request.
        required: true
        name: chunk_id
        in: path
        schema:
          type: integer
          format: int32
      responses:
        '200':
          description: Returned if the assets export chunk was retrieved successfully. The assets export v2 response body excludes properties if the property is empty in the asset record.
          content:
            application/json:
              schema:
                oneOf:
