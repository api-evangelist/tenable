          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export_Assets_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: Invalid credentials.
        '403':
          description: Returned if you do not have permission to download asset chunks.
        '404':
          description: Returned if Tenable Vulnerability Management could not find a chunk with the specified UUID or if the chunk with the specified UUID has expired.
        '429':
          description: Returned if you attempt to send too many requests in a specific period of time. For more information, see [Rate Limiting](doc:rate-limiting).
          content:
            text/html:
              examples:
                response:
                  value: "<html>\n\n<head>\n    <title>429 Too Many Requests</title>\n</head>\n\n<body bgcolor=\"white\">\n    <center>\n        <h1>429 Too Many Requests</h1>\n    </center>\n    <hr>\n    <center>nginx</center>\n</body>\n\n</html>"
        '500':
          description: Returned if an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export_Assets_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
      security:
      - Export_Assets_cloud: []
  /assets/export/{export_uuid}/cancel:
    post:
      summary: Cancel asset export
      description: Cancels the specified assets export job. If you cancel an export job, Tenable Vulnerability Management finishes any chunk that is currently processing, terminates the processing of any unprocessed chunks, and updates the job status to `CANCELLED`. If a canceled job includes completed chunks, you can download those chunks for three days after cancellation.<div class="perms-callout">Requires the Basic [16] user role or the `VM.VM_EXPLORE.VM_EXPLORE.EXPORT` custom role privilege. See [Roles](doc:roles).</div>
      operationId: exports-assets-export-cancel
      tags:
      - Exports (Assets)
      parameters:
      - description: The UUID for the export request.
        required: true
        name: export_uuid
        in: path
        schema:
          type: string
      responses:
        '200':
          description: Returned if the specified export request was cancelled successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: Text describing the export job status, `CANCELLED`.
              examples:
                response:
                  value:
                    status: CANCELLED
        '400':
          description: Returned if your request message is invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The HTTP error code.
                  message:
                    type: string
                    description: "Text describing the error condition Tenable Vulnerability Management encountered. Possible values include:\n\n - Cannot cancel a completed job\n - Export UUID is invalid"
              examples:
                response:
                  value:
                    status: 400
                    message: Cannot cancel a completed job
        '401':
          description: Returned if the API keys specified in your request are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export_Assets_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 401
                    error: Unauthorized
                    message: Invalid credentials.
        '404':
          description: Returned if Tenable Vulnerability Management cannot find an export job with the specified UUID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: integer
                    description: The HTTP error code.
                  message:
                    type: string
                    description: Text describing the error condition Tenable Vulnerability Management encountered.
              examples:
                response:
                  value:
                    status: 404
                    message: 'Job with UUID: {export_uuid} not found'
        '429':
          description: Returned if you attempt to send too many requests in a specific period of time. For more information, see [Rate Limiting](doc:rate-limiting).
          content:
            text/html:
              examples:
                response:
                  value: "<html>\n\n<head>\n    <title>429 Too Many Requests</title>\n</head>\n\n<body bgcolor=\"white\">\n    <center>\n        <h1>429 Too Many Requests</h1>\n    </center>\n    <hr>\n    <center>nginx</center>\n</body>\n\n</html>"
        '500':
          description: Returned if an internal error occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Export_Assets_ErrorResponse'
              examples:
                response:
                  value:
                    statusCode: 500
                    error: Internal Server Error
                    message: An internal server error occurred. Please wait a moment and try your request again.
      security:
      - Export_Assets_cloud: []
components:
  schemas:
    Export_Assets_network_interfaces_v2:
      type: object
      properties:
        name:
          type: string
          description: The name of the interface.
        mac_addresses:
          type: array
          description: The MAC addresses of the interface.
          items:
            type: string
        ipv4s:
          type: array
          description: One or more IPv4 addresses belonging to the interface.
          items:
            type: string
        ipv6s:
          type: array
          description: One or more IPv6 addresses belonging to the interface.
          items:
            type: string
        fqdns:
          type: array
          description: One or more FQDN belonging to the interface.
          items:
            type: string
        virtual:
          type: boolean
          description: True if network interface is a virtual interface.
        aliased:
          type: boolean
          description: True if network interface is a virtual interface.
    Export_Assets_scan:
      type: object
      properties:
        first_scan_time:
          type: string
          description: The date and time of the first scan run against the asset.
        last_scan_time:
          type: string
          description: The date and time of the last scan run against the asset.
        last_authenticated_scan_date:
          type: string
          description: The date and time of the most recent credentialed scan performed on the asset.
        last_licensed_scan_date:
          type: string
          description: The date and time of the last scan that identified the asset as licensed. Tenable Vulnerability Management categorizes an asset as licensed if a scan of that asset has returned results from a non-discovery plugin within the last 90 days.
        last_scan_id:
          type: string
          format: uuid
          description: The unique identifier of the scan configuration used for the most recent scan of the asset.
        last_schedule_id:
          type: string
          description: The `schedule_uuid` of the scan schedule used for the most recent scan of the asset.
        last_authentication_attempt_date:
          type: string
          description: The date and time a scan last attempted to authenticate using SSH (on Unix-based systems) or SMB (on Windows systems).
        last_authentication_success_date:
          type: string
          description: 'The date and time a scan last authenticated successfully. Note: This property is not updated by Tenable Agent scans, as agents do not perform login-based authentication.'
        last_authentication_scan_status:
          type: string
          description: The last authentication scan status.
        last_scan_target:
          type: string
          description: The last scan target which was scanned.
    Export_Assets_response-assets-chunk-v2:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the asset in Tenable Vulnerability Management. Use this value as the unique key for the asset.
        has_agent:
          type: boolean
          description: Specifies whether a Nessus agent scan identified the asset.
        has_plugin_results:
          type: boolean
          description: Specifies whether the asset has plugin results associated with it.
        agent_uuid:
          type: string
          description: This property represents the `tenable_uuid`. This identifier can originate from either an agent or a credentialed remote Nessus scan. If no agent is present on the asset, a UUID is assigned by Tenable Vulnerability Management during a credentialed scan when the [Create unique identifier on hosts scanned with credentials](https://docs.tenable.com/vulnerability-management/Content/Scans/AdvancedSettings.htm) option is enabled. Note that no UUID is set for an uncredentialed non-agent scans.
        is_licensed:
          type: boolean
          description: Specifies whether the asset has plugin results associated with it.
        terminated_by:
          type: string
          description: The user who terminated the AWS instance of the asset.
        deleted_by:
          type: string
          description: The user who deleted the asset record.
        types:
          type: array
          description: The type of asset.
          items:
            type: string
        agent_names:
          type: array
          description: The names of any Nessus agents that scanned and identified the asset.
          items:
            type: string
        operating_systems:
          type: array
          description: The operating systems that scans have associated with the asset record.
          items:
            type: string
        system_types:
          type: array
          description: The system types as reported by Plugin ID 54615. Possible values include `router`, `general-purpose`, `scan-host`, `embedded`, and `firewall`.
          items:
            type: string
        manufacturer_tpm_ids:
          type: array
          description: The manufacturer's unique identifiers of the Trusted Platform Module (TPM) associated with the asset.
          items:
            type: string
        installed_software:
          type: array
          description: 'A list of Common Platform Enumeration (CPE) values that represent software applications a scan identified as present on an asset. This attribute supports the CPE 2.2 format. For more information, see the "Component Syntax" section of the [CPE Specification, Version 2.2](https://cpe.mitre.org/files/cpe-specification_2.2.pdf). For assets identified in Tenable scans, this attribute contains data only if a scan using [Nessus Plugin ID 45590](https://www.tenable.com/plugins/nessus/45590) has evaluated the asset.


            **Note:** If no scan detects an application within 30 days of the scan that originally detected the application, Tenable Vulnerability Management considers the detection of that application expired. As a result, the next time a scan evaluates the asset, Tenable Vulnerability Management removes the expired application from the installed_software attribute. This activity is logged as a `remove` type of `attribute_change` update in the asset activity log.'
          items:
            type: string
        is_public:
          type: boolean
          description: Specifies whether if the asset is an internet-facing and accessible externally.
        network_device_serial_identifier:
          type: string
          description: Specifies network device serial identifier.
        custom_attributes:
          type: array
          description: List of custom-attributes associated with the asset.
          items:
            $ref: '#/components/schemas/Export_Assets_custom_attributes'
        sources:
          type: array
          description: "The sources of the scans that identified the asset. An asset source is the entity that reported the asset details. Sources can include sensors, connectors, and API imports. If your request specifies multiple sources, Tenable Vulnerability Management returns all assets seen by any of the specified sources.\n\nThe items in the `sources` array must correspond to the names of the sources as defined in your organization's implementation of Tenable Vulnerability Management. Commonly used names include:\n - AWS—The asset data was obtained from an Amazon Web Services connector.\n - NESSUS_AGENT—The asset data was obtained from a Tenable Nessus Agent scan.\n - PVS—The asset data from a Tenable Nessus Network Monitor (NNM) scan.\n - NESSUS_SCAN—The asset data was obtained from a Tenable Nessus scan.\n - WAS—The asset data was obtained from a Tenable Web App Scanning scan."
