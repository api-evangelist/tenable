openapi: 3.2.0
info:
  title: Identity Exposure Reason API
  description: API to interact with Identity Exposure.
  version: production
servers:
- url: '{protocol}://customer.tenable.ad'
  variables:
    protocol:
      default: https
tags:
- name: Reason
  description: The reason why a AD object is marked as deviant
paths:
  /api/reasons:
    get:
      summary: Retrieve all reason instances
      description: 'Required license type: ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the get /reasons response
                type: array
                items:
                  description: Reason
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - codename
                  properties:
                    id:
                      type: number
                    codename:
                      type: string
                    name:
                      type:
                      - string
                      - 'null'
                      default: null
                    description:
                      type:
                      - string
                      - 'null'
                      default: null
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Reason
      x-tenablead-required-product-license-type:
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiReasons
      x-operation-id-source: derived
  /api/reasons/{id}:
    get:
      summary: Get reason instance by id
      description: 'Required license type: ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Reason
                type: object
                additionalProperties: false
                required:
                - id
                - codename
                properties:
                  id:
                    type: number
                  codename:
                    type: string
                  name:
                    type:
                    - string
                    - 'null'
                    default: null
                  description:
                    type:
                    - string
                    - 'null'
                    default: null
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Reason
      x-tenablead-required-product-license-type:
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: id
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiReasonsById
      x-operation-id-source: derived
  /api/profiles/{profileId}/checkers/{checkerId}/reasons:
    get:
      summary: Retrieve all reason instances that have deviances for a specific profile and…
      description: 'Required license type: ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates GET /profiles/:profileId/checkers/:checkerId/reasons response
                type: array
                items:
                  description: Reason
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - codename
                  properties:
                    id:
                      type: number
                    codename:
                      type: string
                    name:
                      type:
                      - string
                      - 'null'
                      default: null
                    description:
                      type:
                      - string
                      - 'null'
                      default: null
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Reason
      x-tenablead-required-product-license-type:
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: profileId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: checkerId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiProfilesByProfileIdCheckersByCheckerIdReasons
      x-operation-id-source: derived
  /api/profiles/{profileId}/infrastructures/{infrastructureId}/directories/{directoryId}/events/{eventId}/reasons:
    get:
      summary: Retrieve all reason instances for which we have deviances for a specific…
      description: 'Required license type: ioe'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                description: Validates the GET /profiles/:profileId/infrastructures/:infrastructureId/directories/:directoryId/events/:eventId/reasons response
                type: array
                items:
                  description: Reason
                  type: object
                  additionalProperties: false
                  required:
                  - id
                  - codename
                  properties:
                    id:
                      type: number
                    codename:
                      type: string
                    name:
                      type:
                      - string
                      - 'null'
                      default: null
                    description:
                      type:
                      - string
                      - 'null'
                      default: null
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      tags:
      - Reason
      x-tenablead-required-product-license-type:
      - ioe
      parameters:
      - name: x-api-key
        description: The user's API key
        in: header
        schema:
          type: string
          default: put-your-api-key-here
        required: true
        deprecated: false
      - name: profileId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: infrastructureId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: directoryId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      - name: eventId
        in: path
        schema:
          type: string
          pattern: ^[0-9]+$
          x-patternError: should be a numerical string
        required: true
        deprecated: false
      security:
      - ApiKey: []
      operationId: getApiProfilesByProfileIdInfrastructuresByInfrastructureIdDirectoriesByDirectoryIdEventsByEventIdReasons
      x-operation-id-source: derived
components:
  securitySchemes:
    ApiKey:
      name: x-api-key
      description: The user's API key
      in: header
      type: apiKey
x-readme:
  explorer-enabled: true
  proxy-enabled: true
